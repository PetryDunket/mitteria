ломанной гардой. Каждый прибыл по своему делу. К вечеру один из них может оказаться свидетелем ссоры, поручителем незнакомца или попутчиком человека, которого ещё утром не знал.\u003c/p>\n\u003cp>Так начинается знакомство с Миттерией. Её державы видны издалека — по крепостям, знамёнам и огромной северной стене. Повседневная жизнь раскрывается ближе: в шве хорошо подогнанного кафтана, в торговом договоре с несколькими печатями, в празднике, ради которого деревня откладывает тяжёлую работу. Здесь помнят войны, спорят о богах, берегут семейные мастерские и отправляются в путь, надеясь вернуться с чем-то большим, чем дорожная пыль.\u003c/p>\n\u003cp>Эта книга знакомит с известными землями и их обитателями. Для одного героя они станут родиной, для другого — местом службы, для третьего — первой чужой страной. Мир уже менялся от человеческих решений и поступков других народов. Теперь в его историю могут войти новые имена.\u003c/p>","plain":"У городских ворот телега с овечьей шерстью ждёт, пока писарь пересчитает тюки. Рядом наёмник сушит над жаровней промокшие перчатки, паломница проверяет узел на дорожной сумке, а подмастерье несёт в мастерскую чужой меч со сломанной гардой. Каждый прибыл по своему делу. К вечеру один из них может оказаться свидетелем ссоры, поручителем незнакомца или попутчиком человека, которого ещё утром не знал. Так начинается знакомство с Миттерией. Её державы видны издалека — по крепостям, знамёнам и огромной северной стене. Повседневная жизнь раскрывается ближе: в шве хорошо подогнанного кафтана, в торговом договоре с несколькими печатями, в празднике, ради которого деревня откладывает тяжёлую работу. Здесь помнят войны, спорят о богах, берегут семейные мастерские и отправляются в путь, надеясь вернуться с чем-то большим, чем дорожная пыль. Эта книга знакомит с известными землями и их обитателями. Для одного героя они станут родиной, для другого — местом службы, для третьего — первой чужой страной. Мир уже менялся от человеческих решений и поступков других народов. Теперь в его историю могут войти новые имена.","excerpt":"У городских ворот телега с овечьей шерстью ждёт, пока писарь пересчитает тюки. Рядом наёмник сушит над жаровней промокшие перчатки, паломница проверяет узел на дорожной сумке, а…","wordCount":164,"readingMinutes":1,"facts":[]},{"id":"navigation","title":"Как пользоваться книгой","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Начните с \u003ca class=\"wiki-link\" href=\"#reading\">карты и прошлого мира\u003c/a>, затем выберите интересующую \u003ca class=\"wiki-link\" href=\"#states\">страну\u003c/a>. О происхождении, занятиях и повседневной жизни рассказывает глава \u003ca class=\"wiki-link\" href=\"#peoples\">о народах и обществах\u003c/a>. \u003ca class=\"wiki-link\" href=\"#religions\">Вера\u003c/a> и \u003ca class=\"wiki-link\" href=\"#magic-and-forest\">магия\u003c/a> помогают понять местные обычаи. В главе \u003ca class=\"wiki-link\" href=\"#travellers\">для путника\u003c/a> собраны сведения о дороге, работе и подготовке героя, а \u003ca class=\"wiki-link\" href=\"#characters\">память о прежних авантюристах\u003c/a> связывает книгу с уже начавшейся историей. Быстро найти нужное имя поможет \u003ca class=\"wiki-link\" href=\"#index\">указатель\u003c/a>.\u003c/p>","plain":"Начните с карты и прошлого мира, затем выберите интересующую страну. О происхождении, занятиях и повседневной жизни рассказывает глава о народах и обществах. Вера и магия помогают понять местные обычаи. В главе для путника собраны сведения о дороге, работе и подготовке героя, а память о прежних авантюристах связывает книгу с уже начавшейся историей. Быстро найти нужное имя поможет указатель.","excerpt":"Начните с карты и прошлого мира, затем выберите интересующую страну. О происхождении, занятиях и повседневной жизни рассказывает глава о народах и обществах. Вера и магия помогают…","wordCount":58,"readingMinutes":1,"facts":[]},{"id":"world-name","title":"Имя мира","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Название Миттерии связывают с \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митрой\u003c/a>, которую её последователи почитают как создательницу богов. Имя знакомо далеко за пределами её церковных владений, хотя почитание Митры разделяют далеко не все. На торговой площади можно услышать несколько версий истории мира, прежде чем будет закрыта одна лавка.\u003c/p>","plain":"Название Миттерии связывают с Митрой, которую её последователи почитают как создательницу богов. Имя знакомо далеко за пределами её церковных владений, хотя почитание Митры разделяют далеко не все. На торговой площади можно услышать несколько версий истории мира, прежде чем будет закрыта одна лавка.","excerpt":"Название Миттерии связывают с Митрой, которую её последователи почитают как создательницу богов. Имя знакомо далеко за пределами её церковных владений, хотя почитание Митры…","wordCount":42,"readingMinutes":1,"facts":[]},{"id":"world-map","title":"Карта известных земель","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cfigure class=\"article-picture\">\u003cbutton type=\"button\" data-image-key=\"map\" aria-label=\"Открыть карту во весь экран\">\u003cimg data-embedded-image=\"map\" alt=\"Карта известных земель Миттерии\">\u003c/button>\u003cfigcaption>Исходная карта мира · нажмите, чтобы увеличить и перемещать\u003c/figcaption>\u003c/figure>\n\u003cp>На западе лежат \u003ca class=\"wiki-link entity-link\" href=\"#elfsweyr\">Эльфсвейр\u003c/a> и \u003ca class=\"wiki-link entity-link\" href=\"#valenwood\">Валенвуд\u003c/a>. Север занимает \u003ca class=\"wiki-link entity-link\" href=\"#dun-moroz\">Дун Мороз\u003c/a>, отделённый огромной стеной от соседних земель. В центральной части карты находятся человеческие королевства, имперские владения и церковные территории. Юго-запад принадлежит кланам драконорождённых. Южный полуостров разделён между независимыми республиками; дальше расположены два небольших острова и города пустынной конфедерации. На нижнем краю видна вулканическая суша \u003ca class=\"wiki-link entity-link\" href=\"#zvas\">Зваса\u003c/a>.\u003c/p>\n\u003cp>Пунктир обозначает политические границы. Иногда за ним начинается иная власть с другими пошлинами, иногда — область, где государь, изображённый на монете, известен лишь по рассказам. Место может принадлежать державе по праву, но жить под властью местных общин. Поэтому дорожный совет опытного перевозчика бывает полезнее рассуждений человека, который видел страну только на рисунке.\u003c/p>\n\u003cp>Горы особенно сильно влияют на отношения держав. Они прикрывают республики от крупного вторжения и разделяют земли империи и драконорождённых. Передвижение армии требует перевезти припасы, повозки и осадные орудия. Узкая тропа, удобная для пастуха, может оказаться непреодолимым препятствием для целого похода. Морские пути, в свою очередь, связывают земли, которые по суше разделяет длинный обход.\u003c/p>","plain":"На западе лежат Эльфсвейр и Валенвуд. Север занимает Дун Мороз, отделённый огромной стеной от соседних земель. В центральной части карты находятся человеческие королевства, имперские владения и церковные территории. Юго-запад принадлежит кланам драконорождённых. Южный полуостров разделён между независимыми республиками; дальше расположены два небольших острова и города пустынной конфедерации. На нижнем краю видна вулканическая суша Зваса. Пунктир обозначает политические границы. Иногда за ним начинается иная власть с другими пошлинами, иногда — область, где государь, изображённый на монете, известен лишь по рассказам. Место может принадлежать державе по праву, но жить под властью местных общин. Поэтому дорожный совет опытного перевозчика бывает полезнее рассуждений человека, который видел страну только на рисунке. Горы особенно сильно влияют на отношения держав. Они прикрывают республики от крупного вторжения и разделяют земли империи и драконорождённых. Передвижение армии требует перевезти припасы, повозки и осадные орудия. Узкая тропа, удобная для пастуха, может оказаться непреодолимым препятствием для целого похода. Морские пути, в свою очередь, связывают земли, которые по суше разделяет длинный обход.","excerpt":"На западе лежат Эльфсвейр и Валенвуд. Север занимает Дун Мороз, отделённый огромной стеной от соседних земель. В центральной части карты находятся человеческие королевства,…","wordCount":159,"readingMinutes":1,"facts":[]},{"id":"barbarian-lands","title":"Восточная граница","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Мёртвыми землями Варваров восток называют в западных странах. Земли населены; их мрачное имя выросло из отчуждения и страха перед пограничной угрозой. У жителя далёкого города сведения о востоке часто сводятся к военным известиям, привезённым товарам и пересказам чужих путешествий. Надёжность таких рассказов неодинакова.\u003c/p>\n\u003cp>Пограничное противостояние особенно заметно в судьбе \u003ca class=\"wiki-link entity-link\" href=\"#teutonia\">Тевтонии\u003c/a>. Её орден держит рубеж, а соседние державы обсуждают поддержку, поставки и собственную безопасность. Для возчика, доставляющего железо в крепость, далёкая политика становится вполне ощутимой: нужно узнать, открыта ли дорога, кто принимает груз и где получить обратное поручение. За пределами этой знакомой пограничной картины начинается гораздо менее известный мир.\u003c/p>","plain":"Мёртвыми землями Варваров восток называют в западных странах. Земли населены; их мрачное имя выросло из отчуждения и страха перед пограничной угрозой. У жителя далёкого города сведения о востоке часто сводятся к военным известиям, привезённым товарам и пересказам чужих путешествий. Надёжность таких рассказов неодинакова. Пограничное противостояние особенно заметно в судьбе Тевтонии. Её орден держит рубеж, а соседние державы обсуждают поддержку, поставки и собственную безопасность. Для возчика, доставляющего железо в крепость, далёкая политика становится вполне ощутимой: нужно узнат :"Последствие","value":"Бегство жителей за море"}],"tags":["Континент","Катастрофа","Тифлинги"]},{"id":"history-before-borders","title":"Земли прежде нынешних границ","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Миттерия помнит больше границ, чем нанесено на сегодняшнюю карту. Старые названия живут в названиях дорог, в родословных, в песнях, которые соседи заканчивают разными словами. Владение долиной могли подтвердить победа, брачный договор или несколько поколений спокойной жизни. Поэтому рассказ о прошлом часто начинается с вопроса: кто его рассказывает и какое право хочет обосновать?\u003c/p>\n\u003cp>Раннюю историю обжитых земель удобно называть временем ремесла и дорог. Поселения росли вокруг переправ, плодородных участков и мест, где можно было добывать нужный материал. Рынок соединял тех, кого разделяли язык и обычаи. За торговлей приходили охрана, сборщики пошлин и властители, обещавшие безопасность. Из таких связей складывались будущие владения; не все они стали королевствами. На южном полуострове самостоятельность городов пережила многие соседние династии.\u003c/p>","plain":"Миттерия помнит больше границ, чем нанесено на сегодняшнюю карту. Старые названия живут в названиях дорог, в родословных, в песнях, которые соседи заканчивают разными словами. Владение долиной могли подтвердить победа, брачный договор или несколько поколений спокойной жизни. Поэтому рассказ о прошлом часто начинается с вопроса: кто его рассказывает и какое право хочет обосновать? Раннюю историю обжитых земель удобно называть временем ремесла и дорог. Поселения росли вокруг переправ, плодородных участков и мест, где можно было добывать нужный материал. Рынок соединял тех, кого разделяли язык и обычаи. За торговлей приходили охрана, сборщики пошлин и властители, обещавшие безопасность. Из таких связей складывались будущие владения; не все они стали королевствами. На южном полуострове самостоятельность городов пережила многие соседние династии.","excerpt":"Миттерия помнит больше границ, чем нанесено на сегодняшнюю карту. Старые названия живут в названиях дорог, в родословных, в песнях, которые соседи заканчивают разными словами.…","wordCount":114,"readingMinutes":1,"facts":[]},{"id":"history-northern-wall","title":"Северная стена","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>На севере нынешнего \u003ca class=\"wiki-link entity-link\" href=\"#dun-moroz\">Дун Мороза\u003c/a> некогда соседствовали гномы, дворфы и голиафы; последних было особенно много. Долгое внутреннее противостояние завершилось союзом гномов и дворфов и изгнанием голиафов. Затем последовали попытки возвращения. Только после этой череды столкновений возник укреплённый рубеж, который теперь кажется едва ли не частью самого северного пейзажа.\u003c/p>\n\u003cp>Для объединённого государства стена означает безопасность и способность действовать сообща. Для изгнанников она напоминает о потерянной земле. Камень сохранил итог войны лучше, чем её причины: общая история существует, а единого взгляда на справедливость случившегося нет. Нынешний союз гномов и дворфов вырос из этого прошлого и по-прежнему определяет северную политику.\u003c/p>","plain":"На севере нынешнего Дун Мороза некогда соседствовали гномы, дворфы и голиафы; последних было особенно много. Долгое внутреннее противостояние завершилось союзом гномов и дворфов и изгнанием голиафов. Затем последовали попытки возвращения. Только после этой череды столкновений возник укреплённый рубеж, который теперь кажется едва ли не частью самого северного пейзажа. Для объединённого государства стена означает безопасность и способность действовать сообща. Для изгнанников она напоминает о потерянной земле. Камень сохранил итог войны лучше, чем её причины: общая история существует, а единого взгляда на справедливость случившегося нет. Нынешний союз гномов и дворфов вырос из этого прошлого и по-прежнему определяет северную политику.","excerpt":"На севере нынешнего Дун Мороза некогда соседствовали гномы, дворфы и голиафы; последних было особенно много. Долгое внутреннее противостояние завершилось союзом гномов и дворфов и…","wordCount":97,"readingMinutes":1,"facts":[{"label":"Вид","value":"Протяжённый северный укреплённый рубеж"},{"label":"Строители","value":"Гномы и дворфы"},{"label":"История","value":"Возведён после изгнания голиафов и попыток возвращения"}],"tags":["Север","Стена","История"],"imageKey":"north"},{"id":"history-crowns-church","title":"Время корон и церковных владений","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Укрепление человеческих держав сопровождалось ростом храмовых общин. Святилища собирали пожертвования, принимали паломников, хранили записи обещаний и становились местами, где незнакомые люди находили посредников. Учение \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митры\u003c/a> связывало множество местных обычаев представлением о едином начале: её последователи утверждали, что она создала богов и передала им дальнейшее творение.\u003c/p>\n\u003cp>В \u003ca class=\"wiki-link entity-link\" href=\"#holy-region\">Божьей области\u003c/a> духовная власть стала государственной. Ватитан сделался центром церкви, добивающейся признания Митры за пределами собственных владений. Её возвышение изменило дипломатию, но не объединило мир в одной вере. Эльфийские острова, \u003ca class=\"wiki-link entity-link\" href=\"#dun-moroz\">Дун Мороз\u003c/a> и земли драконорождённых сохранили свои традиции. Среди человеческих правителей одни искали церковной поддержки, другие довольствовались осторожными формулами признания.\u003c/p>","plain":"Укрепление человеческих держав сопровождалось ростом храмовых общин. Святилища собирали пожертвования, принимали паломников, хранили записи обещаний и становились местами, где незнакомые люди находили посредников. Учение Митры связывало множество местных обычаев представлением о едином начале: её последователи утверждали, что она создала богов и передала им дальнейшее творение. В Божьей области духовная власть стала государственной. Ватитан сделался центром церкви, добивающейся признания Митры за пределами собственных владений. Её возвышение изменило дипломатию, но не объединило мир в одной вере. Эльфийские острова, Дун Мороз и земли драконорождённых сохранили свои традиции. Среди человеческих правителей одни искали церковной поддержки, другие довольствовались осторожными формулами признания.","excerpt":"Укрепление человеческих держав сопровождалось ростом храмовых общин. Святилища собирали пожертвования, принимали паломников, хранили записи обещаний и становились местами, где…","wordCount":96,"readingMinutes":1,"facts":[]},{"id":"history-empire","title":"Рождение империи","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>В пределах нынешнего \u003ca class=\"wiki-link entity-link\" href=\"#octanius\">Октаниуса\u003c/a> прежде существовали четыре королевства: Аврелия со столицей в Аврелоне, Вестария с Вестраном, Кардания с Карденом и Миреллия с Миреллом. Их объединение произошло военным путём. Победы династии Октаниусов превратили несколько соседних престолов в одну имперскую власть; завоевание завершилось раньше, чем исчезли местные привычки и память о прежних коронах.\u003c/p>\n\u003cp>Старые имена остались полезны и подданным, и правителям. Вестарский купец мог считать себя имперцем и одновременно предпочитать земляков; наместник — опираться на древний городской престиж. Октаниусы продолжают править, расширять влияние и искать новые приобретения. Полная поддержка учения \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митры\u003c/a> связывает их с Ватитаном: церковное признание придаёт завоеваниям вид законного дела.\u003c/p>\n\u003cp>Пока империя покоряла соседей, \u003ca class=\"wiki-link entity-link\" href=\"#bretnos\">Бретнос\u003c/a> и \u003ca class=\"wiki-link entity-link\" href=\"#normania\">Нормания\u003c/a> заключили оборонный союз и подготовились к её дальнейшему продвижению. На других направлениях большую армию задерживают горы и укреплённые города. Так наступила нынешняя пора: сильная империя располагает многими средствами давления, но каждый следующий шаг требует всё более тяжёлого расчёта.\u003c/p>","plain":"В пределах нынешнего Октаниуса прежде существовали четыре королевства: Аврелия со столицей в Аврелоне, Вестария с Вестраном, Кардания с Карденом и Миреллия с Миреллом. Их объединение произошло военным путём. Победы династии Октаниусов превратили несколько соседних престолов в одну имперскую власть; завоевание завершилось раньше, чем исчезли местные привычки и память о прежних коронах. Старые имена остались полезны и подданным, и правителям. Вестарский купец мог считать себя имперцем и одновременно предпочитать земляков; наместник — опираться на древний городской престиж. Октаниусы продолжают править, расширять влияние и искать новые приобретения. Полная поддержка учения Митры связывает их с Ватитаном: церковное признание придаёт завоеваниям вид законного дела. Пока империя покоряла соседей, Бретнос и Нормания заключили оборонный союз и подготовились к её дальнейшему продвижению. На других направлениях большую армию задерживают горы и укреплённые города. Так наступила нынешняя пора: сильная империя располагает многими средствами давления, но каждый следующий шаг требует всё более тяжёлого расчёта.","excerpt":"В пределах нынешнего Октаниуса прежде существовали четыре королевства: Аврелия со столицей в Аврелоне, Вестария с Вестраном, Кардания с Карденом и Миреллия с Миреллом. Их…","wordCount":145,"readingMinutes":1,"facts":[]},{"id":"history-closed-crossings","title":"Осень закрытых переправ","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>Покорение Вестарии запомнилось войной за переправы. Военачальники Октаниусов захватили мосты и речные пристани, взяли под охрану мельницы и стали задерживать обозы, следовавшие к Вестрану. Королевская конница ещё могла выходить в поле, но армия теряла возможность получать припасы и собираться в нужном месте. За мешок муки вскоре платили больше, чем прежде за хорошую овцу.\u003c/p>\n\u003cp>Вестран пытался удержаться за стенами. Горожане разбирали торговые навесы на топливо, а семьи солдат стояли у казённых амбаров рядом с беженцами из деревень. Когда город сдался, победители сперва выставили караул у складов, затем потребовали присяги у знати и городских старшин. Капитуляция столицы лишила оставшиеся гарнизоны снабжения и опоры; одни сложили оружие, другие были взяты силой.\u003c/p>\n\u003cp>Октаниусы получили земли, доходы и контроль над путями сообщения. Вестария заплатила разорёнными хозяйствами и годами восстановления. Позднее к мостовым пошлинам добавили сбор на содержание гарнизонов, а большие зерновые склады поставили под надзор имперских чиновников. Эти порядки пережили сам поход. Для двора Осень закрытых переправ стала примером расчётливой победы; для вестарских семей — временем, когда хлеб делили тоньше, а обещания властей слушали осторожнее.\u003c/p>","plain":"Покорение Вестарии запомнилось войной за переправы. Военачальники Октаниусов захватили мосты и речные пристани, взяли под охрану мельницы и стали задерживать обозы, следовавшие к Вестрану. Королевская конница ещё могла выходить в поле, но армия теряла возможность получать припасы и собираться в нужном месте. За мешок муки вскоре платили больше, чем прежде за хорошую овцу. Вестран пытался удержаться за стенами. Горожане разбирали торговые навесы на топливо, а семьи солдат стояли у казённых амбаров рядом с беженцами из деревень. Когда город сдался, победители сперва выставили караул у складов, затем потребовали присяги у знати и городских старшин. Капитуляция столицы лишила оставшиеся гарнизоны снабжения и опоры; одни сложили оружие, другие были взяты силой. Октаниусы получили земли, доходы и контроль над путями сообщения. Вестария заплатила разорёнными хозяйствами и годами восстановления. Позднее к мостовым пошлинам добавили сбор на содержание гарнизонов, а большие зерновые склады поставили под надзор имперских чиновников. Эти порядки пережили сам поход. Для двора Осень закрытых переправ стала примером расчётливой победы; для вестарских семей — временем, когда хлеб делили тоньше, а обещания властей слушали осторожнее.","excerpt":"Покорение Вестарии запомнилось войной за переправы. Военачальники Октаниусов захватили мосты и речные пристани, взяли под охрану мельницы и стали задерживать обозы, следовавшие к…","wordCount":170,"readingMinutes":1,"facts":[]},{"id":"history-two-crowns-oath","title":"Клятва двух корон","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>\u003ca class=\"wiki-link entity-link\" href=\"#bretnos\">Бретнос\u003c/a> и \u003ca class=\"wiki-link entity-link\" href=\"#normania\">Нормания\u003c/a> заключили союз, когда походы Октаниусов ещё поглощали соседние владения. На встречу привезли списки повозок, запасов и мостов, способных выдержать тяжёлый обоз. Переговоры запомнились тем, что правители долго спорили о числе лошадей для перевозки зерна. За праздничной клятвой стоял вполне определённый вопрос: сумеет ли один сосед прокормить другого, пока тот держит удар?\u003c/p>\n\u003cp>Договор обязал королевства заранее накапливать припасы и пропускать военные обозы союзника без обычной волокиты на заставах. На угрожаемых направлениях укрепили крепости, расходы на которые разделили обе короны. В гарнизонах появились офицеры связи, знавшие чужие сигналы и порядок передачи приказов. Старые споры о пошлинах не исчезли, но их перестали решать задержанием союзных подвод.\u003c/p>\n\u003cp>Клятва изменила положение ремесленников и пограничных городков: понадобились каменщики, кузнецы, возчики, дополнительные амбары. Сельские общины несли повинности и жаловались на стоимость обороны задолго до появления неприятеля. Эти расходы дали результат: вторжение теперь потребовало бы сломить подготовленный союз, способный поддерживать армии припасами. Праздничный образ двух поднятых корон прижился быстро; прочность соглашения обеспечили склады, дороги и привычка исполнять обязательства.\u003c/p>","plain":"Бретнос и Нормания заключили союз, когда походы Октаниусов ещё поглощали соседние владения. На встречу привезли списки повозок, запасов и мостов, способных выдержать тяжёлый обоз. Переговоры запомнились тем, что правители долго спорили о числе лошадей для перевозки зерна. За праздничной клятвой стоял вполне определённый вопрос: сумеет ли один сосед прокормить другого, пока тот держит удар? Договор обязал королевства заранее накапливать припасы и пропускать военные обозы союзника без обычной волокиты на заставах. На угрожаемых направлениях укрепили крепости, расходы на которые разделили обе короны. В гарнизонах появились офицеры связи, знавшие чужие сигналы и порядок передачи приказов. Старые споры о пошлинах не исчезли, но их перестали решать задержанием союзных подвод. Клятва изменила положение ремесленников и пограничных городков: понадобились каменщики, кузнецы, возчики, дополнительные амбары. Сельские общины несли повинности и жаловались на стоимость обороны задолго до появления неприятеля. Эти расходы дали результат: вторжение теперь потребовало бы сломить подготовленный союз, способный поддерживать армии припасами. Праздничный образ двух поднятых корон прижился быстро; прочность соглашения обеспечили склады, дороги и привычка исполнять обязательства.","excerpt":"Бретнос и Нормания заключили союз, когда походы Октаниусов ещё поглощали соседние владения. На встречу привезли списки повозок, запасов и мостов, способных выдержать тяжёлый обоз.…","wordCount":163,"readingMinutes":1,"facts":[]},{"id":"history-borderlands","title":"Пограничье и нынешние времена","chapterId":"reading","chapterTitle":"Мир и его прошлое","html":"\u003cp>На восточном рубеже церковный орден \u003ca class=\"wiki-link entity-link\" href=\"#teutonia\">Тевтонии\u003c/a> превратил пограничную службу в основу собственной власти. Долгое противостояние усиливает его самостоятельность, однако вассальная зависимость от \u003ca class=\"wiki-link entity-link\" href=\"#holy-region\">Божьей области\u003c/a> сохраняется. Нынешний правитель верен церковному центру. \u003ca class=\"wiki-link entity-link\" href=\"#galich\">Галич\u003c/a> участвует в поддержке рубежа как самостоятельная держава, представляя сотрудничество общим делом защиты.\u003c/p>\n\u003cp>Для жителей приграничья большая политика имеет знакомый облик: обоз со снаряжением, известие о нападении, задержавшийся родственник, новый пост на дороге. Западное название «Мёртвые земли Варваров» выражает страх соседей. Оно не заменяет знания о тех, кто живёт за границей.\u003c/p>","plain":"На восточном рубеже церковный орден Тевтонии превратил пограничную службу в основу собственной власти. Долгое противостояние усиливает его самостоятельность, однако вассальная зависимость от Божьей области сохраняется. Нынешний правитель верен церковному центру. Галич участвует в поддержке рубежа как самостоятельная держава, представляя сотрудничество общим делом защиты. Для жителей приграничья большая политика имеет знакомый облик: обоз со снаряжением, известие о нападении, задержавшийся родственник, новый пост на дороге. Западное название «Мёртвые земли Варваров» выражает страх соседей. Оно не заменяет знания о тех, кто живёт за границей.","excerpt":"На восточном рубеже церковный орден Тевтонии превратил пограничную службу в основу собственной власти. Долгое противостояние усиливает его самостоятельность, однако вассальная…","wordCount":81,"readingMinutes":1,"facts":[]},{"id":"dun-moroz","title":"Объединённое государство Дун Мороз","chapterId":"states","chapterTitle":"Государства и политические образования","html":"\u003cp>В северных городах дом начинается с двойной двери: между створками оставляют место для снега, мокрого плаща и тяжёлых сапог. За стенами гремят мастерские, над крышами сушатся полосы синей шерсти, а на рыночных весах проверяют даже привычный семейный заказ. Дун Мороз живёт ремеслом, добычей камня и металлов, перевозками и подготовкой к долгой зиме. Хорошая вещь здесь должна выдержать передачу внукам; красивая поломка никого не впечатлит.\u003c/p>\n\u003cp>Государство объединяет гномов и дворфов. Общий совет распределяет расходы на укрепления и дороги, оставляя городам собственные порядки. Представители горных поселений требуют вкладываться в безопасные выработки, прибрежные купцы — в склады и причалы. Зимние запасы делают предметом публичного отчёта: недостача зерна касается гораздо большего числа людей, чем неудача одного торговца. Тёплая одежда различается по достатку; дороговизну выдают тонкая выделка кожи и аккуратные застёжки, а не неудобный покрой.\u003c/p>\n\u003cp>У огромной стены иная память. Прежде основную часть населения севера составляли голиафы. После долгого конфликта объединённые гномы и дворфы изгнали их; попытки возвращения предшествовали строительству рубежа. Этот порядок событий известен, но общего согласия о справедливости прошлого нет. Чужака охотно наймут за полезное умение, зато насмешку над семейным трудом запомнят надолго. Митру здесь не признают, сохраняя собственные традиции почитания богов.\u003c/p>","plain":"В северных городах дом начинается с двойной двери: между створками оставляют место для снега, мокрого плаща и тяжёлых сапог. За стенами гремят мастерские, над крышами сушатся полосы синей шерсти, а на рыночных весах проверяют даже привычный семейный заказ. Дун Мороз живёт ремеслом, добычей камня и металлов, перевозками и подготовкой к долгой зиме. Хорошая вещь здесь должна выдержать передачу внукам; красивая поломка никого не впечатлит. Государство объединяет гномов и дворфов. Общий совет распределяет расходы на укрепления и дороги, оставляя городам собственные порядки. Представители горных поселений требуют вкладываться в безопасные выработки, прибрежные купцы — в склады и причалы. Зимние запасы делают предметом публичного отчёта: недостача зерна касается гораздо большего числа людей, чем неудача одного торговца. Тёплая одежда различается по достатку; дороговизну выдают тонкая выделка кожи и аккуратные застёжки, а не неудобный покрой. У огромной стены иная память. Прежде основную часть населения севера составляли голиафы. После долгого конфликта объединённые гномы и дворфы изгнали их; попытки возвращения предшествовали строительству рубежа. Этот порядок событий известен, но общего согласия о справедливости прошлого нет. Чужака охотно наймут за полезное умение, зато насмешку над семейным трудом запомнят надолго. Митру здесь не признают, сохраняя собственные традиции почитания богов.","excerpt":"В северных городах дом начинается с двойной двери: между створками оставляют место для снега, мокрого плаща и тяжёлых сапог. За стенами гремят мастерские, над крышами сушатся…","wordCount":189,"readingMinutes":1,"facts":[{"label":"Государство","value":"Объединение гномов и дворфов"},{"label":"Управление","value":"Общий совет и местные городские порядки"},{"label":"Занятия","value":"Ремесло, добыча камня и металлов, перевозки"},{"label":"Вера","value":"Собственные традиции; Митру не признают"}],"tags":["Север","Гномы и дворфы","Ремесло"],"imageKey":"north"},{"id":"elfsweyr","title":"Эльфсвейр","chapterId":"states","chapterTitle":"Государства и политические образования","images":["elfsweyr"],"html":"\u003cp>Эльфсвейр встречает прибывших вымощенными набережными, закрытыми садами и длинными галереями, где дождь не мешает прогулке. Портовые дома выставляют над дверью знак мастера; хорошего переплётчика порой знают лучше местного сановника. В одежде любят холодные зелёные и серебристые оттенки, свободные рукава и ткани, которые можно чинить, сохраняя рисунок. На праздниках старые наряды ценят за историю, а повседневная одежда заметно проще придворной.\u003c/p>\n\u003cp>Наследственную корону ограничивает совет городов и старых домов. Привилегии закреплялись постепенно: двору были нужны корабли, ремесленникам — защита заказов, поселениям — право распоряжаться ближайшими землями. Поэтому здесь умеют подолгу обсуждать решение, которое соседняя монархия приняла бы за один вечер. Сегодня спорят о приёме иностранных учеников и продаже редких изделий. Купцы заинтересованы в обмене, некоторые старые семьи боятся утраты привычного уклада.\u003c/p>\n\u003cp>С Валенвудом страну связывает общий совет равных делегаций, ведающий обороной и внешними соглашениями. Торговые гости допускаются в прибрежные поселения; для поездки в глубь острова нужен поручитель. Самоуверенность мешает приезжему больше бедного плаща. Полуэльф может столкнуться с неприязнью, хотя отдельные семьи и мастерские относятся к нему иначе. Эльфы и феи живут рядом, не растворяясь в едином обществе; культ \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митры\u003c/a> не принят ни короной, ни основными общинами.\u003c/p>","plain":"Эльфсвейр встречает прибывших вымощенными набережными, закрытыми садами и длинными галереями, где дождь не мешает прогулке. Портовые дома выставляют над дверью знак мастера; хорошего переплётчика порой знают лучше местного сановника. В одежде любят холодные зелёные и серебристые оттенки, свободные рукава и ткани, которые можно чинить, сохраняя рисунок. На праздниках старые наряды ценят за историю, а повседневная одежда заметно проще придворной. Наследственную корону ограничивает совет городов и старых домов. Привилегии закреплялись постепенно: двору были нужны корабли, ремесленникам — защита заказов, поселениям — право распоряжаться ближайшими землями. Поэтому здесь умеют подолгу обсуждать решение, которое соседняя монархия приняла бы за один вечер. Сегодня спорят о приёме иностранных учеников и продаже редких изделий. Купцы заинтересованы в обмене, некоторые старые семьи боятся утраты привычного уклада. С Валенвудом страну связывает общий совет равных делегаций, ведающий обороной и внешними соглашениями. Торговые гости допускаются в прибрежные поселения; для поездки в глубь острова нужен поручитель. Самоуверенность мешает приезжему больше бедного плаща. Полуэльф может столкнуться с неприязнью, хотя отдельные семьи и мастерские относятся к нему иначе. Эльфы и феи живут рядом, не растворяясь в едином обществе; культ Митры не принят ни короной, ни основными общинами.","excerpt":"Эльфсвейр встречает прибывших вымощенными набережными, закрытыми садами и длинными галереями, где дождь не мешает прогулке. Портовые дома выставляют над дверью знак мастера;…","wordCount":184,"readingMinutes":1,"facts":[{"label":"Власть","value":"Наследственная корона, ограниченная советом городов и старых домов"},{"label":"Обитатели","value":"Эльфы и феи"},{"label":"Союз","value":"Общий совет с Валенвудом"},{"label":"Приезжие","value":"Торговые гости в прибрежных поселениях; внутри острова нужен поручитель"},{"label":"Вера","value":"Культ Митры не принят короной и основными общинами"}],"tags":["Острова","Эльфы","Ограниченные контакты"]},{"id":"valenwood","title":"Валенвуд","chapterId":"states","chapterTitle":"Государства и политические образования","images":["valenwood"],"html":"\u003cp>В Валенвуде дорогу нередко прокладывают в обход старой рощи, даже если прямой путь был бы короче. Поселения собираются вокруг полян, пристаней и общих домов, где сушат травы, чинят сети и решают споры. Подвесные переходы соединяют постройки, стоящие на разной высоте. Слово «дом» может обозначать и отдельное жилище, и целую общину, поэтому гостю полезно уточнять, кого именно его попросили навестить.\u003c/p>\n\u003cp>Власть принадлежит собраниям общин, лесных хранителей и представителей фей. Их общий порядок вырос из договоров о пользовании водой, древесиной и охотничьими угодьями. Здесь нет запрета на любое изменение природы: спорят о том, кто отвечает за последствия. Строителю приходится объяснять, куда уйдёт паводок; владельцу красильни — как сохранить чистым ручей. Одни поселения охотно зарабатывают на редких товарах, другие предпочитают меньше торговли и меньше чужих обязательств.\u003c/p>\n\u003cp>Одежду красят растительными красителями; многие носят короткие плащи, мягкие пояса и лёгкие корзины через плечо. Общая трапеза служит началом переговоров, но приглашение за стол не означает разрешения свободно ходить по любой роще. Государство самостоятельно, а оборону и внешние договоры согласует с Эльфсвейром. Чужеземцев принимают редко и по поручительству. Гость, который спрашивает прежде, чем рубить или собирать, быстро заслужит больше доверия, чем щедрый путешественник, считающий лес ничейным.\u003c/p>","plain":"В Валенвуде дорогу нередко прокладывают в обход старой рощи, даже если прямой путь был бы короче. Поселения собираются вокруг полян, пристаней и общих домов, где сушат травы, чинят сети и решают споры. Подвесные переходы соединяют постройки, стоящие на разной высоте. Слово «дом» может обозначать и отдельное жилище, и целую общину, поэтому гостю полезно уточнять, кого именно его попросили навестить. Власть принадлежит собраниям общин, лесных хранителей и представителей фей. Их общий порядок вырос из договоров о пользовании водой, древесиной и охотничьими угодьями. Здесь нет запрета на любое изменение природы: спорят о том, кто отвечает за последствия. Строителю приходится объяснять, куда уйдёт паводок; владельцу красильни — как сохранить чистым ручей. Одни поселения охотно зарабатывают на редких товарах, другие предпочитают меньше торговли и меньше чужих обязательств. Одежду красят растительными красителями; многие носят короткие плащи, мягкие пояса и лёгкие корзины через плечо. Общая трапеза служит началом переговоров, но приглашение за стол не означает разрешения свободно ходить по любой роще. Государство самостоятельно, а оборону и внешние договоры согласует с Эльфсвейром. Чужеземцев принимают редко и по поручительству. Гость, который спрашивает прежде, чем рубить или собирать, быстро заслужит больше доверия, чем щедрый путешественник, считающий лес ничейным.","excerpt":"В Валенвуде дорогу нередко прокладывают в обход старой рощи, даже если прямой путь был бы короче. Поселения собираются вокруг полян, пристаней и общих домов, где сушат травы,…","wordCount":189,"readingMinutes":1,"facts":[{"label":"Власть","value":"Собрания общин, лесных хранителей и представителей фей"},{"label":"Союз","value":"Оборона и внешние договоры согласуются с Эльфсвейром"},{"label":"Хозяйство","value":"Договоры о воде, древесине и охотничьих угодьях"},{"label":"Приезжие","value":"Редкий приём по поручительству"}],"tags":["Острова","Общины","Феи"]},{"id":"bretnos","title":"Королевство Бретнос","chapterId":"states","chapterTitle":"Государства и политические образования","images":["bretnos"],"html":"\u003cp>В Бретносе ярмарку слышно раньше, чем видно городские стены: колокольчики упряжи, спор из-за цены, музыканты возле помоста. На площади могут соседствовать рыцарский шатёр и лавка починки обуви. Местная знать дорожит родословными, но городской мастер вправе напомнить даже барону о неоплаченном счёте. Синие и кремовые ткани встречаются часто; на празднике гербовую ленту привязывают к обычному плащу, не меняя всю одежду.\u003c/p>\n\u003cp>Королева Аделина де Ренн правит через соглашения с баронами и городами. Корона подтверждает торговые права и судебную защиту, взамен получает деньги, ополчение и содержание дорог. Такой порядок сложился вокруг старых пожалований, которыми дорожат даже люди, редко читающие сам документ. Аделина стремится сохранить мир готовностью к войне. При дворе спорят, сколько средств отдавать рыцарским домам, а сколько — укреплениям и запасам.\u003c/p>\n\u003cp>Пока \u003ca class=\"wiki-link entity-link\" href=\"#octanius\">Октаниус\u003c/a> покорял своих прежних соседей, Бретнос заключил оборонный союз с Норманией. Подготовка сделала нападение на оба королевства слишком дорогим для лёгкой победы. Путешественник найдёт здесь множество нанимателей, но быстро обнаружит различия местных прав: разрешение одного владетеля не всегда удовлетворяет другого. При знакомстве полезно назвать ремесло и поручителя. За удачную службу можно приобрести покровителя; одно лишь громкое имя не избавляет от необходимости показать дело.\u003c/p>","plain":"В Бретносе ярмарку слышно раньше, чем видно городские стены: колокольчики упряжи, спор из-за цены, музыканты возле помоста. На площади могут соседствовать рыцарский шатёр и лавка починки обуви. Местная знать дорожит родословными, но городской мастер вправе напомнить даже барону о неоплаченном счёте. Синие и кремовые ткани встречаются часто; на празднике гербовую ленту привязывают к обычному плащу, не меняя всю одежду. Королева Аделина де Ренн правит через соглашения с баронами и городами. Корона подтверждает торговые права и судебную защиту, взамен получает деньги, ополчение и содержание дорог. Такой порядок сложился вокруг старых пожалований, которыми дорожат даже люди, редко читающие сам документ. Аделина стремится сохранить мир готовностью к войне. При дворе спорят, сколько средств отдавать рыцарским домам, а сколько — укреплениям и запасам. Пока Октаниус покорял своих прежних соседей, Бретнос заключил оборонный союз с Норманией. Подготовка сделала нападение на оба королевства слишком дорогим для лёгкой победы. Путешественник найдёт здесь множество нанимателей, но быстро обнаружит различия местных прав: разрешение одного владетеля не всегда удовлетворяет другого. При знакомстве полезно назвать ремесло и поручителя. За удачную службу можно приобрести покровителя; одно лишь громкое имя не избавляет от необходимости показать дело.","excerpt":"В Бретносе ярмарку слышно раньше, чем видно городские стены: колокольчики упряжи, спор из-за цены, музыканты возле помоста. На площади могут соседствовать рыцарский шатёр и лавка…","wordCount":183,"readingMinutes":1,"facts":[{"label":"Правительница","value":"Королева Аделина де Ренн"},{"label":"Управление","value":"Соглашения короны с баронами и городами"},{"label":"Союз","value":"Совместная оборона с Норманией"},{"label":"Опора короны","value":"Торговые права, судебная защита, ополчение"}],"tags":["Королевство","Оборонный союз","Города и бароны"]},{"id":"normania","title":"Королевство Нормания","chapterId":"states","chapterTitle":"Государства и политические образования","images":["normania"],"html":"\u003cp>О Нормании судят по её дорогам. Возле моста висит список сборов, у склада отмечен запас зерна, на постоялом дворе есть отдельный стол для королевского гонца. Здесь любят порядок, который можно проверить. Утренний рынок начинается с осмотра мер; вмешательство стражи в спор воспринимается спокойнее, если обе стороны получили одинаковую возможность высказаться. В городах распространены плотные серые плащи с красной тесьмой, в деревнях — практичная некрашеная шерсть.\u003c/p>\n\u003cp>Король Эдрик Арден укрепляет власть дорогами, постоянной стражей и сетью складов. Прежде многие переправы жили по отдельным договорам с местными хозяевами; корона постепенно сводила их обязанности в понятный порядок. Служилые рыцари и чиновники поддерживают перемены, крупные землевладельцы опасаются потери самостоятельности. Порядок стоит дорого, и спор о новом сборе способен собрать толпу быстрее королевского праздника.\u003c/p>\n\u003cp>Нормания поддерживает оборонный союз с Бретносом поставками, совместной подготовкой и согласованной службой на опасных направлениях. Королевства остаются самостоятельными. Эдрик требует, чтобы обещание союзнику подтверждалось обозом и подготовленными людьми. Чужаку удобно там, где нужны точный счёт, охрана и доставка: правила обычно можно узнать заранее. Но пропущенная запись задержит груз дольше, чем усталый возчик считает справедливым, а местные шутят, что королевская печать умеет путешествовать только в собственном темпе.\u003c/p>","plain":"О Нормании судят по её дорогам. Возле моста висит список сборов, у склада отмечен запас зерна, на постоялом дворе есть отдельный стол для королевского гонца. Здесь любят порядок, который можно проверить. Утренний рынок начинается с осмотра мер; вмешательство стражи в спор воспринимается спокойнее, если обе стороны получили одинаковую возможность высказаться. В городах распространены плотные серые плащи с красной тесьмой, в деревнях , судебные тяжбы и рассказы приезжих. Зелёная и бордовая одежда заметна среди состоятельных горожан; ремесленника чаще отличает удобный жилет и крепкий кожаный фартук.\u003c/p>\n\u003cp>Герцог Людвиг Ротен правит страной старых местных прав. Городской совет, монастырское владение и рыцарская семья могут предъявить разные грамоты на один доход. Герцогский суд нужен именно потому, что силой решить подобный спор легко, а сохранить после этого согласие трудно. Молодые служилые люди требуют ясных правил, давние владетели берегут исключения. Герцог ищет доход для казны, стараясь не превратить каждую проверку в ссору со всеми соседями сразу.\u003c/p>\n\u003cp>Здесь начался путь прежней группы известных авантюристов; их репутация показывает, как служба открывает двери знати. \u003ca class=\"wiki-link entity-link\" href=\"#darkness-forest\">Даркнес\u003c/a> на картах принадлежит Швабии, но распоряжаться им как обычным владением герцогство не может. Чужаку лучше иметь отдельные договорённости для разных мест. Хорошая рекомендация помогает найти работу и ночлег, хотя сельский хозяин скорее доверится знакомому возчику, чем красивой грамоте без понятного объяснения.\u003c/p>","plain":"В Швабии даже небольшая ярмарка собирает людей из разных владений: у каждого свой говор, крой шапки и мнение о честной цене. Пастухи пригоняют скот, бочары выставляют работу, сельские семьи привозят сыр, полотно и сушёные яблоки. За столом постоялого двора обсуждают урожай, свадьбы, судебные тяжбы и рассказы приезжих. Зелёная и бордовая одежда заметна среди состоятельных горожан; ремесленника чаще отличает удобный жилет и крепкий кожаный фартук. Герцог Людвиг Ротен правит страной старых местных прав. Городской совет, монастырское владение и рыцарская семья могут предъявить разные грамоты на один доход. Герцогский суд нужен именно потому, что силой решить подобный спор легко, а сохранить после этого согласие трудно. Молодые служилые люди требуют ясных правил, давние владетели берегут исключения. Гер  обоз к сроку; на местном собрании громкий дружинник может уступить опытному хозяину, который знает цену неубранного поля. Города требуют денег на пристани, пограничные общины — на защиту, земледельцы — меньше отвлечённых от работы рук.\u003c/p>\n\u003cp>Галич поддерживает Тевтонию совместно с Божьей областью, публично называя защиту восточного рубежа общим делом. При этом страна достаточно сильна, чтобы говорить с союзниками от собственного имени. Путнику полезны соблюдённое слово и уважение к хозяевам. Гостеприимство не отменяет осторожности: незнакомца расспросят о дороге, спутниках и цели поездки, прежде чем поручиться за него перед соседями.\u003c/p>","plain":"В Галиче гостя встречают у печи, а серьёзный разговор нередко откладывают до тех пор, пока он не согреется и не поест. Городские торги пахнут хлебом, дёгтем и сушёной рыбой. По рекам и дорогам везут зерно, древесину, воск и изделия кузнецов. Льняные рубахи украшают вышивкой по вороту и рукавам; верхнюю одежду стягивают ткаными поясами. Узор чаще говорит о местной школе работы или семейном вкусе, чем о принадлежности к одному неизменному племени. Великий вождь Радован Велеславич опирается на дружину, местных владетелей и собрания общин. Нынешняя сила страны выросла из способности согласовывать перевозки и службу, не разрушая самостоятельность её земель. При дворе ценят людей, умеющих собрать обоз к сроку; на местном собрании громкий дружинник может уступить опытному хозяину, который знает цену неубранного поля. Города требуют денег на пристани, пограничные общины — на защиту, земледельцы — меньше отвлечённых от работы рук. Галич поддерживает Тевтонию совместно с Божьей областью, публично называя защиту восточного рубежа общим делом. При этом страна достаточно сильна, чтобы говорить с союзниками от собственного имени. Путнику полезны соблюдённое слово и уважение к хозяевам. Гостеприимство не отменяет осторожности: незнакомца расспросят о дороге, спутниках и цели поездки, прежде чем поручиться за него перед соседями.","excerpt":"В Галиче гостя встречают у печи, а серьёзный разговор нередко откладывают до тех пор, пока он не согреется и не поест. Городские торги пахнут хлебом, дёгтем и сушёной рыбой. По…","wordCount":190,"readingMinutes":1,"facts":[{"label":"Правитель","value":"Великий вождь Радован Велеславич"},{"label":"Опора власти","value":"Дружина, местные владетели и собрания общин"},{"label":"Сотрудничество","value":"Поддержка Тевтонии совместно с Божьей областью"},{"label":"Торговля","value":"Зерно, древесина, воск и кузнечные изделия"}],"tags":["Великое вождество","Общины","Пограничная поддержка"]},{"id":"octanius","title":"Империя Октаниус","chapterId":"states","chapterTitle":"Государства и политические образования","images":["octanius"],"html":"\u003cp>Имперская печать одинакова на многих документах, но жизнь покорённых земель не стала одинаковой. В одном городе гордятся старым семейным гербом, в другом — мостом и рынком, построенными уже при империи. На официальных праздниках носят пурпурные перевязи; в повседневной одежде сохраняются разные местные ткани и узоры. Горожанин способен искренне любить свою улицу, ненавидеть наместника и одновременно считать службу в армии достойным занятием.\u003c/p>\n\u003cp>Империей правит династия Октаниусов; нынешний император Северин Октаниус требует надёжных сборов и новых возможностей для расширения. Единая власть возникла из военного подчинения четырёх королевств — Аврелии, Вестарии, Кардании и Миреллии. Все они лежали внутри нынешних имперских границ. Местная память об этих королевствах продолжает жить рядом с имперскими порядками.\u003c/p>\n\u003cp>Наместники, гарнизоны и налоговые ведомства удерживают общую власть. Служба даёт шанс возвыситься, но внутренние распри и сопротивление соседей мешают лёгким победам. Октаниус полностью поддерживает культ \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митры\u003c/a>, получая церковное признание завоевательных притязаний. Для тифлинга эта страна опасна: возможны жестокие преследования, насилие и потеря средств к жизни. Благополучие на парадной площади ничего не гарантирует беженцу. Остальным чужакам полезны бумаги и покровитель, хотя даже они не защищают от произвола каждого чиновника.\u003c/p>","plain":"Имперская печать одинакова на многих документах, но жизнь покорённых земель не стала одинаковой. В одном городе гордятся старым семейным гербом, в другом — мостом и рынком, построенными уже при империи. На официальных праздниках носят пурпурные перевязи; в повседневной одежде сохраняются разные местные ткани и узоры. Горожанин способен искренне любить свою улицу, ненавидеть наместника и одновременно считать службу в армии достойным занятием. Империей правит династия Октаниусов; нынешний император Северин Октаниус требует надёжных сборов и новых возможностей для расширения. Единая власть возникла из военного подчинения четырёх королевств — Аврелии, Вестарии, Кардании и Миреллии. Все они лежали внутри нынешних имперских границ. Местная память об этих королевствах продолжает жить рядом с имперскими порядками. Наместники, гарнизоны и налоговые ведомства удерживают общую власть. Служба даёт шанс возвыситься, но внутренние распри и сопротивление соседей мешают лёгким победам. Октаниус полностью поддерживает культ Митры, получая церковное признание завоевательных притязаний. Для тифлинга эта страна опасна: возможны жестокие преследования, насилие и потеря средств к жизни. Благополучие на парадной площади ничего не гарантирует беженцу. Остальным чужакам полезны бумаги и покровитель, хотя даже они не защищают от произвола каждого чиновника.","excerpt":"Имперская печать одинакова на многих документах, но жизнь покорённых земель не стала одинаковой. В одном городе гордятся старым семейным гербом, в другом — мостом и рынком,…","wordCount":177,"readingMinutes":1,"facts":[{"label":"Правитель","value":"Император Северин Октаниус"},{"label":"Династия","value":"Октаниусы"},{"label":"Происхождение","value":"Военное подчинение четырёх королевств"},{"label":"Управление","value":"Наместники, гарнизоны и налоговые ведомства"},{"label":"Вера","value":"Полная поддержка культа Митры"}],"tags":["Империя","Экспансия","Культ Митры"]},{"id":"holy-region","title":"Божья область","chapterId":"states","chapterTitle":"Государства и политические образования","images":["holy-region"],"html":"\u003cp>Утро в Ватитане начинается с колоколов и движения паломников. Перед храмами продают свечи, хлеб, значки и дешёвые плащи; между процессиями протискиваются носильщики и писцы, предлагающие составить прошение. Ватитан — столица Божьей области, которую также называют Папством. Торжественные белые и золотистые облачения резко выделяются среди дорожной пыли и рабочей одежды людей, обеспечивающих жизнь святынь.\u003c/p>\n\u003cp>Понтифик Климент IV соединяет духовное первенство с государственной властью. Церковные должности ведут к управлению судами, землями и доходами. Паломничество со временем превратило храмовый центр в страну, где гостевые дома и книжные мастерские столь же необходимы, как канцелярии. Внутри церкви спорят о расходах: одни требуют расширять помощь нуждающимся, другие — представительство за рубежом и великолепие церемоний. Простой прихожанин может знать о деятельности соседнего приюта больше, чем о дворцовых переговорах.\u003c/p>\n\u003cp>Учение \u003ca class=\"wiki-link entity-link\" href=\"#mitra\">Митры\u003c/a> утверждает её первенство над богами; церковь стремится добиться признания этого учения другими державами. \u003ca class=\"wiki-link entity-link\" href=\"#octanius\">Октаниус\u003c/a> поддерживает его полностью. \u003ca class=\"wiki-link entity-link\" href=\"#teutonia\">Тевтония\u003c/a> остаётся церковным вассалом, а \u003ca class=\"wiki-link entity-link\" href=\"#galich\">Галич\u003c/a> участвует в поддержке рубежа. Публичное благочестие помогает приезжему, но чужой облик способен сделать жизнь опасной. Тифлинги подвергаются жестоким преследованиям. Рядом с проповедью милосердия существуют доносы, насилие и страх; сочувствие отдельного служителя не отменяет власти учреждения и опасности толпы.\u003c/p>","plain":"Утро в Ватитане начинается с колоколов и движения паломников. Перед храмами продают свечи, хлеб, значки и дешёвые плащи; между процессиями протискиваются носильщики и писцы, предлагающие составить прошение. Ватитан — столица Божьей области, которую также называют Папством. Торжественные белые и золотистые облачения резко выделяются среди дорожной пыли и рабочей одежды людей, обеспечивающих жизнь святынь. Понтифик Климент IV соединяет духовное первенство с государственной властью. Церковные должности ведут к управлению судами, землями и доходами. Паломничество со временем превратило храмовый центр в страну, где гостевые дома и книжные мастерские столь же необходимы, как канцелярии. Внутри церкви спорят о расходах: одни требуют расширять помощь нуждающимся, другие — представительство за рубежом и великолепие церемоний. Простой прихожанин может знать о деятельности соседнего приюта больше, чем о дворцовых переговорах. Учение Митры утверждает её первенство над богами; церковь стремится добиться признания этого учения другими державами. Октаниус поддерживает его полностью. Тевтония остаётся церковным вассалом, а Галич участвует в поддержке рубежа. Публичное благочестие помогает приезжему, но чужой облик способен сделать жизнь опасной. Тифлинги подвергаются жестоким преследованиям. Рядом с проповедью милосердия существуют доносы, насилие и страх; сочувствие отдельного служителя не отменяет власти учреждения и опасности толпы.","excerpt":"Утро в Ватитане начинается с колоколов и движения паломников. Перед храмами продают свечи, хлеб, значки и дешёвые плащи; между процессиями протискиваются носильщики и писцы,…","wordCount":184,"readingMinutes":1,"facts":[{"label":"Также известна","value":"Папство"},{"label":"Столица","value":"Ватитан"},{"label":"Правитель","value":"Понтифик Климент IV"},{"label":"Власть","value":"Церковные должности и государственное управление"},{"label":"Учение","value":"Первенство Митры над богами"}],"tags":["Церковное государство","Паломничество","Ватитан"]},{"id":"teutonia","title":"Королевство орден Тевтония","chapterId":"states","chapterTitle":"Государства и политические образования","images":["teutonia"],"html":"\u003cp>В Тевтонии улицу часто будит скрип обозов. Ворота открывают для возчиков, кузницы принимают сломанные ободы, в прачечных развешивают плащи гарнизона. Пограничная служба требует несравнимо больше людей, чем видно на стене: нужны мельники, лекари, конюхи, переписчики и семьи, продолжающие обрабатывать землю. Светлые орденские накидки носят поверх дорожной и военной одежды; для мирных жителей они означают одновременно защиту и очередную проверку запасов.\u003c/p>\n\u003cp>Землями управляет священный орден церкви. Великий магистр Освальд Верен распоряжается крепостями и службой, сохраняя верность главе Папства. Тевтония остаётся вассалом \u003ca class=\"wiki-link entity-link\" href=\"#holy-region\">Божьей области\u003c/a>; её возросшая самостоятельность в повседневных делах ещё не стала отделением. Постоянная необходимость быстро решать местные задачи усилила орденских распорядителей. Но приграничные хозяйства жалуются на реквизиции, командиры — на задержки подвоза, а казначеи требуют беречь то, что военным кажется расходным материалом.\u003c/p>\n\u003cp>Защита от нападений с востока связывает орден с поддержкой \u003ca class=\"wiki-link entity-link\" href=\"#galich\">Галича\u003c/a> и Папства. Чужака с нужным ремеслом здесь заметят быстро, однако во время тревоги его будут расспрашивать строже. Военная полезность помогает заслужить уважение, но не избавляет от церковной нетерпимости: тифлинг встречает враждебную среду и вытеснение на обочину. Полезно заранее знать, кто отвечает за обещанный наём, где заканчиваются права местной управы и куда обращаться с жалобой на недополученную плату.\u003c/p>","plain":"В Тевтонии улицу часто будит скрип обозов. Ворота открывают для возчиков, кузницы во Халфлинг","chapterId":"states","chapterTitle":"Государства и политические образования","images":["halfling-kingdom"],"html":"\u003cp>Халфлинг — собственное национальное государство полуросликов, редкое политическое образование для этого народа. На карте оно занимает самостоятельное место среди соседних человеческих держав. Жители не особенно расположены к иным расам; представители других народов здесь не живут. Для полуросликов за пределами королевства само его существование остаётся заметной частью общей истории, хотя отношение отдельного человека к далёкой родине может различаться. Рассказы приезжих о местных порядках не дают надёжного основания судить обо всём государстве.\u003c/p>","plain":"Халфлинг — собственное национальное государство полуросликов, редкое политическое образование для этого народа. На карте оно занимает самостоятельное место среди соседних человеческих держав. Жители не особенно расположены к иным расам; представители других народов здесь не живут. Для полуросликов за пределами королевства само его существование остаётся заметной частью общей истории, хотя отношение отдельного человека к далёкой родине может различаться. Рассказы приезжих о местных порядках не дают надёжного основания судить обо всём государстве.","excerpt":"Халфлинг — собственное национальное государство полуросликов, редкое политическое образование для этого народа. На карте оно занимает самостоятельное место среди соседних…","wordCount":70,"readingMinutes":1,"facts":[{"label":"Государство","value":"Национальное королевство полуросликов"},{"label":"Население","value":"Полурослики; представители других народов здесь не живут"},{"label":"Отношение к чужим","value":"Жители не особенно расположены к иным расам"}],"tags":["Королевство","Полурослики","Обособленность"]},{"id":"alben","title":"Республика Альбен","chapterId":"states","chapterTitle":"Государства и политические образования","images":["alben"],"html":"\u003cp>В Альбене узнают время по работе мастерских: сначала молоты, затем пилы, к полудню — колёса телег, увозящих готовые заказы. Уличные водостоки закрывают каменные плиты с клеймом исполнителя. На празднике мастер несёт небольшую лучшую работу, а не обязательно самое дорогое изделие. Практичные охристые куртки, кожаные фартуки и короткие плащи удобны в городе, где одежду постоянно цепляют верстаки, строительные леса и края повозок.\u003c/p>\n\u003cp>Республика выросла из союзов мастерских и городских кварталов. Обе стороны выбирают представителей в совет: мастера требуют учитывать вложенный труд, жители — безопасность и доступную воду. Уважение к ремеслу не делает город единодушным. Крупные заказчики хотят дешёвых поставок, мелкие мастерские защищают самостоятельность, подмастерья добиваются права открывать собственное дело. Совет регулярно спорит о продаже оружия полисам, которые могут завтра выступить друг против друга.\u003c/p>\n\u003cp>Альбен независим, как другие республики полуострова, и готов защищать свои стены. Тифлингов и иных переселенцев принимают по личным качествам; происхождение не запрещает учиться ремеслу и получать городские права. Чужаку проще начать с проверяемой работы: здесь быстро узнают и хорошего работника, и человека, обещающего больше, чем умеет. Соседи уважают изделия Альбена, хотя ворчат, что местный мастер способен превратить разговор о цене в длинную лекцию о правильной кладке.\u003c/p>","plain":"В Альбене узнают время по работе мастерских: сначала молоты, затем пилы, к полудню — колёса телег, увозящих готовые заказы. Уличные водостоки закрывают каменные плиты с клеймом исполнителя. На празднике мастер несёт небольшую лучшую работу, а не обязательно самое дорогое изделие. Практичные охристые куртки, кожаные фартуки и короткие плащи удобны в городе, где одежду постоянно цепляют верстаки, строительные леса и края повозок. Республика выросла из союзов мастерских и городских кварталов. Обе стороны выбирают представителей в совет: мастера требуют учитывать вложенный труд, жители — безопасность и досту ов и партнёров.\u003c/p>\n\u003cp>Полис богател как место, где чужие люди могли договориться и обратиться в суд. Выборные судьи разбирают торговые споры, городской совет отвечает за общие расходы. Сильные семьи влияют через кредит и поручительства, поэтому формальное равенство приходится постоянно защищать от власти долгов. Небогатые граждане добиваются доступного суда; состоятельные посредники напоминают, что без доверия к обязательствам город потеряет главный доход.\u003c/p>\n\u003cp>Везер поддерживает связи с республиками и монархиями, предпочитая зарабатывать на переговорах. При этом собственная независимость для него важнее удобства отдельного покупателя. Переселенцам, включая тифлингов, открыты перевозки, торговля и городская служба. Чужаку пригодятся языки и свидетели, умеющие подтвердить условия найма. Самый частый местный совет — не соглашаться на слово, значение которого вы поняли только приблизительно: обещание запомнят точнее, чем вашу последующую попытку объяснить недоразумение.\u003c/p>","plain":"Везер звучит голосами посредников. В крытых дворах договариваются о перевозках, меняют деньги и ищут поручителей; за соседним столом ту же сделку уже обсуждают на другом языке. Хорошая одежда здесь не обязательно яркая: чистый воротник, качественный пояс и удобный дорожный сундук говорят о человеке больше драгоценной застёжки. На праздниках украшают фасады полосатыми полотнищами, а владельцы лавок выставляют угощение для постоянных работников и партнёров. Полис богател как место, где чужие люди могли договориться и обратиться в суд. Выборные судьи разбирают торговые споры, городской совет отвечает за общие расходы. Сильные семьи влияют через кредит и поручительства, поэтому формальное равенство приходится постоянно защищать от власти долгов. Небогатые граждане добиваются доступного суда; состоятельные посредники напоминают, что без доверия к обязательствам город потеряет главный доход. Везер поддерживает связи с республиками и монархиями, предпочитая зарабатыв  откладывать восстановление дороги до следующего урожая. Привычка обсуждать затрудняет срочное решение, зато делает непопулярный приказ трудным делом.\u003c/p>\n\u003cp>Римурис дорожит независимостью и настороженно относится к попыткам любого крупного соседа говорить от имени всего полуострова. Тифлинги участвуют в городской жизни наряду с остальными жителями. Новичка охотно выслушают, особенно если он умеет учить или лечить, но одно выступление не заменяет репутации. Местные любят спрашивать мнение гостя, а затем долго объяснять, с какими частями его ответа они согласны.\u003c/p>","plain":"В Римурисе спорят даже на лестницах. Возле сада двое обсуждают расходы на канал, на рынке учитель объясняет ученикам, почему хорошая речь должна быть понятной, а на площади уже собираются слушать отчёт должностного лица. Вокруг города трудятся земледельческие общины, поставляющие фрукты, масло, зерно и вино. Светлые ткани удобны в жару; перед собранием многие надевают поверх рабочей одежды широкую накидку, которую затем используют для вечерней прохлады. Республика складывалась через соглашения города с окрестными общинами. Их представители утверждают расходы и выбирают должностных лиц на короткий срок. Ораторов уважают, но избиратель вправе потребовать, чтобы красивую речь подтвердили выполненным ремонтом. Горожане поддерживают обучение и приём переселенцев; сельские хозяева напоминают, что свободный спор не должен каждый раз откладывать восстановление дороги до следующего урожая. Привычка обсуждать затрудняет срочное решение, зато делает непопулярный приказ трудным делом. Римурис дорожит независимостью и настороженно относится к попыткам любого крупного соседа говорить от имени всего полуострова. Тифлинги участвуют в городской жизни наряду с остальными жителями. Новичка охотно выслушают, особенно если он умеет учить или лечить, но одно выступление не заменяет репутации. Местные любят спрашивать мнение гостя, а затем долго объяснять, с какими частями его ответа они согласны.","excerpt":"В Римурисе спорят даже на лестницах. Возле сада двое обсуждают расходы на канал, на рынке учитель объясняет ученикам, почему хорошая речь должна быть понятной, а на площади уже…","wordCount":185,"readingMinutes":1,"facts":[{"label":"Управление","value":"Представители города и земледельческих общин"},{"label":"Должности","value":"Выборы на короткий срок"},{"label":"Хозяйство","value":"Фрукты, масло, зерно и вино"},{"label":"Общественная жизнь","value":"Обучение, публичные споры и приём переселенцев"}],"tags":["Республика","Общины","Собрания"]},{"id":"waterstone","title":"Республика Вотерстоун","chapterId":"states","chapterTitle":"Государства и политические образования","images":["waterstone"],"html":"\u003cp>Вотерстоун пахнет смолой, мокрым деревом и горячим хлебом у причалов. Утром жители следят за движением судов, вечером узнают новости в мастерских, где чинят паруса и снасти. Длинные водостойкие плащи здесь важнее красивой шляпы; в шторм яркая повязка помогает увидеть человека на мокром помосте. На семейных праздниках оставляют место для тех, чей рейс задержался, но приготовленную для них еду обычно съедают прежде возвращения.\u003c/p>\n\u003cp>Республику образовали гавани и примыкающие кварталы, которым пришлось сообща содержать причалы, склады и береговую защиту. Их представители выбирают общий совет и сменяемого распорядителя стражи. Старые судовладельцы хотят небольших сборов, работники — надёжных настилов и справедливой оплаты, моряки — маяков и спасательных служб. Споры бывают шумными, однако затонувшее у входа судно быстро напоминает всем, сколько стоит плохо выполненная общая работа.\u003c/p>\n\u003cp>Город торгует с соседями и нуждается в бесперебойном подвозе продовольствия. Независимость поддерживают договоры и готовность защищать гавани. Приезжих принимают охотно, тифлинг может найти работу и дом без необходимости скрывать происхождение. Чужаку стоит выяснить, кто отвечает за груз после выгрузки: береговой обычай, городской закон и привычки команды могут расходиться. При всём гостеприимстве местные резко осуждают человека, отказавшегося помочь на причале, когда на его глазах случилась беда.\u003c/p>","plain":"Вотерстоун пахнет смолой, мокрым деревом и горячим хлебом у причалов. Утром жители следят за движением судов, вечером узнают новости в мастерских, где чинят паруса и снасти. Длинные водостойкие плащи здесь важнее красивой шляпы; в шторм яркая повязка помогает увидеть человека на мокром помосте. На семейных праздниках оставляют место для тех, чей рейс задержался, но приготовленную для них еду обычно съедают прежде возвращения. Республику образовали гавани и примыкающие кварталы, которым пришлось сообща содержать причалы, склады и береговую защиту. Их представители выбирают общий совет и сменяемого распорядителя стражи. Старые судовладельцы хотят небольших сборов, работники — надёжных настилов и справедливой оплаты, моряки — маяков и спасательных служб. Споры бывают шумными, однако затонувшее у входа судно быстро напоминает всем, сколько стоит плохо выполненная общая работа. Город торгует с соседями и нуждается в бесперебойном подвозе продовольствия. Независимость поддерживают договоры и готовность защищать гавани. Приезжих принимают охотно, тифлинг может найти работу и дом без необходимости скрывать происхождение. Чужаку стоит выяснить, кто отвечает за груз после выгрузки: береговой обычай, городской закон и привычки команды могут расходиться. При всём гостеприимстве местные резко осуждают человека, отказавшегося помочь на причале, когда на его глазах случилась беда.","excerpt":"Вотерстоун пахнет смолой, мокрым деревом и горячим хлебом у причалов. Утром жители следят за движением судов, вечером узнают новости в мастерских, где чинят паруса и снасти.…","wordCount":186,"readingMinutes":1,"facts":[{"label":"Управление","value":"Общий совет гаваней и кварталов"},{"label":"Охрана","value":"Сменяемый распорядитель стражи"},{"label":"Занятия","value":"Морская торговля, склады и судовые мастерские"},{"label":"Продовольствие","value":"Зависимость от бесперебойного подвоза"}],"tags":["Республика","Гавани","Морская торговля"]},{"id":"coliseum","title":"Город Колизей","chapterId":"states","chapterTitle":"Государства и политические образования","images":["coliseum"],"html":"\u003cp>Задолго до главных боёв Колизей заполняют гости. Мелкие торговцы нанимают помощников, семейные дома сдают комнаты, у харчевен вывешивают дополнительные навесы. Крупнейший и наиболее значимый полис полуострова умеет превращать зрелище в городской труд. На огромной арене встречаются бойцы со всех земель, а зрители спорят о манере владеть оружием с той же страстью, с какой спорят о решениях совета. Перед состязанием город украшают красными полотнищами; повседневная одежда проста и удобна для движения.\u003c/p>\n\u003cp>Военная подготовка составляет часть гражданской жизни. Совместные упражнения и помощь соседям в трудной работе воспитывают привычку полагаться на товарища. Командиров выбирают, но решения о городских средствах принимает гражданский совет. Влиятельные наставники требуют вкладываться в укрепления, устроители зрелищ напоминают о доходах приезжего сезона. Слава победителя помогает добиться внимания, однако сама по себе не даёт права распоряжаться казной.\u003c/p>\n\u003cp>Колизей уважает физическое мастерство, выдержку и исполненное обязательство. Бои включают спортивные состязания, добровольные поединки и показательные сражения. Происхождение не закрывает путь к уважению: тифлинги живут и работают здесь наряду с другими горожанами. Чужак быстро найдёт компанию, если готов выслушать рассказ о местных чемпионах. Ему полезно помнить, что громкая ссора на рынке ещё не приглашение превратить её в бой.\u003c/p>","plain":"Задолго до главных боёв Колизей заполняют гости. Мелкие торговцы нанимают помощников, семейные дома сдают комнаты, у харчевен вывешивают дополнительные навесы. Крупнейший и наиболее значимый полис полуострова умеет превращать зрелище в городской труд. На огромной арене встречаются бойцы со всех земель, а зрители спорят о манере владеть оружием с той же страстью, с какой спорят о решениях совета. Перед состязанием город украшают красными полотнищами; повседневная одежда проста и удобна для движения. Военная подготовка составляет часть гражданской жизни. Совместные упражнения и помощь соседям в трудной работе воспитывают привычку полагаться на товарища. Командиров выбирают, но решения о городских средствах принимает гражданский совет. Влиятельные наставники требуют вкладываться в укрепления, устроители зрелищ напоминают о доходах приезжего сезона. Слава победителя помогает добиться внимания, однако сама по себе не даёт права распоряжаться казной. Колизей уважает физическое мастерство, выдержку и исполненное обязательство. Бои включают спортивные состязания, добровольные поединки и показательные сражения. Происхождение не закрывает путь к уважению: тифлинги живут и работают здесь наряду с другими горожанами. Чужак быстро найдёт компанию, если готов выслушать рассказ о местных чемпионах. Ему полезно помнить, что громкая ссора на рынке ещё не приглашение превратить её в бой.","excerpt":"Задолго до главных боёв Колизей заполняют гости. Мелкие торговцы нанимают помощников, семейные дома сдают комнаты, у харчевен вывешивают дополнительные навесы. Крупнейший и…","wordCount":184,"readingMinutes":1,"facts":[{"label":"Положение","value":"Крупнейший и наиболее значимый полис полуострова"},{"label":"Управление","value":"Гражданский совет и выборные командиры"},{"label":"Обычай","value":"Военная подготовка в гражданской жизни"},{"label":"Арена","value":"Состязания, добровольные поединки и показательные сражения"}],"tags":["Полис","Арена","Воинская культура"]},{"id":"two-islands","title":"Государство Двух Островов","chapterId":"states","chapterTitle":"Государства и политические образования","images":["two-islands"],"html":"\u003cp>В Порту Сити за открытыми ставнями идут занятия, а писцы сушат листы со свежими чернилами; в Порту Итчи слышны удары по корабельному дереву и перекличка на пристанях. Оба города связаны общими рынками, браками и морем. Длинную верхнюю одежду запахивают и закрепляют широким поясом; на работе рукава подбирают. Праздничные ткани различаются по узору и достатку, а привычка чинить семейные вещи позволяет отличить возраст наряда от бедности владельца.\u003c/p>\n\u003cp>Острова пришли к единому государству через необходимость согласовывать морскую защиту и торговые правила. Общий избираемый правитель отвечает за флот и внешние соглашения, местные собрания — за землю, сборы и повседневные суды. В Порту Сити влиятельны школы чиновников, в Порту Итчи — объединения поселений и домов мореплавателей. Эти различия вызывают споры о порядке назначений, но не делят жителей на два неизменных характера. Купцы обоих островов хотят понятного обращения с гостями.\u003c/p>\n\u003cp>Страна открыта приезжим. Их мало из-за внешних рассказов о людях, будто бы живущих рядом с духами и демонами. Местные сказители тоже рассказывают такие истории, однако слух не доказывает соседства с чудовищем. Путнику доступны обычные постоялые дворы и проводники. Учтиво расспросив о порядке посещения дома или святилища, он чаще найдёт терпеливое объяснение, чем ожидаемую по чужим рассказам угрозу.\u003c/p>","plain":"В Порту Сити за открытыми ставнями идут занятия, а писцы сушат листы со свежими чернилами; в Порту Итчи слышны удары по корабельному дереву и перекличка на пристанях. Оба города связаны общими рынками, браками и морем. Длинную верхнюю одежду запахивают и закрепляют широким поясом; на работе рукава подбирают. Праздничные ткани различаются по узору и достатку, а привычка чинить семейные вещи позволяет отличить возраст наряда от бедности владельца. Острова пришли к единому государству через необходимость согласовывать морскую защиту и торговые правила. Общий избираемый правитель отвечает за флот и внешние соглашения, местные собрания — за землю, сборы и повседневные суды. В Порту Сити влиятельны школы чиновников, в Порту Итчи — объединения поселений и домов мореплавателей. Эти различия вызывают споры о порядке назначений, но не делят жителей на два неизменных характера. Купцы обоих островов хотят понятного обращения с гостями. Страна открыта приезжим. Их мало из-за внешних рассказов о людях, будто бы живущих рядом с духами и демонами. Местные сказители тоже рассказывают такие истории, однако слух не доказывает соседства с чудовищем. Путнику доступны обычные постоялые дворы и проводники. Учтиво расспросив о порядке посещения дома или святилища, он чаще найдёт терпеливое объяснение, чем ожидаемую по чужим рассказам угрозу.","excerpt":"В Порту Сити за открытыми ставнями идут занятия, а писцы сушат листы со свежими чернилами; в Порту Итчи слышны удары по корабельному дереву и перекличка на пристанях. Оба города…","wordCount":192,"readingMinutes":2,"facts":[{"label":"Города","value":"Порт Сити и Порт Итчи"},{"label":"Глава государства","value":"Общий избираемый правитель"},{"label":"Местная власть","value":"Собрания ведают землёй, сборами и повседневными судами"},{"label":"Приезжие","value":"Страна открыта; гостей мало из-за внешних слухов"}],"tags":["Островное государство","Мореплавание","Открыто гостям"]},{"id":"xerian-confederation","title":"Песчаная Конфедерация Ксерийских Стран","chapterId":"states","chapterTitle":"Государства и политические образования","images":["xerian-confederation"],"html":"\u003cp>Из пустыни город сначала кажется полосой зелени и света. За внешними стенами лежат сады, водосборники и тесные улицы с теневыми навесами; на караванной площади путешественник слышит сразу несколько способов назвать один товар. Конфедерация — родина табакси, живущих рядом с многочисленными людьми. Светлую свободную одежду дополняют покрывала от солнца и песка; дорогие красители чаще оставляют для отделки, праздничных поясов и домашнего убранства.\u003c/p>\n\u003cp>Султаны правят собственными большими городами, преимущественно выросшими у оазисов или других плодородных земель. Союз удерживают договоры о караванах, пошлинах и доступе к воде. Среди влиятельных правителей — Нафир ас-Сахл, добивающийся единых мер для торговли, и Самира аль-Райя, защищающая самостоятельность городских сборов. Их спор касается устройства союза; обычный возчик прежде всего хочет заранее знать, что потребуют на следующей заставе. Внутри городов владельцы садов, ремесленники и караванные хозяева также не всегда согласны друг с другом.\u003c/p>\n\u003cp>Богов общего пантеона здесь почитают под местными именами. Гость может узнать знакомый обряд, прежде чем поймёт обращение жреца. Вежливо предложить воду путнику — уважаемый обычай, но право на общий колодец регулируется строго. За пределами обжитых земель встречаются трикрины, неразумные пустынные монстры. Поэтому караван ищет проводника по опыту и рекомендациям, а не по уверенности, с которой тот обещает лёгкую дорогу.\u003c/p>","plain":"Из пустыни город сначала кажется полосой зелени и света. За внешними стенами лежат сады, водосборники и тесные улицы с теневыми навесами; на караванной площади путешественник слышит сразу несколько способов назвать один товар. Конфедерация — родина табакси, живущих рядом с многочисленными людьми. Светлую свободную одежду дополняют покрывала от солнца и песка; дорогие красители чаще оставляют для отделки, праздничных поясов и домашнего убранства. Султаны правят собственными большими городами, преимущественно выросшими у оазисов или других плодородных земель. Союз удерживают договоры о караванах, пошлинах и доступе к воде. Среди влиятельных правителей — Нафир ас-Сахл, добивающийся единых мер для торговли, и Самира аль-Райя, защищающая самостоятельность городских сборов. Их спор касается устройства союза; обычный возчик прежде всего хочет заранее знать, что потребуют на следующей заставе. Внутри городов владельцы садов, ремесленники и караванные хозяева также не всегда согласны друг с другом. Богов общего пантеона здесь почитают под местными именами. Гость может узнать знакомый обряд, прежде че
