вёт по-разному в разных землях. Люди — самая распространённая раса Миттерии, но подданный Октаниуса, гражданин Римуриса и житель Государства Двух Островов…","wordCount":92,"readingMinutes":1,"facts":[]},{"id":"humans","title":"Люди и соседи","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","images":["people-humans"],"html":"\u003cp>Человеческие общества занимают королевства, республики, имперские земли, острова и пустынные города. Среди людей встречаются другие народы — постоянные жители, приезжие работники, торговцы, семьи беженцев. В большом городе соседи могут здороваться годами, исповедуя разные верования и называя разные места домом.\u003c/p>\n\u003cp>В смешанном квартале пекарь запоминает, кто приходит за хлебом до рассвета, а кто заканчивает работу ночью. Соседи одалживают друг другу лестницу, спорят из-за дыма и растят детей возле одной водокачки. Такое знакомство помогает замечать людей за привычными названиями народов, хотя за воротами квартала старые предрассудки могут встретить их снова.\u003c/p>","plain":"Человеческие общества занимают королевства, республики, имперские земли, острова и пустынные города. Среди людей встречаются другие народы — постоянные жители, приезжие работники, торговцы, семьи беженцев. В большом городе соседи могут здороваться годами, исповедуя разные верования и называя разные места домом. В смешанном квартале пекарь запоминает, кто приходит за хлебом до рассвета, а кто заканчивает работу ночью. Соседи одалживают друг другу лестницу, спорят из-за дыма и растят детей возле одной водокачки. Такое знакомство помогает замечать людей за привычными названиями народов, хотя за воротами квартала старые предрассудки могут встретить их снова.","excerpt":"Человеческие общества занимают королевства, республики, имперские земли, острова и пустынные города. Среди людей встречаются другие народы — постоянные жители, приезжие работники,…","wordCount":88,"readingMinutes":1,"facts":[]},{"id":"northern-peoples","title":"Северные народы","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","images":["people-dwarves-gnomes","people-goliaths"],"html":"\u003cp>Гномов, дворфов и голиафов объединяет давняя северная история. Союз первых двух народов определяет нынешний \u003ca class=\"wiki-link entity-link\" href=\"#dun-moroz\">Дун Мороз\u003c/a>; судьба голиафов связана с изгнанием и попытками возвращения. Эти события остаются частью семейной памяти и не сводятся к одной одинаковой для всех истории.\u003c/p>\n\u003cp>Само происхождение не говорит, как отдельный северянин относится к старому конфликту. Он может служить пограничью, работать далеко от родины или знать о ней лишь из рассказов родителей. Для героя важны собственные связи: кому он пишет домой, чью вещь бережёт в дороге и почему предпочёл отправиться за пределы знакомых земель.\u003c/p>","plain":"Гномов, дворфов и голиафов объединяет давняя северная история. Союз первых двух народов определяет нынешний Дун Мороз; судьба голиафов связана с изгнанием и попытками возвращения. Эти события остаются частью семейной памяти и не сводятся к одной одинаковой для всех истории. Само происхождение не говорит, как отдельный северянин относится к старому конфликту. Он может служить пограничью, работать далеко от родины или знать о ней лишь из рассказов родителей. Для героя важны собственные связи: кому он пишет домой, чью вещь бережёт в дороге и почему предпочёл отправиться за пределы знакомых земель.","excerpt":"Гномов, дворфов и голиафов объединяет давняя северная история. Союз первых двух народов определяет нынешний Дун Мороз; судьба голиафов связана с изгнанием и попытками возвращения.…","wordCount":88,"readingMinutes":1,"facts":[]},{"id":"elves-and-fairies","title":"Эльфы полуэльфы и феи","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","images":["people-elves-fairies"],"html":"\u003cp>Эльфийские острова сохраняют особую привлекательность для эльфов и фей. Феи встречаются и в других местах, но предпочитают островные земли с их близостью к природному равновесию. Их соседство не делает все общины одинаковыми: порт, лесное поселение и двор старого дома имеют собственные привычки.\u003c/p>\n\u003cp>Полуэльфы обычно встречают у эльфов неприязнь, а среди людей — большую терпимость. Такое положение заставляет по-разному искать место в обществе. Один держится семьи, другой — товарищей по ремеслу, третий уезжает туда, где его оценивают по работе. Предрассудки заметно влияют на жизнь, но не предрешают каждую личную встречу.\u003c/p>","plain":"Эльфийские острова сохраняют особую привлекательность для эльфов и фей. Феи встречаются и в других местах, но предпочитают островные земли с их близостью к природному равновесию. Их соседство не делает все общины одинаковыми: порт, лесное поселение и двор старого дома имеют собственные привычки. Полуэльфы обычно встречают у эльфов неприязнь, а среди людей — большую терпимость. Такое положение заставляет по-разному искать место в обществе. Один держится семьи, другой — товарищей по ремеслу, третий уезжает туда, где его оценивают по работе. Предрассудки заметно влияют на жизнь, но не предрешают каждую личную встречу.","excerpt":"Эльфийские острова сохраняют особую привлекательность для эльфов и фей. Феи встречаются и в других местах, но предпочитают островные земли с их близостью к природному равновесию.…","wordCount":89,"readingMinutes":1,"facts":[]},{"id":"other-peoples","title":"Народы разных земель","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","images":["people-dragonborn","people-halflings","people-tabaxi","people-goblins"],"html":"\u003cp>Драконорождённые связаны с кланами юго-запада. За четырьмя влиятельными именами стоят многочисленные семьи, и принадлежность к народу не исчерпывается знанием главных кланов. Полурослики имеют собственное королевство \u003ca class=\"wiki-link entity-link\" href=\"#halfling-kingdom\">Халфлинг\u003c/a>; его обособленность придаёт родине особое значение для тех, кто оказался за её пределами.\u003c/p>\n\u003cp>Табакси происходят из земель песчаной конфедерации и живут рядом с людьми в её городах. Гоблины встречаются в разных частях мира, в том числе в лесных поселениях \u003ca class=\"wiki-link entity-link\" href=\"#darkness-forest\">Даркнеса\u003c/a>. Человек, привыкший видеть только враждебные отряды, может плохо представлять себе жизнь чужого города. Личное знакомство нередко оказывается сложнее привычного рассказа о целом народе.\u003c/p>","plain":"Драконорождённые связаны с кланами юго-запада. За четырьмя влиятельными именами стоят многочисленные семьи, и принадлежность к народу не исчерпывается знанием главных кланов. Полурослики имеют собственное королевство Халфлинг; его обособленность придаёт родине особое значение для тех, кто оказался за её пределами. Табакси происходят из земель песчаной конфедерации и живут рядом с людьми в её городах. Гоблины встречаются в разных частях мира, в том числе в лесных поселениях Даркнеса. Человек, привыкший видеть только враждебные отряды, может плохо представлять себе жизнь чужого города. Личное знакомство нередко оказывается сложнее привычного рассказа о целом народе.","excerpt":"Драконорождённые связаны с кланами юго-запада. За четырьмя влиятельными именами стоят многочисленные семьи, и принадлежность к народу не исчерпывается знанием главных кланов.…","wordCount":89,"readingMinutes":1,"facts":[]},{"id":"tieflings","title":"Тифлинги и новая жизнь","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","images":["people-tieflings"],"html":"\u003cp>Многие тифлинги покинули \u003ca class=\"wiki-link entity-link\" href=\"#zvas\">Звас\u003c/a> и строят жизнь среди чужих обществ. Для семьи беженцев первые годы могут проходить между поиском жилья, заработка и людей, которым можно доверять. Вещь, привезённая с родины, становится особенно ценной, когда вернуть прежний дом невозможно: кусок ткани, домашний сосуд, записанное имя родственника.\u003c/p>\n\u003cp>В Октаниусе и Папстве тифлингам грозят жестокие преследования. В других странах сохраняются предрассудки, хотя условия различаются. Свободные города принимают их значительно охотнее и ставят личные качества выше происхождения. Поэтому путь переселенца определяется не только ближайшим безопасным берегом, но и надеждой найти место, где детям не придётся прятать свой облик.\u003c/p>","plain":"Многие тифлинги покинули Звас и строят жизнь среди чужих обществ. Для семьи беженцев первые годы могут проходить между поиском жилья, заработка и людей, которым можно доверять. Вещь, привезённая с родины, становится особенно ценной, когда вернуть прежний дом невозможно: кусок ткани, домашний сосуд, записанное имя родственника. В Октаниусе и Папстве тифлингам грозят жестокие преследования. В других странах сохраняются предрассудки, хотя условия различаются. Свободные города принимают их значительно охотнее и ставят личные качества выше происхождения. Поэтому путь переселенца определяется не только ближайшим безопасным берегом, но и надеждой найти место, где детям не придётся прятать свой облик.","excerpt":"Многие тифлинги покинули Звас и строят жизнь среди чужих обществ. Для семьи беженцев первые годы могут проходить между поиском жилья, заработка и людей, которым можно доверять.…","wordCount":94,"readingMinutes":1,"facts":[]},{"id":"work-and-status","title":"Работа и общественное положение","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","html":"\u003cp>Большинство жителей выращивает пищу, держит скот, работает в мастерских, перевозит грузы и обслуживает торговлю. Утро городского квартала начинается с воды, топлива и открытия ставен. Пока чиновник готовит печати, пекарский ученик уже вымел золу, а носильщик успел дважды сходить от пристани к складу. Благополучие двора и крепости зависит от такой незаметной работы.\u003c/p>\n\u003cp>Происхождение даёт одним землю и связи, другим — мастерскую или право на место в лавке. В королевствах важны отношения со знатью, в полисах — гражданство и участие в городских делах. Богатый мастер может распоряжаться большими средствами, чем обедневший дворянин, но уступать ему почётное место на приёме. Поэтому достаток, власть и уважение не всегда принадлежат одному человеку.\u003c/p>\n\u003cp>Положение семьи можно изменить учёбой, удачным делом, службой или браком, однако каждый путь требует средств и поддержки. Подмастерье нужны инструменты, писцу — обучение, человеку с товаром — поручитель и безопасная дорога. Авантюристы заметны именно потому, что выходят за пределы привычной последовательности: их удача может принести доход или известность гораздо быстрее, чем обычная работа, а неудача — лишить всего сразу.\u003c/p>","plain":"Большинство жителей выращивает пищу, держит скот, работает в мастерских, перевозит грузы и обслуживает торговлю. Утро городского квартала начинается с воды, топлива и открытия ставен. Пока чиновник готовит печати, пекарский ученик уже вымел золу, а носильщик успел дважды сходить от пристани к складу. Благополучие двора и крепости зависит от такой незаметной работы. Происхождение даёт одним землю и связи, другим — мастерскую или право на место в лавке. В королевствах важны отношения со знатью, в полисах — гражданство и участие в городских делах. Богатый мастер может распоряжаться большими средствами, чем обедневший дворянин, но уступать ему почётное место на приёме. Поэтому достаток, власть и уважение не всегда принадлежат одному человеку. Положение семьи можно изменить учёбой, удачным делом, службой или браком, однако каждый путь требует средств и поддержки. Подмастерье нужны инструменты, писцу — обучение, человеку с товаром — поручитель и безопасная дорога. Авантюристы заметны именно потому, что выходят за пределы привычной последовательности: их удача может принести доход или известность гораздо быстрее, чем обычная работа, а неудача — лишить всего сразу.","excerpt":"Большинство жителей выращивает пищу, держит скот, работает в мастерских, перевозит грузы и обслуживает торговлю. Утро городского квартала начинается с воды, топлива и открытия…","wordCount":166,"readingMinutes":1,"facts":[]},{"id":"clothes-and-objects","title":"Одежда и вещи","chapterId":"peoples","chapterTitle":"Народы и повседневная жизнь","html":"\u003cp>Обычный дорожный наряд начинается с нижней рубахи, прочной верхней одежды и обуви, которую можно починить в пути. Шерсть сохраняет тепло, полотняная ткань легче переносит жару, плотный плащ служит защитой от дождя и дополнительным покрывалом на ночлеге. Люди, привыкшие к дороге, особенно следят за швами, ремнями и сухими портянками; богатство отделки помогает меньше, чем хорошая посадка.\u003c/p>\n\u003cp>Положение выдают вещи, которые не требуются для самого труда: окрашенная тонкая ткань, чистый мех, сложная застёжка. На ярмарках показывают и редкие диковины — например, плащ с зачарованными листьями вышивки, которые медленно меняют цвет от весеннего зелёного до осенней меди. Покупатель осторожно трогает подкладку: чудо хочется проверить, а хорошую ткань всё равно придётся беречь от дорожной грязи.\u003c/p>\n\u003cp>Кошель носят ближе к телу, нож — там, где его удобно достать за едой и работой. В дорожной сумке лежат игла, нитки, чашка, гребень, кусок мыла и небольшой запас сухой пищи. Такие предметы редко попадают в торжественные рассказы, но их потеря способна сделать путешествие мучительным задолго до встречи с опасным противником.\u003c/p>","plain":"Обычный дорожный наряд начинается с нижней рубахи, прочной верхней одежды и обуви, которую можно починить в пути. Шерсть сохраняет тепло, полотняная ткань легче переносит жару, плотный плащ служит защитой от дождя и дополнительным покрывалом на ночлеге. Люди, привыкшие к дороге, особенно следят за швами, ремнями и сухими портянками; богатство отделки помогает меньше, чем хорошая посадка. Положение выдают вещи, которые не требуются для самого труда: окрашенная тонкая ткань, чистый мех, сложная застёжка. На ярмарках показывают и редкие диковины — например, плащ с зачарованными листьями вышивки, которые медлен ку иногда приезжает мастер маленьких чар. Его деревянная птица подпрыгивает над ладонью, оставляет в воздухе россыпь золотистых искр и снова становится неподвижной игрушкой. Дети требуют повторить, взрослые задерживаются рядом будто бы ради торговых дел. Потом представление заканчивается, и площадь возвращается к своим колёсам, весам и крикам: редкое чудо запоминают именно среди обычного дня.","excerpt":"Сбор урожая, открытие удобного торгового сезона и большие городские торги дают повод встретиться людям, живущим далеко друг от друга. На ярмарке заключают сделки, ищут учеников,…","wordCount":112,"readingMinutes":1,"facts":[]},{"id":"common-pantheon","title":"Боги рядом с повседневностью","chapterId":"religions","chapterTitle":"Вера и божества","html":"\u003cp>В Миттерии существуют добрые и злые боги, а религиозная жизнь не сводится к одному храму. Семья может особенно чтить своего покровителя, обращаться к другому божеству перед поездкой и соблюдать обычаи земли, где живёт. Преданность богу и принадлежность к организации тоже различаются: купец, оставивший дар у алтаря, от этого не становится храмовым служителем.\u003c/p>\n\u003cp>Имя Тира вспоминают при обещаниях и разбирательствах о справедливости. К Мистре обращаются те, чья жизнь связана с магией; Сильвануса чтут перед входом в дикую природу; Вокин — при торговых делах. Бэйн связан с тиранией, Шар — с тьмой и утратой. Этими именами пантеон не исчерпывается. Отношение к опасным культам зависит от общины и власти, но само существование божества не делает всякое служение ему почётным.\u003c/p>","plain":"В Миттерии существуют добрые и злые боги, а религиозная жизнь не сводится к одному храму. Семья может особенно чтить своего покровителя, обращаться к другому божеству перед поездкой и соблюдать обычаи земли, где живёт. Преданность богу и принадлежность к организации тоже различаются: купец, оставивший дар у алтаря, от этого не становится храмовым служителем. Имя Тира вспоминают при обещаниях и разбирательствах о сп ":"Магия и учреждения","html":"\u003cp>Магия знакома обитателям Миттерии, однако встреча с ней зависит от места и достатка. В большом городе можно разыскать наставника, храмового служителя или практика с хорошими рекомендациями. В деревне тот же человек становится заметной фигурой: о его приезде узнают раньше, чем распрягут лошадей. Соседство с магом меняет возможности общины, но не делает каждого её жителя сведущим в заклинаниях.\u003c/p>\n\u003cp>За сверхъестественной помощью обращаются при болезни, опасной находке, тревожном явлении или работе, требующей особого мастерства. Часть просьб решают обычным умением: грамотный собеседник, знание трав или верное толкование старого текста тоже ценятся. Хороший практик уточняет задачу прежде, чем обещать результат. Звание само по себе мало говорит о том, какие именно чудеса доступны его носителю.\u003c/p>","plain":"Магия знакома обитателям Миттерии, однако встреча с ней зависит от места и достатка. В большом городе можно разыскать наставника, храмового служителя или практика с хорошими рекомендациями. В деревне тот же человек становится заметной фигурой: о его приезде узнают раньше, чем распрягут лошадей. Соседство с магом меняет возможности общины, но не делает каждого её жителя сведущим в заклинаниях. За сверхъестественной помощью обращаются при болезни, опасной находке, тревожном явлении или работе, требующей особого мастерства. Часть просьб решают обычным умением: грамотный собеседник, знание трав или верное толкование старого текста тоже ценятся. Хороший практик уточняет задачу прежде, чем обещать результат. Звание само по себе мало говорит о том, какие именно чудеса доступны его носителю.","excerpt":"Магия знакома обитателям Миттерии, однако встреча с ней зависит от места и достатка. В большом городе можно разыскать наставника, храмового служителя или практика с хорошими…","wordCount":110,"readingMinutes":1,"facts":[]},{"id":"magic-cost","title":"Цена умения","chapterId":"magic-and-forest","chapterTitle":"Магия и учреждения","html":"\u003cp>Цена магической помощи складывается из времени, подготовки, необходимых материалов и ответственности исполнителя. В одном случае достаточно соседской услуги, в другом нужен редкий специалист и долгий поиск. Храм может помочь из милосердия, мастер — ради прежнего обещания, правитель — принять расходы на себя. Такие решения зависят от отношений и обстоятельств, а не отменяют затрат.\u003c/p>\n\u003cp>Поэтому магия влияет на хозяйство через конкретных людей. Купец дорожит знакомством с надёжным специалистом, община старается удержать умеющего лечить соседа, богатый дом оплачивает обучение способного ребёнка. При этом караваны продолжают возить зерно, ремесленники чинят крыши, а города содержат колодцы. Наличие выдающегося умения ещё не обеспечивает его постоянную доступность всем нуждающимся.\u003c/p>","plain":"Цена магической помощи складывается из времени, подготовки, необходимых материалов и ответственности исполнителя. В одном случае достаточно соседской услуги, в другом нужен редкий специалист и долгий поиск. Храм может помочь из милосердия, мастер — ради прежнего обещания, правитель — принять расходы на себя. Такие решения зависят от отношений и обстоятельств, а не отменяют затрат. Поэтому магия влияет на хозяйство через конкретных людей. Купец дорожит знакомством с надёжным специалистом, община старается удержать умеющего лечить соседа, богатый дом оплачивает обучение способного ребёнка. При этом караваны продолжают возить зерно, ремесленники чинят крыши, а города содержат колодцы. Наличие выдающегося умения ещё не обеспечивает его постоянную доступность всем нуждающимся.","excerpt":"Цена магической помощи складывается из времени, подготовки, необходимых материалов и ответственности исполнителя. В одном случае достаточно соседской услуги, в другом нужен редкий…","wordCount":103,"readingMinutes":1,"facts":[]},{"id":"magic-apprenticeship","title":"Учитель и ученик","chapterId":"magic-and-forest","chapterTitle":"Магия и учреждения","html":"\u003cp>Три великих училища не исчерпывают путей к магии. Знания передают частные наставники и семьи; часть обучения связана с храмовой службой. Учитель выбирает ученика по способностям, терпению и доверию. Начало может выглядеть скромно: переписать заметки, привести в порядок инструменты, выучить названия веществ, различить полезный образец и опасную находку.\u003c/p>\n\u003cp>Ученичество создаёт обязательства с обеих сторон. Наставник отвечает за то, чему учит, ученик — за порученные вещи и обещания. Одни остаются при учителе надолго, другие уходят искать книги и коллег. Покровитель способен оплатить дорогу и содержание, но покупка красивого тома сама по себе не заменяет понимания. Репутация сопровождает практика так же настойчиво, как ремесленника или врача.\u003c/p>","plain":"Три великих училища не исчерпывают путей к магии. Знания передают частные наставники и семьи; часть обучения связана с храмовой службой. Учитель выбирает ученика по способностям, терпению и доверию. Начало может выглядеть скромно: переписать заметки, привести в порядок инструменты, выучить названия веществ, различить полезный образец и опасную находку. Ученичество создаёт обязательства с обеих сторон. Наставник отвечает за то, чему учит, ученик — за порученные вещи и обещания. Одни остаются при учителе надолго, другие уходят искать книги и коллег. Покровитель способен оплатить дорогу и содержание, но покупка красивого тома сама по себе не заменяет понимания. Репутация сопровождает практика так же настойчиво, как ремесленника или врача.","excerpt":"Три великих училища не исчерпывают путей к магии. Знания передают частные наставники и семьи; часть обучения связана с храмовой службой. Учитель выбирает ученика по способностям,…","wordCount":103,"readingMinutes":1,"facts":[]},{"id":"magic-schools","title":"Три великих училища магов","chapterId":"magic-and-forest","chapterTitle":"Магия и учреждения","html":"\u003cp>К югу от имперских земель на карте отмечены Три великих училища магов — независимое, аполитичное место, связанное с волшебниками и другими магическими существами. Его известность простирается значительно дальше достоверных сведений о внутренней жизни. Попасть туда сложно; знакомство с названием не означает знакомства с порядками.\u003c/p>\n\u003cp>Для внешнего мира училища прежде всего показывают, что занятия магией способны существовать вне обычного подчинения короне или церковной власти. Их нельзя считать ведомством \u003ca class=\"wiki-link entity-link\" href=\"#octanius\">Октаниуса\u003c/a> только из-за соседства на карте. Путник может увидеть в них надежду на обучение, учёный — возможность поиска, семья — далёкую цель для способного ребёнка. Подробности того, что ждёт за порогом, не принадлежат общему знанию Миттерии.\u003c/p>","plain":"К югу от имперских земель на карте отмечены Три великих училища магов — независимое, аполитичное место, связанное с волшебниками и другими магическими существами. Его известность простирается значительно дальше достоверных сведений о внутренней жизни. Попасть туда сложно; знакомство с названием не означает знакомства с порядками. Для внешнего мира училища прежде всего показывают, что занятия магией способны существовать вне обычного подчинения короне или церковной власти. Их нельзя считать ведомством Октаниуса только из-за соседства на карте. Путник может увидеть в них надежду на обучение, учёный — возможность поиска, семья — далёкую цель для способного ребёнка. Подробности того, что ждёт за порогом, не принадлежат общему знанию Миттерии.","excerpt":"К югу от имперских земель на карте отмечены Три великих училища магов — независимое, аполитичное место, связанное с волшебниками и другими магическими существами. Его известность…","wordCount":103,"readingMinutes":1,"facts":[{"label":"Положение","value":"Независимое и аполитичное место"},{"label":"На карте","value":"К югу от имперских земель"},{"label":"Доступ и сведения","value":"Попасть сложно; внутренние порядки не общеизвестны"}],"tags":["Магия","Независимость","Трудный доступ"]},{"id":"journeys","title":"Дорога и время","chapterId":"travellers","chapterTitle":"Путник и авантюрист","html":"\u003cp>Небольшая группа по удобным дорогам обычно проходит регион за одну или две недели; между далёкими областями путь может занять один или два месяца. Срок меняется из-за гор, ненастья, ожидания переправы и необходимости обходить опасный участок. Морской рейс зависит от сезона и готовности судна. Хорошо подготовленное путешествие начинается с расспросов задолго до выхода за ворота.\u003c/p>\n\u003cp>Припасы считают до следующего надёжного места покупки, а не до точки, обозначенной на карте. Вода может оказаться негодной, постоялый двор — переполненным, хозяин переправы — уехать за новым канатом. Возчик везёт запасную ось, пеший путник бережёт обувь, всадник ищет корм для животного. Подготовка не избавляет от неожиданностей, но оставляет время с ними справиться.\u003c/p>\n\u003cp>На границе выясняют, кому платить сбор, где разрешено останавливаться и чьи знаки власти здесь признают. Чужая речь сама по себе не означает опасности, а знакомый герб не гарантирует честного приёма. Идущие одним путём люди часто объединяются ради ночлега, присмотра за поклажей и обмена сведениями. Продолжать дорогу вместе разумнее после разговора о темпе, расходах и обязанностях.\u003c/p>","plain":"Небольшая группа по удобным дорогам обычно проходит регион за одну или две недели; между далёкими областями путь может занять один или два месяца. Срок меняется из-за гор, ненастья, ожидания переправы и необходимости обходить опасный участок. Морской рейс зависит от сезона и готовности судна. Хорошо подготовленное путешествие начинается с расспросов задолго до выхода за ворота. Припасы считают до следующего надёжного места покупки, а не до точки, обозначенной на карте. Вода может оказаться негодной, постоялый двор — переполненным, хозяин переправы — уехать за новым канатом. Возчик везёт запасную ось, пеший путник бережёт обувь, всадник ищет корм для животного. Подготовка не избавляет от неожиданностей, но оставляет время с ними справиться. На границе выясняют, кому платить сбор, где разрешено останавливаться и чьи знаки власти здесь признают. Чужая речь сама по себе не означает опасности, а знакомый герб не гарантирует честного приёма. Идущие одним путём люди часто объединяются ради ночлега, присмотра за поклажей и обмена сведениями. Продолжать дорогу вместе разумнее после разговора о темпе, расходах и обязанностях.","excerpt":"Небольшая группа по удобным дорогам обычно проходит регион за одну или две недели; между далёкими областями путь может занять один или два месяца. Срок меняется из-за гор,…","wordCount":162,"readingMinutes":1,"facts":[]},{"id":"adventurers-work","title":"Три пути к работе","chapterId":"travellers","chapterTitle":"Путник и авантюрист","html":"\u003cp>Открытый наём ищут через городскую управу, у торговцев и караванных хозяев, а также при храмах и общинных домах. В управе нужны люди для поручений за пределами обычной службы. Торговцы нанимают сопровождающих и тех, кто умеет обращаться с грузом. Общины ищут проводников, посыльных и помощников там, где постоянных работников недостаточно.\u003c/p>\n\u003cp>До согласия выясняют, что предстоит сделать, кто принимает результат и когда платят. Остальное многое расскажет само место: состояние повозок, настроение работников, готовность хозяина назвать опасный участок дороги. Надёжный наём начинается с ясного разговора, а не с красивого объявления.\u003c/p>\n\u003cp>Иногда знакомство начинается без объявления: у ворот лопается ремень, корзины катятся с телеги, и несколько прохожих помогают удержать испуганное животное. Пока груз собирают, хозяин замечает, кто умеет обращаться с упряжью, а кто спокойно распоряжается в суматохе. Работа достаётся людям, которых успели увидеть в деле.\u003c/p>","plain":"Открытый наём ищут через городскую управу, у торговцев и караванных хозяев, а также при храмах и общинных домах. В управе нужны люди для поручений за пределами обыч негов. Сведения быстро обрастают подробностями: ссора двух стражников становится бунтом гарнизона, необычный зверь — чудовищем размером с дом. Полезнее всего расспросить о том, что рассказчик видел сам: где ночевал, как выглядела переправа, у кого покупал еду. Не стоит пренебрегать и простой любезностью. Человек охотнее поделится свежей новостью с тем, кто помог развести огонь или подвинулся на скамье, чем с незнакомцем, потребовавшим ответов с порога.","excerpt":"По вечерам путники сравнивают то, что слышали о дороге. Моряк узнаёт примету знакомого мыса в рассказе сухопутного торговца, а уроженец гор смеётся над чужим преувеличением…","wordCount":89,"readingMinutes":1,"facts":[]},{"id":"your-character","title":"Герой перед первым шагом","chapterId":"travellers","chapterTitle":"Путник и авантюрист","html":"\u003cp>Выбирая родину персонажа, подумайте, какую часть её жизни он действительно знает. Ребёнок портового грузчика и воспитанник дворянского дома смотрят на один город с разных сторон. Определите привычное занятие, несколько близких людей и обязательство, которое не исчезнет после ухода из дома. Иногда достаточно одной вещи, которую герой взял с собой, чтобы понять, что для него важно.\u003c/p>\n\u003cp>Повод отправиться в путь может быть скромным: поиск работы, желание учиться, семейное поручение или надежда начать заново. Важнее понять, почему герой согласится сотрудничать с другими и что он способен предложить спутникам помимо оружия. Умение читать счёт, чинить одежду, ухаживать за животными или слушать незнакомых людей придаёт приключениям собственный облик.\u003c/p>\n\u003cp>Перед созданием листа согласуйте с мастером доступные народы, классы и источники правил, редакцию игры, уровень и место начала. Наличие народа в энциклопедии ещё не означает, что его можно выбрать для любой партии. Отдельно обсудите, насколько подробно вы хотите играть религиозное давление, войну и общественные преследования. История происхождения должна помогать совместной игре, а не с ое занятие, сохранив память о людях, с которыми делил дорогу.\u003c/p>","plain":"Путь этой группы начался в Швабии и продолжился в Великом лесу Даркнес. Совместные приключения принесли её участникам признание аристократов и оставили след в жизни лесных поселений. После завершения похода каждый выбрал собственное занятие, сохранив память о людях, с которыми делил дорогу.","excerpt":"Путь этой группы начался в Швабии и продолжился в Великом лесу Даркнес. Совместные приключения принесли её участникам признание аристократов и оставили след в жизни лесных…","wordCount":41,"readingMinutes":1,"facts":[]},{"id":"kibat","title":"Кибат","chapterId":"characters","chapterTitle":"Память о героях","imageKey":"kibat","facts":[{"label":"Раса","value":"Полуэльфийка"},{"label":"Класс","value":"Друид"}],"html":"\u003cp>Полуэльфийка-друид Кибат — одна из четырёх авантюристов, чей общий путь начался в \u003ca class=\"wiki-link entity-link\" href=\"#swabia\">Швабии\u003c/a> и продолжился в Даркнесе. В памяти о группе её имя стоит рядом с именами Бьёрна, Конрада и Кевина: известность пришла к ним через совместные приключения и признание людей, видевших их дела. Лесная история стала важной частью этого пути, а жизнь Кибат после неё сохранила тесную связь с природой.\u003c/p>\n\u003cp>После лесного приключения Кибат стала чаще останавливаться в поселениях у лесной окраины. Она помогает ухаживать за садами, учит различать растения и расспрашивает местных жителей об изменениях вокруг. Приглашение за стол ценит больше торжественного приёма. Кибат по-прежнему уходит в дорогу, но теперь охотнее возвращается туда, где её ждут не ради необычного зрелища, а ради совместной работы.\u003c/p>","plain":"Полуэльфийка-друид Кибат — одна из четырёх авантюристов, чей общий путь начался в Швабии и продолжился в Даркнесе. В памяти о группе её имя стоит рядом с именами Бьёрна, Конрада и Кевина: известность пришла к ним через совместные приключения и признание людей, видевших их дела. Лесная история стала важной частью этого пути, а жизнь Кибат после неё сохранила тесную связь с природой. После лесного приключения Кибат стала чаще останавливаться в поселениях у лесной окраины. Она помогает ухаживать за садами, учит различать растения и расспрашивает местных жителей об изменениях вокруг. Приглашение за стол ценит больше торжественного приёма. Кибат по-прежнему уходит в дорогу, но теперь охотнее возвращается туда, где её ждут не ради необычного зрелища, а ради совместной работы.","excerpt":"Полуэльфийка-друид Кибат — одна из четырёх авантюристов, чей общий путь начался в Швабии и продолжился в Даркнесе. В памяти о группе её имя стоит рядом с именами Бьёрна, Конрада и…","wordCount":116,"readingMinutes":1},{"id":"bjorn","title":"Бьёрн Торсен","chapterId":"characters","chapterTitle":"Память о героях","imageKey":"bjorn","facts":[{"label":"Раса","value":"Человек"},{"label":"Класс","value":"Варвар"}],"html":"\u003cp>Человек-варвар Бьёрн Торсен вошёл в историю прежнего отряда вместе с \u003ca class=\"wiki-link entity-link\" href=\"#kibat\">Кибат\u003c/a>, Конрадом и Кевином. Их известность выросла в \u003ca class=\"wiki-link entity-link\" href=\"#swabia\">Швабии\u003c/a>, затем дорога привела группу в Великий лес \u003ca class=\"wiki-link entity-link\" href=\"#darkness-forest\">Даркнес\u003c/a>. Признание аристократов стало частью общей репутации спутников. После похода Бьёрн нашёл применение своему опыту в деле, где от выдержки и подготовки зависит благополучие людей, отправляющихся в дорогу.\u003c/p>\n\u003cp>После Даркнеса Бьёрн занялся подготовкой охранников, сопровождающих обозы. На занятиях начинает с простой вещи: проверить ремень, осмотреть повозку, убедиться, что спутник ещё держится на ногах. Он продолжает выходить в дорогу, но реже берётся за работу ради одного желания испытать себя. Ему нравится видеть, как люди, прежде боявшиеся первого перехода, возвращаются домой с честно заработанной платой.\u003c/p>","plain":"Человек-варвар Бьёрн Торсен вошёл в историю прежнего отряда вместе с Кибат, Конрадом и Кевином. Их известность выросла в Швабии, затем дорога привела группу в Великий лес Даркнес. Признание аристократов стало частью общей репутации спутников. После похода Бьёрн нашёл применение своему опыту в деле, где от выдержки и подготовки зависит благополучие людей, отправляющихся в дорогу. После Даркнеса Бьёрн занялся подготовкой охранников, сопровождающих обозы. На занятиях начинает с простой вещи: проверить ремень, осмотреть повозку, убедиться, что спутник ещё держится на ногах. Он продолжает выходить в дорогу, но реже берётся за работу ради одного желания испытать себя. Ему нравится видеть, как люди, прежде боявшиеся первого перехода, возвращаются домой с честно заработанной платой.","excerpt":"Человек-варвар Бьёрн Торсен вошёл в историю прежнего отряда вместе с Кибат, Конрадом и Кевином. Их известность выросла в Швабии, затем дорога привела группу в Великий лес Даркнес.…","wordCount":109,"readingMinutes":1},{"id":"konrad","title":"Конрад Кринжевальд","chapterId":"characters","chapterTitle":"Память о героях","imageKey":"konrad","facts":[{"label":"Раса","value":"Высший эльф"},{"label":"Класс","value":"Колдун"}],"html":"\u003cp>Высший эльф и колдун Конрад Кринжевальд принадлежал к прежнему отряду авантюристов \u003ca class=\"wiki-link entity-link\" href=\"#swabia\">Швабии\u003c/a>. Рядом с ним прошли этот путь Бьёрн, \u003ca class=\"wiki-link entity-link\" href=\"#kibat\">Кибат\u003c/a> и Кевин; лесное приключение в Даркнесе стало частью их общей истории. Известность среди знати связывала Конрада с людьми далеко за пределами одной дороги. В дальнейшей жизни эти знакомства помогли ему найти занятие, требующее терпения и внимательного отношения к чужим словам.\u003c/p>\n\u003cp>После похода Конрад вернулся к книгам и занялся проверкой сомнительных рукописей для частных собирателей. Он выясняет происхождение текста, ищет подменённые страницы и старается отделять полезное знание от торгового обмана. Сложное приобретение может снова отправить его в дорогу. Теперь Конрад охотнее спрашивает очевидцев и ремесленников: в их кратком объяснении иногда находится то, чего нет в длинном трактате.\u003c/p>","plain":"Высший эльф и колдун Конрад Кринжевальд принадлежал к прежнему отряду авантюристов Швабии. Рядом с ним прошли этот путь Бьёрн, Кибат и Кевин; лесное приключение в Даркнесе стало частью их общей истории. Известность среди знати связывала Конрада с людьми далеко за пределами одной дороги. В дальнейшей жизни эти знакомства помогли ему найти занятие, требующее терпения и внимательного отношения к чужим словам. После похода Конрад вернулся к книгам и занялся проверкой сомнительных рукописей для частных собирателей. Он выясняет происхождение текста, ищет подменённые страницы и старается отделять полезное знание от торгового обмана. Сложное приобретение может снова отправить его в дорогу. Теперь Конрад охотнее спрашивает очевидцев и ремесленников: в их кратком объяснении иногда находится то, чего нет в длинном трактате.","excerpt":"Высший эльф и колдун Конрад Кринжевальд принадлежал к прежнему отряду авантюристов Швабии. Рядом с ним прошли этот путь Бьёрн, Кибат и Кевин; лесное приключение в Даркнесе стало…","wordCount":116,"readingMinutes":1},{"id":"kevin","title":"Кевин Акранех","chapterId":"characters","chapterTitle":"Память о героях","imageKey":"kevin","facts":[{"label":"Раса","value":"Полуэльф"},{"label":"Класс","value":"Следопыт"}],"html":"\u003cp>Полуэльф-следопыт Кевин Акранех путешествовал с маленьким дракончиком, занимавшим в его жизни место близкого спутника. Его имя связано со швабскими приключениями прежнего отряда и походом в Великий лес \u003ca class=\"wiki-link entity-link\" href=\"#darkness-forest\">Даркнес\u003c/a>. Вместе с Бьёрном, \u003ca class=\"wiki-link entity-link\" href=\"#kibat\">Кибат\u003c/a> и Конрадом он заслужил репутацию, которую помнят за пределами круга ближайших знакомых. Небольшого дракона рядом с путником узнавали даже те, кому ещё не довелось услышать всю историю группы.\u003c/p>\n\u003cp>После Даркнеса Кевин продолжил водить небольшие компании путников. Он оставляет хозяевам постоялых дворов короткие дорожные заметки, помогает приезжим выбрать посильный переход и не обещает лёгкого пути только ради найма. Дракончик остаётся рядом, привлекая любопытные взгляды на остановках. Кевин не ищет постоянного места при дворе: ему привычнее узнавать знакомую крышу издалека и обнаруживать, что хозяева помнят его имя.\u003c/p>","plain":"Полуэльф-следопыт Кевин Акранех путешествовал с маленьким дракончиком, занимавшим в его жизни место близкого спутника. Его имя связано со швабскими приключениями прежнего отряда и походом в Великий лес Даркнес. Вместе с Бьёрном, Кибат и Конрадом он заслужил репутацию, которую помнят за пределами круга ближайших знакомых. Небольшого дракона рядом с путником узнавали даже те, кому ещё не довелось услышать всю историю группы. После Даркнеса Кевин продолжил водить небольшие компании путников. Он оставляет хозяевам постоялых дворов короткие дорожные заметки, помогает приезжим выбрать посильный переход и не обещает лёгкого пути только ради найма. Дракончик остаётся рядом, привлекая любопытные взгляды на остановках. Кевин не ищет постоянного места при дворе: ему привычнее узнавать знакомую крышу издалека и обнаруживать, что хозяева помнят его имя.","excerpt":"Полуэльф-следопыт Кевин Акранех путешествовал с маленьким дракончиком, занимавшим в его жизни место близкого спутника. Его имя связано со швабскими приключениями прежнего отряда и…","wordCount":117,"readingMinutes":1},{"id":"index","title":"Предметный указатель","chapterId":"index","chapterTitle":"Предметный указатель","html":"\u003cul>\u003cli>\u003cstrong>Аврелия и Аврелон, Вестария и Вестран, Кардания и Карден, Миреллия и Мирелл\u003c/strong> — \u003ca class=\"wiki-link\" href=\"#history-empire\">Рождение империи\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Аделина де Ренн\u003c/strong> — \u003ca class=\"wiki-link\" href=\"#bretnos\">Бретнос\u003c/a>; \u function renderNav(){
 document.querySelectorAll('[data-embedded-image]').forEach(el=>el.src=image(el.dataset.embeddedImage));
 $('#navigation').innerHTML='<a href="#home" class="nav-top-link '+(currentId==='home'?'active':'')+'">'+I('home')+'Обзор мира</a><a href="#world-map" class="nav-top-link '+(currentId==='world-map'?'active':'')+'">'+I('map')+'Карта известных земель</a><p class="nav-section-label">Оглавление</p>'+chapters.map((c,i)=>{const aa=chapterArticles(c);const active=currentId===c.id||aa.some(a=>a.id===currentId);return'<details class="nav-chapter" '+(active?'open':'')+'><summary><span class="nav-number">'+esc(c.number||'А–Я')+'</span><span class="nav-title">'+esc(cleanTitle(c.title))+'</span><span class="chevron" aria-hidden="true">›</span></summary><div class="nav-children"><a href="#'+esc(c.id)+'" class="chapter-view '+(currentId===c.id?'active':'')+'">Обзор раздела</a>'+aa.map(a=>'<a href="#'+esc(a.id)+'" '+(a.id===currentId?'class="active" aria-current="page"':'')+'>'+esc(a.title)+'</a>').join('')+'</div></details>'}).join('');
}
function image(key){return(data.images||{})[key]||''}
function caption(key){return(data.captions||{})[key]||'Иллюстрация мира Миттерии'}
function renderMapOverview(){return '<section class="home-map" aria-labelledby="home-map-heading"><div class="section-heading"><h2 id="home-map-heading">Карта известного мира</h2><a href="#world-map">О карте ↗</a></div><div class="home-map-frame"><button class="home-map-image" type="button" data-image-key="map" aria-label="Открыть масштабируемую карту"><img src="'+esc(image('map'))+'" alt="'+esc(caption('map'))+'" loading="lazy"></button><div class="home-map-footer"><p>'+esc(caption('map'))+'</p><div><button class="map-open-button" type="button" data-image-key="map">'+I('map')+'Рассмотреть карту</button><a href="#world-map">Читать статью '+I('arrow')+'</a></div></div></div></section>'}
const heroIds=['kibat','bjorn','konrad','kevin'];
function renderArticleImages(a){
 const source=document.createElement('template');source.innerHTML=a.html||'';
 const embedded=new Set([...source.content.querySelectorAll('[data-embedded-image]')].map(el=>el.dataset.embeddedImage));
 const keys=[...new Set([a.imageKey,...(Array.isArray(a.images)?a.images:[])].filter(k=>typeof k==='string'&&image(k)&&!embedded.has(k)))];
 if(!keys.length)return '';
 return '<div class="article-gallery'+(keys.length>1?' multiple':'')+'">'+keys.map(key=>'<figure class="article-picture'+(heroIds.includes(a.id)?' portrait-picture':'')+'"><button type="button" data-image-key="'+esc(key)+'" aria-label="Увеличить иллюстрацию"><img src="'+esc(image(key))+'" alt="'+esc(caption(key))+'" loading="lazy"></button><figcaption>'+esc(caption(key))+' · Нажмите, чтобы рассмотреть</figcaption></figure>').join('')+'</div>';
}
function renderPartyCards(){
 const heroes=heroIds.map(id=>byId.get(id)).filter(Boolean);
 if(!heroes.length)return '';
 return '<section class="party-gallery" aria-label="Герои первого отряда">'+heroes.map(a=>{const key=a.imageKey||a.id;const details=(a.facts||[]).filter(f=>/^(раса|класс|народ|занятие)$/i.test(String(f.label).trim())).map(f=>f.value).join(' · ');return '<a class="party-card" href="#'+esc(a.id)+'">'+(image(key)?'<div class="party-portrait"><img src="'+esc(image(key))+'" alt="'+esc(caption(key))+'" loading="lazy"></div>':'')+'<div class="party-card-text"><h2>'+esc(a.title)+'</h2>'+(details?'<p>'+esc(details)+'</p>':'')+'<span>История героя '+I('arrow')+'</span></div></a>'}).join('')+'</section>';
}
function renderHome(){
 const last=byId.get(lastRead);const totalWords=articles.reduce((s,a)=>s+(a.wordCount||0),0);
 const resume=last?'<div class="resume-strip">'+I('bookmark')+'<div><small>Продолжить знакомство</small><a href="#'+esc(last.id)+'">'+esc(last.title)+'</a></div><a href="#'+esc(last.id)+'" aria-label="Продолжить чтение">'+I('arrow')+'</a></div>':'';
 main.innerHTML='<div class="home-heading"><div><div class="eyebrow">Энциклопедия известного мира</div><h1>Миттерия</h1></div><div class="edition-tag"><i></i>Четвёртая редакция</div></div>'+resume+'<section class="hero" aria-labelledby="hero-heading"><img class="hero-img" src="'+esc(image('hero'))+'" alt="'+esc(caption('hero'))+'"><div class="hero-content"><div class="eyebrow">Земли · Народы · Истории</div><h2 id="hero-heading">У каждого путешествия<br>есть своя история</h2><p>Королевства и вольные города, древние народы и незнакомые дороги. Найдите место, с которого начнётся ваше знакомство с миром.</p><div class="hero-links"><a class="primary-button" href="#reading">Начать путешествие '+I('arrow')+'</a><a class="hero-secondary" href="#world-map">Рассмотреть карту</a></div></div><span class="hero-caption">'+esc(caption('hero'))+'</span></section><div class="home-stats"><div><strong>'+chapters.filter(c=>c.number).length+'</strong>разделов</div><div><strong>'+articles.length+'</strong>статей</div><div><strong>IV</strong>редакция</div><div><strong>'+Math.max(1,Math.ceil(totalWords/190))+'</strong>минут чтения</div></div>'+renderMapOverview()+'<div class="home-lower"><section><div class="section-heading"><h2>Страницы энциклопедии</h2><span>Выберите свой путь</span></div><div class="chapter-list">'+chapters.map((c,i)=>'<a class="chapter-row" href="#'+esc(c.id)+'"><span>'+esc(c.number||'А–Я')+'</span><div><b>'+esc(cleanTitle(c.title))+'</b><small>'+chapterSummary(c)+'</small></div>'+I('arrow')+'</a>').join('')+'</div></section><aside class="reading-note">'+I('book')+'<h3>Место для вашей истории</h3><p>Выберите родину, привычное занятие и причину отправиться в путь. Мир раскрывается через людей, которых встречают на дороге.</p><a href="#your-character">Перед первым шагом '+I('arrow')+'</a></aside></div>'+(bookmarks.some(id=>byId.has(id))?'<div class="section-heading"><h2>Ваши закладки</h2><span>Сохранённые страницы</span></div><div class="bookmark-list">'+bookmarks.filter(id=>byId.has(id)).map(id=>'<a class="bookmark-chip" href="#'+esc(id)+'">'+esc(byId.get(id).title)+'</a>').join('')+'</div>':'');
}
function plural(n,one,few,many){const m=n%100;return m>=11&&m<=14?many:n%10===1?one:n%10>=2&&n%10<=4?few:many}
function renderChapter(c){const aa=chapterArticles(c);const own=byId.get(c.id);main.innerHTML='<section class="chapter-header"><div class="eyebrow">Раздел '+esc(c.number||'энциклопедии')+'</div><h1>'+esc(cleanTitle(c.title))+'</h1><p>'+aa.length+' '+plural(aa.length,'статья','статьи','статей')+' — выберите тему для чтения.</p></section>'+(own&&own.html?'<div class="article-body" style="margin-top:26px">'+own.html+'</div>':'')+'<div class="chapter-grid">'+aa.map((a,i)=>'<a class="chapter-entry" href="#'+esc(a.id)+'"><small>'+String(i+1).padStart(2,'0')+' · '+(a.readingMinutes||Math.max(1,Math.ceil((a.wordCount||0)/190)))+' мин чтения</small><h2>'+esc(a.title)+'</h2><p>'+esc(a.excerpt||'')+'</p><span class="entry-arrow">Читать статью →</span></a>').join('')+'</div>';}
function renderArticle(a){
 const ci=chapters.find(c=>c.id===a.chapterId);const seq=ci?chapterArticles(ci):substantive;const idx=seq.findIndex(x=>x.id===a.id);const prev=seq[idx-1],next=seq[idx+1];const related=seq.filter(x=>x.id!==a.id).slice(0,5);const min=a.readingMinutes||Math.max(1,Math.ceil((a.wordCount||0)/190));const facts=a.facts||[];const isSaved=bookmarks.includes(a.id);
 const photo=renderArticleImages(a);const partyCards=a.id==='first-party'?renderPartyCards():'';
 main.innerHTML='<article class="article-page"><header class="article-header"><div class="eyebrow">'+esc(cleanTitle(a.chapterTitle||ci?.title||'Энциклопедия'))+'</div><h1>'+esc(a.title)+'</h1><div class="article-meta"><div class="article-meta-left"><span>'+I('clock')+min+' '+plural(min,'минута','минуты','минут')+' чтения</span><span>Редакция IV</span><span>Для игроков</span></div><div class="article-actions"><button class="article-action" type="button" data-action="bookmark" aria-pressed="'+isSaved+'">'+I('bookmark')+(isSaved?'В закладках':'Сохранить')+'</button><button class="article-action" type="button" data-action="share">'+I('share')+'Ссылка</button><button class="article-action" type="button" data-action="print">'+I('print')+'Печать</button></div></div></header><div class="article-layout"><div><div class="article-body">'+photo+a.html+partyCards+'</div><nav class="article-bottom" aria-label="Соседние статьи">'+(prev?'<a href="#'+esc(prev.id)+'"><small>← Предыдущая статья</small><b>'+esc(prev.title)+'</b></a>':'<span></span>')+(next?'<a href="#'+esc(next.id)+'"><small>Следующая статья →</small><b>'+esc(next.title)+'</b></a>':'<span></span>')+'</nav></div><aside class="article-aside"><section class="fact-panel"><h2>Коротко о статье</h2><dl>'+facts.map(f=>'<div><dt>'+esc(f.label)+'</dt><dd>'+esc(f.value)+'</dd></div>').join('')+'<div><dt>Раздел</dt><dd>'+(ci?'<a href="#'+esc(ci.id)+'">'+esc(cleanTitle(ci.title))+'</a>':esc(a.chapterTitle||'Энциклопедия'))+'</dd></div><div><dt>Чтение</dt><dd>'+min+' '+plural(min,'минута','минуты','минут')+'</dd></div></dl></section><section class="aside-links"><h3>Рядом на страницах</h3>'+related.map(r=>'<a href="#'+esc(r.id)+'">'+I('book')+esc(r.title)+'</a>').join('')+'<a href="#world-map">'+I('map')+'Карта известных земель</a></section></aside></div></article>';
 lastRead=a.id;store.set('last-read',a.id);
}
function crumb(id){if(id==='home'){return'<a href="#home">Энциклопедия</a><span class="breadcrumb-separator">/</span><span class="breadcrumb-current">Обзор мира</span>'}const a=byId.get(id),c=chapterById.get(id)||chapters.find(c=>c.id===a?.chapterId);return'<a href="#home">Энциклопедия</a><span class="breadcrumb-separator">/</span>'+(c&&c.id!==id?'<a href="#'+esc(c.id)+'">'+esc(cleanTitle(c.title))+'</a><span class="breadcrumb-separator">/</span>':'')+'<span class="breadcrumb-current">'+esc(c?.id===id?cleanTitle(c.title):a?.title||'Страница не найдена')+'</span>'}
function setDrawer(open){$('#sidebar').classList.toggle('open',open);$('#drawer-backdrop').hidden=!open;const b=$('[data-action="menu"]');b.setAttribute('aria-expanded',open);b.setAttribute('aria-label',open?'Закрыть оглавление':'Открыть оглавление');if(open)$('#sidebar .brand').focus();}
function route(){let id;try{id=decodeURIComponent(location.hash.slice(1))||'home'}catch{id='home'}if(id==='main'){main.focus();return}currentId=id;const c=chapterById.get(id),a=byId.get(id);if(id==='home')renderHome();else if(a)renderArticle(a);else if(c)renderChapter(c);else main.innerHTML='<div class="empty-state"><div class="eyebrow">Энциклопедия Миттерии</div><h1>Эта страница не найдена</h1><p>Начните с карты или найдите нужную статью через поиск.</p><a class="primary-button" href="#home">На главную '+I('arrow')+'</a></div>';$('#breadcrumbs').innerHTML=crumb(id);document.title=(a?.title||cleanTitle(c?.title)||'Обзор мира')+' — Миттерия';renderNav();setDrawer(false);window.scrollTo({top:0,behavior:'instant'});if(searchDialog.open)searchDialog.close();}
function navigate(id){if(location.hash==='#'+id)route();else location.hash=id}
function mark(text,q){const safe=esc(text);if(!q)return safe;const bits=q.split(/\s+/).filter(Boolean).map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));try{return safe.replace(new RegExp('('+bits.join('|')+')','giu'),'<mark>$1</mark>')}catch{return safe}}
function runSearch(q=''){
 const query=norm(q),bits=query.split(/\s+/).filter(Boolean);let result;
 if(!query)result=substantive.slice(0,8).map(a=>({a,score:0}));else result=articles.map(a=>{const title=norm(a.title),text=norm(a.plain);if(!bits.every(b=>title.includes(b)||text.includes(b)))return null;return{a,score:bits.reduce((s,b)=>s+(title===b?200:title.startsWith(b)?60:title.includes(b)?30:1),0)}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,60);
 $('#search-status').textContent=query?'Найдено: '+result.length+(result.length===60?' и более':''):'С чего начать знакомство';
 searchResults.innerHTML=result.length?result.map(({a},i)=>{let snippet=a.excerpt||a.plain||'';if(query){const text=a.plain||'',pos=norm(text).indexOf(bits[0]);if(pos>=0){const start=Math.max(0,pos-65);snippet=(start?'…':'')+text.slice(start,start+175)+(start+175<text.length?'…':'')}}return'<a href="#'+esc(a.id)+'" class="search-result" data-search-result="'+i+'"><small>'+esc(cleanTitle(a.chapterTitle||'Энциклопедия'))+'</small><strong>'+mark(a.title,query)+'</strong><p>'+mark(snippet,query)+'</p></a>'}).join(''):'<div class="search-empty">Ничего не найдено.<br>Попробуйте другое имя или более короткое слово.</div>';searchSelection=-1;return result.map(x=>x.a.id);
}
function openSearch(){runSearch(searchInput.value);searchDialog.showModal();setTimeout(()=>{searchInput.focus();searchInput.select()},0)}
function pickSearch(delta){const links=[...searchResults.querySelectorAll('[data-search-result]')];if(!links.length)return;searchSelection=(searchSelection+delta+links.length)%links.length;links.forEach((a,i)=>a.classList.toggle('selected',i===searchSelection));links[searchSelection].scrollIntoView({block:'nearest'});}
searchInput.addEventListener('input',()=>runSearch(searchInput.value));searchInput.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();pickSearch(1)}else if(e.key==='ArrowUp'){e.preventDefault();pickSearch(-1)}else if(e.key==='Enter'){const links=[...searchResults.querySelectorAll('[data-search-result]')];if(links.length){e.preventDefault();navigate(links[Math.max(0,searchSelection)].hash.slice(1));searchDialog.close()}}});
searchResults.addEventListener('click',e=>{if(e.target.closest('a'))searchDialog.close()});
let zoom=1,panX=0,panY=0,drag=null;
function applyZoom(){const el=$('#zoom-image');el.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';$('.zoom-reset').textContent=Math.round(zoom*100)+'%'}
function zoomBy(amount){zoom=Math.min(5,Math.max(1,zoom+amount));if(zoom===1){panX=0;panY=0}applyZoom()}
function openImage(key,src,alt){zoom=1;panX=panY=0;$('#zoom-image').src=src||image(key);$('#zoom-image').alt=alt||caption(key);$('#image-title').textContent=key==='map'?'Карта известных земель':alt||caption(key);$('#image-caption').textContent=alt||caption(key);applyZoom();imageDialog.showModal()}
const stage=$('#image-stage');stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?.25:-.25)},{passive:false});stage.addEventListener('pointerdown',e=>{drag={x:e.clientX-panX,y:e.clientY-panY};stage.classList.add('dragging');stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag&&zoom>1){panX=e.clientX-drag.x;panY=e.clientY-drag.y;applyZoom()}});const stopDrag=()=>{drag=null;stage.classList.remove('dragging')};stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);
function toggleBookmark(){if(!byId.has(currentId))return;const saved=bookmarks.includes(currentId);bookmarks=saved?bookmarks.filter(x=>x!==currentId):[...bookmarks,currentId];store.set('bookmarks',bookmarks);const b=$('[data-action="bookmark"]');if(b){b.setAttribute('aria-pressed',!saved);b.innerHTML=I('bookmark')+(saved?'Сохранить':'В закладках')}toast(saved?'Закладка удалена':'Статья сохранена в закладки')}
async function share(){const link=location.href;try{await navigator.clipboard.writeText(link);toast('Ссылка на статью скопирована')}catch{const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();toast(ok?'Ссылка на статью скопирована':'Адрес статьи находится в строке браузера')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){switch(b.dataset.action){case'search':openSearch();break;case'close-search':searchDialog.close();break;case'menu':setDrawer(!$('#sidebar').classList.contains('open'));break;case'theme':theme=theme==='dark'?'light':'dark';store.set('theme',theme);updateTheme();break;case'font':textSize=({small:'normal',normal:'large',large:'small'})[textSize]||'normal';document.documentElement.dataset.textSize=textSize;store.set('text-size',textSize);toast('Размер текста: '+({small:'компактный',normal:'обычный',large:'крупный'})[textSize]);break;case'random':{const a=substantive[Math.floor(Math.random()*substantive.length)];if(a)navigate(a.id);break}case'bookmark':toggleBookmark();break;case'share':share();break;case'print':window.print();break;case'close-image':imageDialog.close();break;case'zoom-in':zoomBy(.5);break;case'zoom-out':zoomBy(-.5);break;case'zoom-reset':zoom=1;panX=panY=0;applyZoom();break;}return}const imgButton=e.target.closest('[data-image-key]');if(imgButton){openImage(imgButton.dataset.imageKey);return}const img=e.target.closest('.article-body img');if(img&&!img.closest('a')){openImage(img.src===image('map')?'map':'',img.src,img.alt);return}});
$('#drawer-backdrop').addEventListener('click',()=>setDrawer(false));[searchDialog,imageDialog].forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!imageDialog.open){if(searchDialog.open)searchDialog.close();else openSearch()}}if(e.key==='Escape'&&$('#sidebar').classList.contains('open'))setDrawer(false)});
window.addEventListener('hashchange',route);updateTheme();route();
window.MitteriaUI={navigate,search:runSearch,openSearch,openImage,getState:()=>({currentId,theme,textSize,bookmarks:[...bookmarks],zoom})};
})();

</script>
</body>
</html>
