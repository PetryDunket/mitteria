  <noscript><div class="nojs-book"><p>Полный текст энциклопедии</p><style>.sidebar,.workspace,.drawer-backdrop{display:none!important}.nojs-book{max-width:820px;margin:40px auto;padding:24px;font:18px/1.8 Georgia,serif}.nojs-book img{max-width:100%}</style><section id="text-mitteria"><h2>Миттерия</h2><p>У городских ворот телега с овечьей шерстью ждёт, пока писарь пересчитает тюки. Рядом наёмник сушит над жаровней промокшие перчатки, паломница проверяет узел на дорожной сумке, а подмастерье несёт в мастерскую чужой меч со сломанной гардой. Каждый прибыл по своему делу. К вечеру один из них может оказаться свидетелем ссоры, поручителем незнакомца или попутчиком человека, которого ещё утром не знал.</p>
<p>Так начинается знакомство с Миттерией. Её державы видны издалека — по крепостям, знамёнам и огромной северной стене. Повседневная жизнь раскрывается ближе: в шве хорошо подогнанного кафтана, в торговом договоре с несколькими печатями, в празднике, ради которого деревня откладывает тяжёлую работу. Здесь помнят войны, спорят о богах, берегут семейные мастерские и отправляются в путь, надеясь вернуться с чем-то большим, чем дорожная пыль.</p>
<p>Эта книга знакомит с известными землями и их обитателями. Для одного героя они станут родиной, для другого — местом службы, для третьего — первой чужой страной. Мир уже менялся от человеческих решений и поступков других народов. Теперь в его историю могут войти новые имена.</p></section><section id="text-navigation"><h2>Как пользоваться книгой</h2><p>Начните с <a class="wiki-link" href="#text-mitteria">карты и прошлого мира</a>, затем выберите интересующую <a class="wiki-link" href="#text-dun-moroz">страну</a>. О происхождении, занятиях и повседневной жизни рассказывает глава <a class="wiki-link" href="#text-origins">о народах и обществах</a>. <a class="wiki-link" href="#text-common-pantheon">Вера</a> и <a class="wiki-link" href="#text-magic-practice">магия</a> помогают понять местные обычаи. В главе <a class="wiki-link" href="#text-journeys">для путника</a> собраны сведения о дороге, работе и подготовке героя, а <a class="wiki-link" href="#text-first-party">память о прежних авантюристах</a> связывает книгу с уже начавшейся историей. Быстро найти нужное имя поможет <a class="wiki-link" href="#text-index">указатель</a>.</p></section><section id="text-world-name"><h2>Имя мира</h2><p>Название Миттерии связывают с <a class="wiki-link entity-link" href="#text-mitra">Митрой</a>, которую её последователи почитают как создательницу богов. Имя знакомо далеко за пределами её церковных владений, хотя почитание Митры разделяют далеко не все. На торговой площади можно услышать несколько версий истории мира, прежде чем будет закрыта одна лавка.</p></section><section id="text-world-map"><h2>Карта известных земель</h2><figure class="article-picture"><button type="button" data-image-key="map" aria-label="Открыть карту во весь экран"><img src="assets/world-map.jpg" alt="Карта известных земель Миттерии"></button><figcaption>Исходная карта мира · нажмите, чтобы увеличить и перемещать</figcaption></figure>
<p>На западе лежат <a class="wiki-link entity-link" href="#text-elfsweyr">Эльфсвейр</a> и <a class="wiki-link entity-link" href="#text-valenwood">Валенвуд</a>. Север занимает <a class="wiki-link entity-link" href="#text-dun-moroz">Дун Мороз</a>, отделённый огромной стеной от соседних земель. В центральной части карты находятся человеческие королевства, имперские владения и церковные территории. Юго-запад принадлежит кланам драконорождённых. Южный полуостров разделён между независимыми республиками; дальше расположены два небольших острова и города пустынной конфедерации. На нижнем краю видна вулканическая суша <a class="wiki-link entity-link" href="#text-zvas">Зваса</a>.</p>
<p>Пунктир обозначает политические границы. Иногда за ним начинается иная власть с другими пошлинами, иногда — область, где государь, изображённый на монете, известен лишь по рассказам. Место может принадлежать державе по праву, но жить под властью местных общин. Поэтому дорожный совет опытного перевозчика бывает полезнее рассуждений человека, который видел страну только на рисунке.</p>
<p>Горы особенно сильно влияют на отношения держав. Они прикрывают республики от крупного вторжения и разделяют земли империи и драконорождённых. Передвижение армии требует перевезти припасы, повозки и осадные орудия. Узкая тропа, удобная для пастуха, может оказаться непреодолимым препятствием для целого похода. Морские пути, в свою очередь, связывают земли, которые по суше разделяет длинный обход.</p></section><section id="text-barbarian-lands"><h2>Восточная граница</h2><p>Мёртвыми землями Варваров восток называют в западных странах. Земли населены; их мрачное имя выросло из отчуждения и страха перед пограничной угрозой. У жителя далёкого города сведения о востоке часто сводятся к военным известиям, привезённым товарам и пересказам чужих путешествий. Надёжность таких рассказов неодинакова.</p>
<p>Пограничное противостояние особенно заметно в судьбе <a class="wiki-link entity-link" href="#text-teutonia">Тевтонии</a>. Её орден держит рубеж, а соседние державы обсуждают поддержку, поставки и собственную безопасность. Для возчика, доставляющего железо в крепость, далёкая политика становится вполне ощутимой: нужно узнать, открыта ли дорога, кто принимает груз и где получить обратное поручение. За пределами этой знакомой пограничной картины начинается гораздо менее известный мир.</p></section><section id="text-darkness-forest"><h2>Великий лес Даркнес</h2><p>Даркнес выглядит на карте частью <a class="wiki-link entity-link" href="#text-swabia">Швабии</a>, но герцогская власть давно не распоряжается им так же уверенно, как обычными землями. Здесь живёт множество лесных существ и монстров, а гоблины строят собственные города. Большую армию через лес не провести. Даже знакомство с окраиной мало говорит о том, что ждёт путешественника глубже среди деревьев.</p>
<p>Лесная дорога требует иного внимания, чем мощёный тракт. Колея исчезает под опавшей листвой, шум воды мешает услышать спутников, а обычный на вид просвет может вести к заброшенному месту вместо нужной переправы. Местный проводник полезен знанием троп и соседей. На границе леса спрашивают о последнем прошедшем обозе и о том, кто действительно бывал в нужном поселении.</p></section><section id="text-zvas"><h2>Континент Звас</h2><p>Звас прежде был благополучной родиной тифлингов. После нисхождения дьявола его земли превратились в камень, лаву и вулканы; жители были вынуждены бежать за море. В принимающих странах их судьбы сложились по-разному: свободные города приветствуют переселенцев, тогда как в Октаниусе и Папстве они сталкиваются с жестокими преследованиями. Утрата родины стала общей бедой, но не общей виной и не общей верой. За словом «беженец» стоят отдельные семьи, профессии и надежды.</p></section><section id="text-history-before-borders"><h2>Земли прежде нынешних границ</h2><p>Миттерия помнит больше границ, чем нанесено на сегодняшнюю карту. Старые названия живут в названиях дорог, в родословных, в песнях, которые соседи заканчивают разными словами. Владение долиной могли подтвердить победа, брачный договор или несколько поколений спокойной жизни. Поэтому рассказ о прошлом часто начинается с вопроса: кто его рассказывает и какое право хочет обосновать?</p>
<p>Раннюю историю обжитых земель удобно называть временем ремесла и дорог. Поселения росли вокруг переправ, плодородных участков и мест, где можно было добывать нужный материал. Рынок соединял тех, кого разделяли язык и обычаи. За торговлей приходили охрана, сборщики пошлин и властители, обещавшие безопасность. Из таких связей складывались будущие владения; не все они стали королевствами. На южном полуострове самостоятельность городов пережила многие соседние династии.</p></section><section id="text-history-northern-wall"><h2>Северная стена</h2><p>На севере нынешнего <a class="wiki-link entity-link" href="#text-dun-moroz">Дун Мороза</a> некогда соседствовали гномы, дворфы и голиафы; последних было особенно много. Долгое внутреннее противостояние завершилось союзом гномов и дворфов и изгнанием голиафов. Затем последовали попытки возвращения. Только после этой череды столкновений возник укреплённый рубеж, который теперь кажется едва ли не частью самого северного пейзажа.</p>
<p>Для объединённого государства стена означает безопасность и способность действовать сообща. Для изгнанников она напоминает о потерянной земле. Камень сохранил итог войны лучше, чем её причины: общая история существует, а единого взгляда на справедливость случившегося нет. Нынешний союз гномов и дворфов вырос из этого прошлого и по-прежнему определяет северную политику.</p></section><section id="text-history-crowns-church"><h2>Время корон и церковных владений</h2><p>Укрепление человеческих держав сопровождалось ростом храмовых общин. Святилища собирали пожертвования, принимали паломников, хранили записи обещаний и становились местами, где незнакомые люди находили посредников. Учение <a class="wiki-link entity-link" href="#text-mitra">Митры</a> связывало множество местных обычаев представлением о едином начале: её последователи утверждали, что она создала богов и передала им дальнейшее творение.</p>
<p>В <a class="wiki-link entity-link" href="#text-holy-region">Божьей области</a> духовная власть стала государственной. Ватитан сделался центром церкви, добивающейся признания Митры за пределами собственных владений. Её возвышение изменило дипломатию, но не объединило мир в одной вере. Эльфийские острова, <a class="wiki-link entity-link" href="#text-dun-moroz">Дун Мороз</a> и земли драконорождённых сохранили свои традиции. Среди человеческих правителей одни искали церковной поддержки, другие довольствовались осторожными формулами признания.</p></section><section id="text-history-empire"><h2>Рождение империи</h2><p>В пределах нынешнего <a class="wiki-link entity-link" href="#text-octanius">Октаниуса</a> прежде существовали четыре королевства: Аврелия со столицей в Аврелоне, Вестария с Вестраном, Кардания с Карденом и Миреллия с Миреллом. Их объединение произошло военным путём. Победы династии Октаниусов превратили несколько соседних престолов в одну имперскую власть; завоевание завершилось раньше, чем исчезли местные привычки и память о прежних коронах.</p>
<p>Старые имена остались полезны и подданным, и правителям. Вестарский купец мог считать себя имперцем и одновременно предпочитать земляков; наместник — опираться на древний городской престиж. Октаниусы продолжают править, расширять влияние и искать новые приобретения. Полная поддержка учения <a class="wiki-link entity-link" href="#text-mitra">Митры</a> связывает их с Ватитаном: церковное признание придаёт завоеваниям вид законного дела.</p>
<p>Пока империя покоряла соседей, <a class="wiki-link entity-link" href="#text-bretnos">Бретнос</a> и <a class="wiki-link entity-link" href="#text-normania">Нормания</a> заключили оборонный союз и подготовились к её дальнейшему продвижению. На других направлениях большую армию задерживают горы и укреплённые города. Так наступила нынешняя пора: сильная империя располагает многими средствами давления, но каждый следующий шаг требует всё более тяжёлого расчёта.</p></section><section id="text-history-closed-crossings"><h2>Осень закрытых переправ</h2><p>Покорение Вестарии запомнилось войной за переправы. Военачальники Октаниусов захватили мосты и речные пристани, взяли под охрану мельницы и стали задерживать обозы, следовавшие к Вестрану. Королевская конница ещё могла выходить в поле, но армия теряла возможность получать припасы и собираться в нужном месте. За мешок муки вскоре платили больше, чем прежде за хорошую овцу.</p>
<p>Вестран пытался удержаться за стенами. Горожане разбирали торговые навесы на топливо, а семьи солдат стояли у казённых амбаров рядом с беженцами из деревень. Когда город сдался, победители сперва выставили караул у складов, затем потребовали присяги у знати и городских старшин. Капитуляция столицы лишила оставшиеся гарнизоны снабжения и опоры; одни сложили оружие, другие были взяты силой.</p>
<p>Октаниусы получили земли, доходы и контроль над путями сообщения. Вестария заплатила разорёнными хозяйствами и годами восстановления. Позднее к мостовым пошлинам добавили сбор на содержание гарнизонов, а большие зерновые склады поставили под надзор имперских чиновников. Эти порядки пережили сам поход. Для двора Осень закрытых переправ стала примером расчётливой победы; для вестарских семей — временем, когда хлеб делили тоньше, а обещания властей слушали осторожнее.</p></section><section id="text-history-two-crowns-oath"><h2>Клятва двух корон</h2><p><a class="wiki-link entity-link" href="#text-bretnos">Бретнос</a> и <a class="wiki-link entity-link" href="#text-normania">Нормания</a> заключили союз, когда походы Октаниусов ещё поглощали соседние владения. На встречу привезли списки повозок, запасов и мостов, способных выдержать тяжёлый обоз. Переговоры запомнились тем, что правители долго спорили о числе лошадей для перевозки зерна. За праздничной клятвой стоял вполне определённый вопрос: сумеет ли один сосед прокормить другого, пока тот держит удар?</p>
<p>Договор обязал королевства заранее накапливать припасы и пропускать военные обозы союзника без обычной волокиты на заставах. На угрожаемых направлениях укрепили крепости, расходы на которые разделили обе короны. В гарнизонах появились офицеры связи, знавшие чужие сигналы и порядок передачи приказов. Старые споры о пошлинах не исчезли, но их перестали решать задержанием союзных подвод.</p>
<p>Клятва изменила положение ремесленников и пограничных городков: понадобились каменщики, кузнецы, возчики, дополнительные амбары. Сельские общины несли повинности и жаловались на стоимость обороны задолго до появления неприятеля. Эти расходы дали результат: вторжение теперь потребовало бы сломить подготовленный союз, способный поддерживать армии припасами. Праздничный образ двух поднятых корон прижился быстро; прочность соглашения обеспечили склады, дороги и привычка исполнять обязательства.</p></section><section id="text-history-borderlands"><h2>Пограничье и нынешние времена</h2><p>На восточном рубеже церковный орден <a class="wiki-link entity-link" href="#text-teutonia">Тевтонии</a> превратил пограничную службу в основу собственной власти. Долгое противостояние усиливает его самостоятельность, однако вассальная зависимость от <a class="wiki-link entity-link" href="#text-holy-region">Божьей области</a> сохраняется. Нынешний правитель верен церковному центру. <a class="wiki-link entity-link" href="#text-galich">Галич</a> участвует в поддержке рубежа как самостоятельная держава, представляя сотрудничество общим делом защиты.</p>
<p>Для жителей приграничья большая политика имеет знакомый облик: обоз со снаряжением, известие о нападении, задержавшийся родственник, новый пост на дороге. Западное название «Мёртвые земли Варваров» выражает страх соседей. Оно не заменяет знания о тех, кто живёт за границей.</p></section><section id="text-dun-moroz"><h2>Объединённое государство Дун Мороз</h2><p>В северных городах дом начинается с двойной двери: между створками оставляют место для снега, мокрого плаща и тяжёлых сапог. За стенами гремят мастерские, над крышами сушатся полосы синей шерсти, а на рыночных весах проверяют даже привычный семейный заказ. Дун Мороз живёт ремеслом, добычей камня и металлов, перевозками и подготовкой к долгой зиме. Хорошая вещь здесь должна выдержать передачу внукам; красивая поломка никого не впечатлит.</p>
<p>Государство объединяет гномов и дворфов. Общий совет распределяет расходы на укрепления и дороги, оставляя городам собственные порядки. Представители горных поселений требуют вкладываться в безопасные выработки, прибрежные купцы — в склады и причалы. Зимние запасы делают предметом публичного отчёта: недостача зерна касается гораздо большего числа людей, чем неудача одного торговца. Тёплая одежда различается по достатку; дороговизну выдают тонкая выделка кожи и аккуратные застёжки, а не неудобный покрой.</p>
<p>У огромной стены иная память. Прежде основную часть населения севера составляли голиафы. После долгого конфликта объединённые гномы и дворфы изгнали их; попытки возвращения предшествовали строительству рубежа. Этот порядок событий известен, но общего согласия о справедливости прошлого нет. Чужака охотно наймут за полезное умение, зато насмешку над семейным трудом запомнят надолго. Митру здесь не признают, сохраняя собственные традиции почитания богов.</p></section><section id="text-elfsweyr"><h2>Эльфсвейр</h2><p>Эльфсвейр встречает прибывших вымощенными набережными, закрытыми садами и длинными галереями, где дождь не мешает прогулке. Портовые дома выставляют над дверью знак мастера; хорошего переплётчика порой знают лучше местного сановника. В одежде любят холодные зелёные и серебристые оттенки, свободные рукава и ткани, которые можно чинить, сохраняя рисунок. На праздниках старые наряды ценят за историю, а повседневная одежда заметно проще придворной.</p>
<p>Наследственную корону ограничивает совет городов и старых домов. Привилегии закреплялись постепенно: двору были нужны корабли, ремесленникам — защита заказов, поселениям — право распоряжаться ближайшими землями. Поэтому здесь умеют подолгу обсуждать решение, которое соседняя монархия приняла бы за один вечер. Сегодня спорят о приёме иностранных учеников и продаже редких изделий. Купцы заинтересованы в обмене, некоторые старые семьи боятся утраты привычного уклада.</p>
<p>С Валенвудом страну связывает общий совет равных делегаций, ведающий обороной и внешними соглашениями. Торговые гости допускаются в прибрежные поселения; для поездки в глубь острова нужен поручитель. Самоуверенность мешает приезжему больше бедного плаща. Полуэльф может столкнуться с неприязнью, хотя отдельные семьи и мастерские относятся к нему иначе. Эльфы и феи живут рядом, не растворяясь в едином обществе; культ <a class="wiki-link entity-link" href="#text-mitra">Митры</a> не принят ни короной, ни основными общинами.</p></section><section id="text-valenwood"><h2>Валенвуд</h2><p>В Валенвуде дорогу нередко прокладывают в обход старой рощи, даже если прямой путь был бы короче. Поселения собираются вокруг полян, пристаней и общих домов, где сушат травы, чинят сети и решают споры. Подвесные переходы соединяют постройки, стоящие на разной высоте. Слово «дом» может обозначать и отдельное жилище, и целую общину, поэтому гостю полезно уточнять, кого именно его попросили навестить.</p>
<p>Власть принадлежит собраниям общин, лесных хранителей и представителей фей. Их общий порядок вырос из договоров о пользовании водой, древесиной и охотничьими угодьями. Здесь нет запрета на любое изменение природы: спорят о том, кто отвечает за последствия. Строителю приходится объяснять, куда уйдёт паводок; владельцу красильни — как сохранить чистым ручей. Одни поселения охотно зарабатывают на редких товарах, другие предпочитают меньше торговли и меньше чужих обязательств.</p>
<p>Одежду красят растительными красителями; многие носят короткие плащи, мягкие пояса и лёгкие корзины через плечо. Общая трапеза служит началом переговоров, но приглашение за стол не означает разрешения свободно ходить по любой роще. Государство самостоятельно, а оборону и внешние договоры согласует с Эльфсвейром. Чужеземцев принимают редко и по поручительству. Гость, который спрашивает прежде, чем рубить или собирать, быстро заслужит больше доверия, чем щедрый путешественник, считающий лес ничейным.</p></section><section id="text-bretnos"><h2>Королевство Бретнос</h2><p>В Бретносе ярмарку слышно раньше, чем видно городские стены: колокольчики упряжи, спор из-за цены, музыканты возле помоста. На площади могут соседствовать рыцарский шатёр и лавка починки обуви. Местная знать дорожит родословными, но городской мастер вправе напомнить даже барону о неоплаченном счёте. Синие и кремовые ткани встречаются часто; на празднике гербовую ленту привязывают к обычному плащу, не меняя всю одежду.</p>
<p>Королева Аделина де Ренн правит через соглашения с баронами и городами. Корона подтверждает торговые права и судебную защиту, взамен получает деньги, ополчение и содержание дорог. Такой порядок сложился вокруг старых пожалований, которыми дорожат даже люди, редко читающие сам документ. Аделина стремится сохранить мир готовностью к войне. При дворе спорят, сколько средств отдавать рыцарским домам, а сколько — укреплениям и запасам.</p>
<p>Пока <a class="wiki-link entity-link" href="#text-octanius">Октаниус</a> покорял своих прежних соседей, Бретнос заключил оборонный союз с Норманией. Подготовка сделала нападение на оба королевства слишком дорогим для лёгкой победы. Путешественник найдёт здесь множество нанимателей, но быстро обнаружит различия местных прав: разрешение одного владетеля не всегда удовлетворяет другого. При знакомстве полезно назвать ремесло и поручителя. За удачную службу можно приобрести покровителя; одно лишь громкое имя не избавляет от необходимости показать дело.</p></section><section id="text-normania"><h2>Королевство Нормания</h2><p>О Нормании судят по её дорогам. Возле моста висит список сборов, у склада отмечен запас зерна, на постоялом дворе есть отдельный стол для королевского гонца. Здесь любят порядок, который можно проверить. Утренний рынок начинается с осмотра мер; вмешательство стражи в спор воспринимается спокойнее, если обе стороны получили одинаковую возможность высказаться. В городах распространены плотные серые плащи с красной тесьмой, в деревнях — практичная некрашеная шерсть.</p>
<p>Король Эдрик Арден укрепляет власть дорогами, постоянной стражей и сетью складов. Прежде многие переправы жили по отдельным договорам с местными хозяевами; корона постепенно сводила их обязанности в понятный порядок. Служилые рыцари и чиновники поддерживают перемены, крупные землевладельцы опасаются потери самостоятельности. Порядок стоит дорого, и спор о новом сборе способен собрать толпу быстрее королевского праздника.</p>
<p>Нормания поддерживает оборонный союз с Бретносом поставками, совместной подготовкой и согласованной службой на опасных направлениях. Королевства остаются самостоятельными. Эдрик требует, чтобы обещание союзнику подтверждалось обозом и подготовленными людьми. Чужаку удобно там, где нужны точный счёт, охрана и доставка: правила обычно можно узнать заранее. Но пропущенная запись задержит груз дольше, чем усталый возчик считает справедливым, а местные шутят, что королевская печать умеет путешествовать только в собственном темпе.</p></section><section id="text-swabia"><h2>Великое герцогство Швабия</h2><p>В Швабии даже небольшая ярмарка собирает людей из разных владений: у каждого свой говор, крой шапки и мнение о честной цене. Пастухи пригоняют скот, бочары выставляют работу, сельские семьи привозят сыр, полотно и сушёные яблоки. За столом постоялого двора обсуждают урожай, свадьбы, судебные тяжбы и рассказы приезжих. Зелёная и бордовая одежда заметна среди состоятельных горожан; ремесленника чаще отличает удобный жилет и крепкий кожаный фартук.</p>
<p>Герцог Людвиг Ротен правит страной старых местных прав. Городской совет, монастырское владение и рыцарская семья могут предъявить разные грамоты на один доход. Герцогский суд нужен именно потому, что силой решить подобный спор легко, а сохранить после этого согласие трудно. Молодые служилые люди требуют ясных правил, давние владетели берегут исключения. Герцог ищет доход для казны, стараясь не превратить каждую проверку в ссору со всеми соседями сразу.</p>
<p>Здесь начался путь прежней группы известных авантюристов; их репутация показывает, как служба открывает двери знати. <a class="wiki-link entity-link" href="#text-darkness-forest">Даркнес</a> на картах принадлежит Швабии, но распоряжаться им как обычным владением герцогство не может. Чужаку лучше иметь отдельные договорённости для разных мест. Хорошая рекомендация помогает найти работу и ночлег, хотя сельский хозяин скорее доверится знакомому возчику, чем красивой грамоте без понятного объяснения.</p></section><section id="text-galich"><h2>Великое вождество Галич</h2><p>В Галиче гостя встречают у печи, а серьёзный разговор нередко откладывают до тех пор, пока он не согреется и не поест. Городские торги пахнут хлебом, дёгтем и сушёной рыбой. По рекам и дорогам везут зерно, древесину, воск и изделия кузнецов. Льняные рубахи украшают вышивкой по вороту и рукавам; верхнюю одежду стягивают ткаными поясами. Узор чаще говорит о местной школе работы или семейном вкусе, чем о принадлежности к одному неизменному племени.</p>
<p>Великий вождь Радован Велеславич опирается на дружину, местных владетелей и собрания общин. Нынешняя сила страны выросла из способности согласовывать перевозки и службу, не разрушая самостоятельность её земель. При дворе ценят людей, умеющих собрать обоз к сроку; на местном собрании громкий дружинник может уступить опытному хозяину, который знает цену неубранного поля. Города требуют денег на пристани, пограничные общины — на защиту, земледельцы — меньше отвлечённых от работы рук.</p>
<p>Галич поддерживает Тевтонию совместно с Божьей областью, публично называя защиту восточного рубежа общим делом. При этом страна достаточно сильна, чтобы говорить с союзниками от собственного имени. Путнику полезны соблюдённое слово и уважение к хозяевам. Гостеприимство не отменяет осторожности: незнакомца расспросят о дороге, спутниках и цели поездки, прежде чем поручиться за него перед соседями.</p></section><section id="text-octanius"><h2>Империя Октаниус</h2><p>Имперская печать одинакова на многих документах, но жизнь покорённых земель не стала одинаковой. В одном городе гордятся старым семейным гербом, в другом — мостом и рынком, построенными уже при империи. На официальных праздниках носят пурпурные перевязи; в повседневной одежде сохраняются разные местные ткани и узоры. Горожанин способен искренне любить свою улицу, ненавидеть наместника и одновременно считать службу в армии достойным занятием.</p>
<p>Империей правит династия Октаниусов; нынешний император Северин Октаниус требует надёжных сборов и новых возможностей для расширения. Единая власть возникла из военного подчинения четырёх королевств — Аврелии, Вестарии, Кардании и Миреллии. Все они лежали внутри нынешних имперских границ. Местная память об этих королевствах продолжает жить рядом с имперскими порядками.</p>
<p>Наместники, гарнизоны и налоговые ведомства удерживают общую власть. Служба даёт шанс возвыситься, но внутренние распри и сопротивление соседей мешают лёгким победам. Октаниус полностью поддерживает культ <a class="wiki-link entity-link" href="#text-mitra">Митры</a>, получая церковное признание завоевательных притязаний. Для тифлинга эта страна опасна: возможны жестокие преследования, насилие и потеря средств к жизни. Благополучие на парадной площади ничего не гарантирует беженцу. Остальным чужакам полезны бумаги и покровитель, хотя даже они не защищают от произвола каждого чиновника.</p></section><section id="text-holy-region"><h2>Божья область</h2><p>Утро в Ватитане начинается с колоколов и движения паломников. Перед храмами продают свечи, хлеб, значки и дешёвые плащи; между процессиями протискиваются носильщики и писцы, предлагающие составить прошение. Ватитан — столица Божьей области, которую также называют Папством. Торжественные белые и золотистые облачения резко выделяются среди дорожной пыли и рабочей одежды людей, обеспечивающих жизнь святынь.</p>
<p>Понтифик Климент IV соединяет духовное первенство с государственной властью. Церковные должности ведут к управлению судами, землями и доходами. Паломничество со временем превратило храмовый центр в страну, где гостевые дома и книжные мастерские столь же необходимы, как канцелярии. Внутри церкви спорят о расходах: одни требуют расширять помощь нуждающимся, другие — представительство за рубежом и великолепие церемоний. Простой прихожанин может знать о деятельности соседнего приюта больше, чем о дворцовых переговорах.</p>
<p>Учение <a class="wiki-link entity-link" href="#text-mitra">Митры</a> утверждает её первенство над богами; церковь стремится добиться признания этого учения другими державами. <a class="wiki-link entity-link" href="#text-octanius">Октаниус</a> поддерживает его полностью. <a class="wiki-link entity-link" href="#text-teutonia">Тевтония</a> остаётся церковным вассалом, а <a class="wiki-link entity-link" href="#text-galich">Галич</a> участвует в поддержке рубежа. Публичное благочестие помогает приезжему, но чужой облик способен сделать жизнь опасной. Тифлинги подвергаются жестоким преследованиям. Рядом с проповедью милосердия существуют доносы, насилие и страх; сочувствие отдельного служителя не отменяет власти учреждения и опасности толпы.</p></section><section id="text-teutonia"><h2>Королевство орден Тевтония</h2><p>В Тевтонии улицу часто будит скрип обозов. Ворота открывают для возчиков, кузницы принимают сломанные ободы, в прачечных развешивают плащи гарнизона. Пограничная служба требует несравнимо больше людей, чем видно на стене: нужны мельники, лекари, конюхи, переписчики и семьи, продолжающие обрабатывать землю. Светлые орденские накидки носят поверх дорожной и военной одежды; для мирных жителей они означают одновременно защиту и очередную проверку запасов.</p>
<p>Землями управляет священный орден церкви. Великий магистр Освальд Верен распоряжается крепостями и службой, сохраняя верность главе Папства. Тевтония остаётся вассалом <a class="wiki-link entity-link" href="#text-holy-region">Божьей области</a>; её возросшая самостоятельность в повседневных делах ещё не стала отделением. Постоянная необходимость быстро решать местные задачи усилила орденских распорядителей. Но приграничные хозяйства жалуются на реквизиции, командиры — на задержки подвоза, а казначеи требуют беречь то, что военным кажется расходным материалом.</p>
<p>Защита от нападений с востока связывает орден с поддержкой <a class="wiki-link entity-link" href="#text-galich">Галича</a> и Папства. Чужака с нужным ремеслом здесь заметят быстро, однако во время тревоги его будут расспрашивать строже. Военная полезность помогает заслужить уважение, но не избавляет от церковной нетерпимости: тифлинг встречает враждебную среду и вытеснение на обочину. Полезно заранее знать, кто отвечает за обещанный наём, где заканчиваются права местной управы и куда обращаться с жалобой на недополученную плату.</p></section><section id="text-halfling-kingdom"><h2>Королевство Халфлинг</h2><p>Халфлинг — собственное национальное государство полуросликов, редкое политическое образование для этого народа. На карте оно занимает самостоятельное место среди соседних человеческих держав. Жители не особенно расположены к иным расам; представители других народов здесь не живут. Для полуросликов за пределами королевства само его существование остаётся заметной частью общей истории, хотя отношение отдельного человека к далёкой родине может различаться. Рассказы приезжих о местных порядках не дают надёжного основания судить обо всём государстве.</p></section><section id="text-alben"><h2>Республика Альбен</h2><p>В Альбене узнают время по работе мастерских: сначала молоты, затем пилы, к полудню — колёса телег, увозящих готовые заказы. Уличные водостоки закрывают каменные плиты с клеймом исполнителя. На празднике мастер несёт небольшую лучшую работу, а не обязательно самое дорогое изделие. Практичные охристые куртки, кожаные фартуки и короткие плащи удобны в городе, где одежду постоянно цепляют верстаки, строительные леса и края повозок.</p>
<p>Республика выросла из союзов мастерских и городских кварталов. Обе стороны выбирают представителей в совет: мастера требуют учитывать вложенный труд, жители — безопасность и доступную воду. Уважение к ремеслу не делает город единодушным. Крупные заказчики хотят дешёвых поставок, мелкие мастерские защищают самостоятельность, подмастерья добиваются права открывать собственное дело. Совет регулярно спорит о продаже оружия полисам, которые могут завтра выступить друг против друга.</p>
<p>Альбен независим, как другие республики полуострова, и готов защищать свои стены. Тифлингов и иных переселенцев принимают по личным качествам; происхождение не запрещает учиться ремеслу и получать городские права. Чужаку проще начать с проверяемой работы: здесь быстро узнают и хорошего работника, и человека, обещающего больше, чем умеет. Соседи уважают изделия Альбена, хотя ворчат, что местный мастер способен превратить разговор о цене в длинную лекцию о правильной кладке.</p></section><section id="text-vezer"><h2>Республика Везер</h2><p>Везер звучит голосами посредников. В крытых дворах договариваются о перевозках, меняют деньги и ищут поручителей; за соседним столом ту же сделку уже обсуждают на другом языке. Хорошая одежда здесь не обязательно яркая: чистый воротник, качественный пояс и удобный дорожный сундук говорят о человеке больше драгоценной застёжки. На праздниках украшают фасады полосатыми полотнищами, а владельцы лавок выставляют угощение для постоянных работников и партнёров.</p>
<p>Полис богател как место, где чужие люди могли договориться и обратиться в суд. Выборные судьи разбирают торговые споры, городской совет отвечает за общие расходы. Сильные семьи влияют через кредит и поручительства, поэтому формальное равенство приходится постоянно защищать от власти долгов. Небогатые граждане добиваются доступного суда; состоятельные посредники напоминают, что без доверия к обязательствам город потеряет главный доход.</p>
<p>Везер поддерживает связи с республиками и монархиями, предпочитая зарабатывать на переговорах. При этом собственная независимость для него важнее удобства отдельного покупателя. Переселенцам, включая тифлингов, открыты перевозки, торговля и городская служба. Чужаку пригодятся языки и свидетели, умеющие подтвердить условия найма. Самый частый местный совет — не соглашаться на слово, значение которого вы поняли только приблизительно: обещание запомнят точнее, чем вашу последующую попытку объяснить недоразумение.</p></section><section id="text-rimuris"><h2>Республика Римурис</h2><p>В Римурисе спорят даже на лестницах. Возле сада двое обсуждают расходы на канал, на рынке учитель объясняет ученикам, почему хорошая речь должна быть понятной, а на площади уже собираются слушать отчёт должностного лица. Вокруг города трудятся земледельческие общины, поставляющие фрукты, масло, зерно и вино. Светлые ткани удобны в жару; перед собранием многие надевают поверх рабочей одежды широкую накидку, которую затем используют для вечерней прохлады.</p>
<p>Республика складывалась через соглашения города с окрестными общинами. Их представители утверждают расходы и выбирают должностных лиц на короткий срок. Ораторов уважают, но избиратель вправе потребовать, чтобы красивую речь подтвердили выполненным ремонтом. Горожане поддерживают обучение и приём переселенцев; сельские хозяева напоминают, что свободный спор не должен каждый раз откладывать восстановление дороги до следующего урожая. Привычка обсуждать затрудняет срочное решение, зато делает непопулярный приказ трудным делом.</p>
<p>Римурис дорожит независимостью и настороженно относится к попыткам любого крупного соседа говорить от имени всего полуострова. Тифлинги участвуют в городской жизни наряду с остальными жителями. Новичка охотно выслушают, особенно если он умеет учить или лечить, но одно выступление не заменяет репутации. Местные любят спрашивать мнение гостя, а затем долго объяснять, с какими частями его ответа они согласны.</p></section><section id="text-waterstone"><h2>Республика Вотерстоун</h2><p>Вотерстоун пахнет смолой, мокрым деревом и горячим хлебом у причалов. Утром жители следят за движением судов, вечером узнают новости в мастерских, где чинят паруса и снасти. Длинные водостойкие плащи здесь важнее красивой шляпы; в шторм яркая повязка помогает увидеть человека на мокром помосте. На семейных праздниках оставляют место для тех, чей рейс задержался, но приготовленную для них еду обычно съедают прежде возвращения.</p>
<p>Республику образовали гавани и примыкающие кварталы, которым пришлось сообща содержать причалы, склады и береговую защиту. Их представители выбирают общий совет и сменяемого распорядителя стражи. Старые судовладельцы хотят небольших сборов, работники — надёжных настилов и справедливой оплаты, моряки — маяков и спасательных служб. Споры бывают шумными, однако затонувшее у входа судно быстро напоминает всем, сколько стоит плохо выполненная общая работа.</p>
<p>Город торгует с соседями и нуждается в бесперебойном подвозе продовольствия. Независимость поддерживают договоры и готовность защищать гавани. Приезжих принимают охотно, тифлинг может найти работу и дом без необходимости скрывать происхождение. Чужаку стоит выяснить, кто отвечает за груз после выгрузки: береговой обычай, городской закон и привычки команды могут расходиться. При всём гостеприимстве местные резко осуждают человека, отказавшегося помочь на причале, когда на его глазах случилась беда.</p></section><section id="text-coliseum"><h2>Город Колизей</h2><p>Задолго до главных боёв Колизей заполняют гости. Мелкие торговцы нанимают помощников, семейные дома сдают комнаты, у харчевен вывешивают дополнительные навесы. Крупнейший и наиболее значимый полис полуострова умеет превращать зрелище в городской труд. На огромной арене встречаются бойцы со всех земель, а зрители спорят о манере владеть оружием с той же страстью, с какой спорят о решениях совета. Перед состязанием город украшают красными полотнищами; повседневная одежда проста и удобна для движения.</p>
<p>Военная подготовка составляет часть гражданской жизни. Совместные упражнения и помощь соседям в трудной работе воспитывают привычку полагаться на товарища. Командиров выбирают, но решения о городских средствах принимает гражданский совет. Влиятельные наставники требуют вкладываться в укрепления, устроители зрелищ напоминают о доходах приезжего сезона. Слава победителя помогает добиться внимания, однако сама по себе не даёт права распоряжаться казной.</p>
<p>Колизей уважает физическое мастерство, выдержку и исполненное обязательство. Бои включают спортивные состязания, добровольные поединки и показательные сражения. Происхождение не закрывает путь к уважению: тифлинги живут и работают здесь наряду с другими горожанами. Чужак быстро найдёт компанию, если готов выслушать рассказ о местных чемпионах. Ему полезно помнить, что громкая ссора на рынке ещё не приглашение превратить её в бой.</p></section><section id="text-two-islands"><h2>Государство Двух Островов</h2><p>В Порту Сити за открытыми ставнями идут занятия, а писцы сушат листы со свежими чернилами; в Порту Итчи слышны удары по корабельному дереву и перекличка на пристанях. Оба города связаны общими рынками, браками и морем. Длинную верхнюю одежду запахивают и закрепляют широким поясом; на работе рукава подбирают. Праздничные ткани различаются по узору и достатку, а привычка чинить семейные вещи позволяет отличить возраст наряда от бедности владельца.</p>
<p>Острова пришли к единому государству через необходимость согласовывать морскую защиту и торговые правила. Общий избираемый правитель отвечает за флот и внешние соглашения, местные собрания — за землю, сборы и повседневные суды. В Порту Сити влиятельны школы чиновников, в Порту Итчи — объединения поселений и домов мореплавателей. Эти различия вызывают споры о порядке назначений, но не делят жителей на два неизменных характера. Купцы обоих островов хотят понятного обращения с гостями.</p>
<p>Страна открыта приезжим. Их мало из-за внешних рассказов о людях, будто бы живущих рядом с духами и демонами. Местные сказители тоже рассказывают такие истории, однако слух не доказывает соседства с чудовищем. Путнику доступны обычные постоялые дворы и проводники. Учтиво расспросив о порядке посещения дома или святилища, он чаще найдёт терпеливое объяснение, чем ожидаемую по чужим рассказам угрозу.</p></section><section id="text-xerian-confederation"><h2>Песчаная Конфедерация Ксерийских Стран</h2><p>Из пустыни город сначала кажется полосой зелени и света. За внешними стенами лежат сады, водосборники и тесные улицы с теневыми навесами; на караванной площади путешественник слышит сразу несколько способов назвать один товар. Конфедерация — родина табакси, живущих рядом с многочисленными людьми. Светлую свободную одежду дополняют покрывала от солнца и песка; дорогие красители чаще оставляют для отделки, праздничных поясов и домашнего убранства.</p>
<p>Султаны правят собственными большими городами, преимущественно выросшими у оазисов или других плодородных земель. Союз удерживают договоры о караванах, пошлинах и доступе к воде. Среди влиятельных правителей — Нафир ас-Сахл, добивающийся единых мер для торговли, и Самира аль-Райя, защищающая самостоятельность городских сборов. Их спор касается устройства союза; обычный возчик прежде всего хочет заранее знать, что потребуют на следующей заставе. Внутри городов владельцы садов, ремесленники и караванные хозяева также не всегда согласны друг с другом.</p>
<p>Богов общего пантеона здесь почитают под местными именами. Гость может узнать знакомый обряд, прежде чем поймёт обращение жреца. Вежливо предложить воду путнику — уважаемый обычай, но право на общий колодец регулируется строго. За пределами обжитых земель встречаются трикрины, неразумные пустынные монстры. Поэтому караван ищет проводника по опыту и рекомендациям, а не по уверенности, с которой тот обещает лёгкую дорогу.</p></section><section id="text-dragonborn-clans"><h2>Кланы драконорождённых</h2><p>Земли юго-запада населены драконорождёнными, чья общественная жизнь связана с семьями и кланами. Среди множества имён особенно влиятельны Керрилон, Хребетон, Ящеровод и Броневаз. Их затяжное соперничество не привело к бесспорному победителю. Четыре ведущих клана не исчерпывают всех жителей и семей этих земель. Драконорождённые сохраняют собственные культы и Митру не признают. Для приезжего общее название клана ещё не объясняет положение отдельного собеседника и не заменяет знакомства с ним.</p></section><section id="text-origins"><h2>Происхождение и родина</h2><p>Один и тот же народ живёт по-разному в разных землях. Люди — самая распространённая раса Миттерии, но подданный <a class="wiki-link entity-link" href="#text-octanius">Октаниуса</a>, гражданин Римуриса и житель Государства Двух Островов привычны к разным порядкам. Общее происхождение помогает узнать некоторые черты друг друга; оно не заменяет языка, воспитания, ремесла и личной истории.</p>
<p>Родина оставляет след в мелочах. Путник складывает плащ так, как учили в семье, привычно проверяет товар на вес или ищет в чужом храме знакомый знак. Эти навыки можно перенять. Приёмный ребёнок, переселенец и ученик чужеземного мастера нередко знают обычаи нового дома лучше, чем далёких предков.</p></section><section id="text-humans"><h2>Люди и соседи</h2><p>Человеческие общества занимают королевства, республики, имперские земли, острова и пустынные города. Среди людей встречаются другие народы — постоянные жители, приезжие работники, торговцы, семьи беженцев. В большом городе соседи могут здороваться годами, исповедуя разные верования и называя разные места домом.</p>
<p>В смешанном квартале пекарь запоминает, кто приходит за хлебом до рассвета, а кто заканчивает работу ночью. Соседи одалживают друг другу лестницу, спорят из-за дыма и растят детей возле одной водокачки. Такое знакомство помогает замечать людей за привычными названиями народов, хотя за воротами квартала старые предрассудки могут встретить их снова.</p></section><section id="text-northern-peoples"><h2>Северные народы</h2><p>Гномов, дворфов и голиафов объединяет давняя северная история. Союз первых двух народов определяет нынешний <a class="wiki-link entity-link" href="#text-dun-moroz">Дун Мороз</a>; судьба голиафов связана с изгнанием и попытками возвращения. Эти события остаются частью семейной памяти и не сводятся к одной одинаковой для всех истории.</p>
<p>Само происхождение не говорит, как отдельный северянин относится к старому конфликту. Он может служить пограничью, работать далеко от родины или знать о ней лишь из рассказов родителей. Для героя важны собственные связи: кому он пишет домой, чью вещь бережёт в дороге и почему предпочёл отправиться за пределы знакомых земель.</p></section><section id="text-elves-and-fairies"><h2>Эльфы полуэльфы и феи</h2><p>Эльфийские острова сохраняют особую привлекательность для эльфов и фей. Феи встречаются и в других местах, но предпочитают островные земли с их близостью к природному равновесию. Их соседство не делает все общины одинаковыми: порт, лесное поселение и двор старого дома имеют собственные привычки.</p>
<p>Полуэльфы обычно встречают у эльфов неприязнь, а среди людей — большую терпимость. Такое положение заставляет по-разному искать место в обществе. Один держится семьи, другой — товарищей по ремеслу, третий уезжает туда, где его оценивают по работе. Предрассудки заметно влияют на жизнь, но не предрешают каждую личную встречу.</p></section><section id="text-other-peoples"><h2>Народы разных земель</h2><p>Драконорождённые связаны с кланами юго-запада. За четырьмя влиятельными именами стоят многочисленные семьи, и принадлежность к народу не исчерпывается знанием главных кланов. Полурослики имеют собственное королевство <a class="wiki-link entity-link" href="#text-halfling-kingdom">Халфлинг</a>; его обособленность придаёт родине особое значение для тех, кто оказался за её пределами.</p>
<p>Табакси происходят из земель песчаной конфедерации и живут рядом с людьми в её городах. Гоблины встречаются в разных частях мира, в том числе в лесных поселениях <a class="wiki-link entity-link" href="#text-darkness-forest">Даркнеса</a>. Человек, привыкший видеть только враждебные отряды, может плохо представлять себе жизнь чужого города. Личное знакомство нередко оказывается сложнее привычного рассказа о целом народе.</p></section><section id="text-tieflings"><h2>Тифлинги и новая жизнь</h2><p>Многие тифлинги покинули <a class="wiki-link entity-link" href="#text-zvas">Звас</a> и строят жизнь среди чужих обществ. Для семьи беженцев первые годы могут проходить между поиском жилья, заработка и людей, которым можно доверять. Вещь, привезённая с родины, становится особенно ценной, когда вернуть прежний дом невозможно: кусок ткани, домашний сосуд, записанное имя родственника.</p>
<p>В Октаниусе и Папстве тифлингам грозят жестокие преследования. В других странах сохраняются предрассудки, хотя условия различаются. Свободные города принимают их значительно охотнее и ставят личные качества выше происхождения. Поэтому путь переселенца определяется не только ближайшим безопасным берегом, но и надеждой найти место, где детям не придётся прятать свой облик.</p></section><section id="text-work-and-status"><h2>Работа и общественное положение</h2><p>Большинство жителей выращивает пищу, держит скот, работает в мастерских, перевозит грузы и обслуживает торговлю. Утро городского квартала начинается с воды, топлива и открытия ставен. Пока чиновник готовит печати, пекарский ученик уже вымел золу, а носильщик успел дважды сходить от пристани к складу. Благополучие двора и крепости зависит от такой незаметной работы.</p>
<p>Происхождение даёт одним землю и связи, другим — мастерскую или право на место в лавке. В королевствах важны отношения со знатью, в полисах — гражданство и участие в городских делах. Богатый мастер может распоряжаться большими средствами, чем обедневший дворянин, но уступать ему почётное место на приёме. Поэтому достаток, власть и уважение не всегда принадлежат одному человеку.</p>
<p>Положение семьи можно изменить учёбой, удачным делом, службой или браком, однако каждый путь требует средств и поддержки. Подмастерье нужны инструменты, писцу — обучение, человеку с товаром — поручитель и безопасная дорога. Авантюристы заметны именно потому, что выходят за пределы привычной последовательности: их удача может принести доход или известность гораздо быстрее, чем обычная работа, а неудача — лишить всего сразу.</p></section><section id="text-clothes-and-objects"><h2>Одежда и вещи</h2><p>Обычный дорожный наряд начинается с нижней рубахи, прочной верхней одежды и обуви, которую можно починить в пути. Шерсть сохраняет тепло, полотняная ткань легче переносит жару, плотный плащ служит защитой от дождя и дополнительным покрывалом на ночлеге. Люди, привыкшие к дороге, особенно следят за швами, ремнями и сухими портянками; богатство отделки помогает меньше, чем хорошая посадка.</p>
<p>Положение выдают вещи, которые не требуются для самого труда: окрашенная тонкая ткань, чистый мех, сложная застёжка. На ярмарках показывают и редкие диковины — например, плащ с зачарованными листьями вышивки, которые медленно меняют цвет от весеннего зелёного до осенней меди. Покупатель осторожно трогает подкладку: чудо хочется проверить, а хорошую ткань всё равно придётся беречь от дорожной грязи.</p>
<p>Кошель носят ближе к телу, нож — там, где его удобно достать за едой и работой. В дорожной сумке лежат игла, нитки, чашка, гребень, кусок мыла и небольшой запас сухой пищи. Такие предметы редко попадают в торжественные рассказы, но их потеря способна сделать путешествие мучительным задолго до встречи с опасным противником.</p></section><section id="text-food-and-hospitality"><h2>За общим столом</h2><p>Пища зависит от сезона и достатка. На простом столе чаще оказываются хлеб, каша, овощи, сыр и то, что удалось сохранить сушкой или засолкой. Рыба и мясо доступны по-разному; праздничная трапеза отличается от будничной прежде всего щедростью. Хороший хозяин заранее знает, хватит ли дров, посуды и места для тех, кого пригласили.</p>
<p>В постоялом дворе пахнет дымом, мокрой шерстью и горячей похлёбкой. У огня сохнут перчатки, под лавкой хрустит солома, а хозяин пробует котёл длинной деревянной ложкой. За перегородкой возчики проверяют сбрую. Цена ночлега может включать только место под крышей; корм для животного и горячую еду заказывают отдельно. Первые новости слушают здесь же, не успев стряхнуть снег или пыль с плаща.</p></section><section id="text-fairs-and-customs"><h2>Ярмарки и семейная память</h2><p>Сбор урожая, открытие удобного торгового сезона и большие городские торги дают повод встретиться людям, живущим далеко друг от друга. На ярмарке заключают сделки, ищут учеников, договариваются о работе и покупают вещи, за которыми не поедешь в город среди тяжёлой страды. Рядом с торговыми рядами выступают музыканты и рассказчики, а дети рассматривают приезжих не менее внимательно, чем товары.</p>
<p>На городскую ярмарку иногда приезжает мастер маленьких чар. Его деревянная птица подпрыгивает над ладонью, оставляет в воздухе россыпь золотистых искр и снова становится неподвижной игрушкой. Дети требуют повторить, взрослые задерживаются рядом будто бы ради торговых дел. Потом представление заканчивается, и площадь возвращается к своим колёсам, весам и крикам: редкое чудо запоминают именно среди обычного дня.</p></section><section id="text-common-pantheon"><h2>Боги рядом с повседневностью</h2><p>В Миттерии существуют добрые и злые боги, а религиозная жизнь не сводится к одному храму. Семья может особенно чтить своего покровителя, обращаться к другому божеству перед поездкой и соблюдать обычаи земли, где живёт. Преданность богу и принадлежность к организации тоже различаются: купец, оставивший дар у алтаря, от этого не становится храмовым служителем.</p>
<p>Имя Тира вспоминают при обещаниях и разбирательствах о справедливости. К Мистре обращаются те, чья жизнь связана с магией; Сильвануса чтут перед входом в дикую природу; Вокин — при торговых делах. Бэйн связан с тиранией, Шар — с тьмой и утратой. Этими именами пантеон не исчерпывается. Отношение к опасным культам зависит от общины и власти, но само существование божества не делает всякое служение ему почётным.</p></section><section id="text-mitra"><h2>Митра и право говорить от имени небес</h2><p>Церковь Митры учит, что обычные боги получили от неё само существование и полномочия творить. Из этого учения выводят её первенство и особое положение духовного главы в Ватитане. Имя мира также связано с Митрой. Для верующего такая связь естественна; для приверженца иной традиции название не доказывает церковного рассказа о начале времён.</p>
<p>Большинство человеческих государств признаёт её почитание формально, не ставя Митру выше всех остальных богов. <a class="wiki-link entity-link" href="#text-octanius">Октаниус</a> поддерживает учение Папства полностью. Эльфы, гномы, дворфы и драконорождённые Митру не признают. Спор поэтому касается не только богословия: от него зависят церковные притязания, авторитет правителя и положение чужака. В <a class="wiki-link entity-link" href="#text-holy-region">Божьей области</a> публичное благочестие вплетено в государственную жизнь особенно тесно.</p></section><section id="text-faith-household-rites"><h2>Домашние обряды и прощание</h2><p>Домашняя вера начинается с повторяющихся жестов. У двери оставляют небольшой знак семейного покровителя; перед дальней дорогой старший подаёт путнику хлеб и произносит имя того, кого просят о защите. В смешанной семье рядом могут храниться разные святыни. Обычай позволяет разделить трапезу, даже когда её участники обращаются к разным богам.</p>
<p>При важных договорах свидетелей приглашают раньше, чем приносят дар в святилище: людям предстоит помнить обещание и после окончания обряда. На похоронах называют дела умершего, возвращают семье одолженные вещи и выясняют, кому теперь нужна помощь. Слова различаются по землям, но забота о живых составляет заметную часть прощания. Само совершение обряда не гарантирует чудесного ответа.</p></section><section id="text-faith-open-hearths"><h2>Дни открытых очагов</h2><p>В Бретносе и <a class="wiki-link entity-link" href="#text-normania">Нормании</a> распространён весенний День открытых очагов. Соседи приносят по небольшому блюду к общему столу, чинят мостки и навещают тех, кто тяжело перенёс зиму. Храмовые служители благословляют начало работ; выбор молитв зависит от местной общины. Праздник удобен и для примирения: приглашение за стол позволяет первым заговорить, не начиная разговора с признания собственной неправоты.</p>
<p>У ремесленников <a class="wiki-link entity-link" href="#text-dun-moroz">Дун Мороза</a> схожую роль играет Первый огонь — открытие нового рабочего цикла мастерской. Старые инструменты чистят, ученикам поручают простую общую работу, а удавшуюся первую вещь показывают соседям. Гномьи и дворфские семьи сохраняют разные обращения к своим покровителям. Общая работа здесь соединяет то, что молитва не обязана делать одинаковым.</p></section><section id="text-faith-market-memory"><h2>Праздники площади и вечер памяти</h2><p>В республиканских городах праздник часто начинается на площади. В День честной меры торговцы выставляют гири для общей сверки, а хозяева лавок угощают постоянных покупателей. Вокин почитают рядом с другими местными покровителями; храмовый дар сопровождается вполне земным желанием сохранить доверие к рынку. Споры случаются и в этот день, отчего честно решённое разбирательство становится частью праздника.</p>
<p>В общинах переселенцев со <a class="wiki-link entity-link" href="#text-zvas">Зваса</a> существует Вечер памяти. За столом называют родные места и готовят то, что семья ещё помнит по прежнему дому. Одни молятся, другие просто слушают старших. Участие не требует единого культа: сохраняют память о жизни, которая предшествовала бегству. Там, где соседство безопасно, к столу приглашают и людей иной родины.</p></section><section id="text-faith-local-names"><h2>Разные имена и знакомые обязательства</h2><p>В песчаной конфедерации богов называют иначе, чем на западе, но за местными именами стоят те же божества общего пантеона. Путнику полезнее выяснить смысл обряда, чем спорить о произношении. Дар за гостеприимство, забота о святилище и уважение к чужому трауру понятны далеко за пределами собственной страны.</p></section><section id="text-magic-practice"><h2>Магическая помощь</h2><p>Магия знакома обитателям Миттерии, однако встреча с ней зависит от места и достатка. В большом городе можно разыскать наставника, храмового служителя или практика с хорошими рекомендациями. В деревне тот же человек становится заметной фигурой: о его приезде узнают раньше, чем распрягут лошадей. Соседство с магом меняет возможности общины, но не делает каждого её жителя сведущим в заклинаниях.</p>
<p>За сверхъестественной помощью обращаются при болезни, опасной находке, тревожном явлении или работе, требующей особого мастерства. Часть просьб решают обычным умением: грамотный собеседник, знание трав или верное толкование старого текста тоже ценятся. Хороший практик уточняет задачу прежде, чем обещать результат. Звание само по себе мало говорит о том, какие именно чудеса доступны его носителю.</p></section><section id="text-magic-cost"><h2>Цена умения</h2><p>Цена магической помощи складывается из времени, подготовки, необходимых материалов и ответственности исполнителя. В одном случае достаточно соседской услуги, в другом нужен редкий специалист и долгий поиск. Храм может помочь из милосердия, мастер — ради прежнего обещания, правитель — принять расходы на себя. Такие решения зависят от отношений и обстоятельств, а не отменяют затрат.</p>
<p>Поэтому магия влияет на хозяйство через конкретных людей. Купец дорожит знакомством с надёжным специалистом, община старается удержать умеющего лечить соседа, богатый дом оплачивает обучение способного ребёнка. При этом караваны продолжают возить зерно, ремесленники чинят крыши, а города содержат колодцы. Наличие выдающегося умения ещё не обеспечивает его постоянную доступность всем нуждающимся.</p></section><section id="text-magic-apprenticeship"><h2>Учитель и ученик</h2><p>Три великих училища не исчерпывают путей к магии. Знания передают частные наставники и семьи; часть обучения связана с храмовой службой. Учитель выбирает ученика по способностям, терпению и доверию. Начало может выглядеть скромно: переписать заметки, привести в порядок инструменты, выучить названия веществ, различить полезный образец и опасную находку.</p>
<p>Ученичество создаёт обязательства с обеих сторон. Наставник отвечает за то, чему учит, ученик — за порученные вещи и обещания. Одни остаются при учителе надолго, другие уходят искать книги и коллег. Покровитель способен оплатить дорогу и содержание, но покупка красивого тома сама по себе не заменяет понимания. Репутация сопровождает практика так же настойчиво, как ремесленника или врача.</p></section><section id="text-magic-schools"><h2>Три великих училища магов</h2><p>К югу от имперских земель на карте отмечены Три великих училища магов — независимое, аполитичное место, связанное с волшебниками и другими магическими существами. Его известность простирается значительно дальше достоверных сведений о внутренней жизни. Попасть туда сложно; знакомство с названием не означает знакомства с порядками.</p>
<p>Для внешнего мира училища прежде всего показывают, что занятия магией способны существовать вне обычного подчинения короне или церковной власти. Их нельзя считать ведомством <a class="wiki-link entity-link" href="#text-octanius">Октаниуса</a> только из-за соседства на карте. Путник может увидеть в них надежду на обучение, учёный — возможность поиска, семья — далёкую цель для способного ребёнка. Подробности того, что ждёт за порогом, не принадлежат общему знанию Миттерии.</p></section><section id="text-journeys"><h2>Дорога и время</h2><p>Небольшая группа по удобным дорогам обычно проходит регион за одну или две недели; между далёкими областями путь может занять один или два месяца. Срок меняется из-за гор, ненастья, ожидания переправы и необходимости обходить опасный участок. Морской рейс зависит от сезона и готовности судна. Хорошо подготовленное путешествие начинается с расспросов задолго до выхода за ворота.</p>
<p>Припасы считают до следующего надёжного места покупки, а не до точки, обозначенной на карте. Вода может оказаться негодной, постоялый двор — переполненным, хозяин переправы — уехать за новым канатом. Возчик везёт запасную ось, пеший путник бережёт обувь, всадник ищет корм для животного. Подготовка не избавляет от неожиданностей, но оставляет время с ними справиться.</p>
<p>На границе выясняют, кому платить сбор, где разрешено останавливаться и чьи знаки власти здесь признают. Чужая речь сама по себе не означает опасности, а знакомый герб не гарантирует честного приёма. Идущие одним путём люди часто объединяются ради ночлега, присмотра за поклажей и обмена сведениями. Продолжать дорогу вместе разумнее после разговора о темпе, расходах и обязанностях.</p></section><section id="text-adventurers-work"><h2>Три пути к работе</h2><p>Открытый наём ищут через городскую управу, у торговцев и караванных хозяев, а также при храмах и общинных домах. В управе нужны люди для поручений за пределами обычной службы. Торговцы нанимают сопровождающих и тех, кто умеет обращаться с грузом. Общины ищут проводников, посыльных и помощников там, где постоянных работников недостаточно.</p>
<p>До согласия выясняют, что предстоит сделать, кто принимает результат и когда платят. Остальное многое расскажет само место: состояние повозок, настроение работников, готовность хозяина назвать опасный участок дороги. Надёжный наём начинается с ясного разговора, а не с красивого объявления.</p>
<p>Иногда знакомство начинается без объявления: у ворот лопается ремень, корзины катятся с телеги, и несколько прохожих помогают удержать испуганное животное. Пока груз собирают, хозяин замечает, кто умеет обращаться с упряжью, а кто спокойно распоряжается в суматохе. Работа достаётся людям, которых успели увидеть в деле.</p></section><section id="text-stories-by-fire"><h2>Вести у ночного огня</h2><p>По вечерам путники сравнивают то, что слышали о дороге. Моряк узнаёт примету знакомого мыса в рассказе сухопутного торговца, а уроженец гор смеётся над чужим преувеличением снегов. Сведения быстро обрастают подробностями: ссора двух стражников становится бунтом гарнизона, необычный зверь — чудовищем размером с дом.</p>
<p>Полезнее всего расспросить о том, что рассказчик видел сам: где ночевал, как выглядела переправа, у кого покупал еду. Не стоит пренебрегать и простой любезностью. Человек охотнее поделится свежей новостью с тем, кто помог развести огонь или подвинулся на скамье, чем с незнакомцем, потребовавшим ответов с порога.</p></section><section id="text-your-character"><h2>Герой перед первым шагом</h2><p>Выбирая родину персонажа, подумайте, какую часть её жизни он действительно знает. Ребёнок портового грузчика и воспитанник дворянского дома смотрят на один город с разных сторон. Определите привычное занятие, несколько близких людей и обязательство, которое не исчезнет после ухода из дома. Иногда достаточно одной вещи, которую герой взял с собой, чтобы понять, что для него важно.</p>
<p>Повод отправиться в путь может быть скромным: поиск работы, желание учиться, семейное поручение или надежда начать заново. Важнее понять, почему герой согласится сотрудничать с другими и что он способен предложить спутникам помимо оружия. Умение читать счёт, чинить одежду, ухаживать за животными или слушать незнакомых людей придаёт приключениям собственный облик.</p>
<p>Перед созданием листа согласуйте с мастером доступные народы, классы и источники правил, редакцию игры, уровень и место начала. Наличие народа в энциклопедии ещё не означает, что его можно выбрать для любой партии. Отдельно обсудите, насколько подробно вы хотите играть религиозное давление, войну и общественные преследования. История происхождения должна помогать совместной игре, а не ставить её участников перед неприятной неожиданностью.</p></section><section id="text-first-party"><h2>Прежние авантюристы</h2><p>Путь этой группы начался в <a class="wiki-link entity-link" href="#text-swabia">Швабии</a> и продолжился в Великом лесу <a class="wiki-link entity-link" href="#text-darkness-forest">Даркнес</a>. Совместные приключения принесли её участникам признание аристократов и оставили след в жизни лесных поселений. После завершения похода каждый выбрал собственное занятие, сохранив память о людях, с которыми делил дорогу.</p></section><section id="text-kibat"><h2>Кибат</h2><p>Полуэльфийка-друид Кибат — одна из четырёх авантюристов, чей общий путь начался в <a class="wiki-link entity-link" href="#text-swabia">Швабии</a> и продолжился в Даркнесе. В памяти о группе её имя стоит рядом с именами Бьёрна, Конрада и Кевина: известность пришла к ним через совместные приключения и признание людей, видевших их дела. Лесная история стала важной частью этого пути, а жизнь Кибат после неё сохранила тесную связь с природой.</p>
<p>После лесного приключения Кибат стала чаще останавливаться в поселениях у лесной окраины. Она помогает ухаживать за садами, учит различать растения и расспрашивает местных жителей об изменениях вокруг. Приглашение за стол ценит больше торжественного приёма. Кибат по-прежнему уходит в дорогу, но теперь охотнее возвращается туда, где её ждут не ради необычного зрелища, а ради совместной работы.</p></section><section id="text-bjorn"><h2>Бьёрн Торсен</h2><p>Человек-варвар Бьёрн Торсен вошёл в историю прежнего отряда вместе с <a class="wiki-link entity-link" href="#text-kibat">Кибат</a>, Конрадом и Кевином. Их известность выросла в <a class="wiki-link entity-link" href="#text-swabia">Швабии</a>, затем дорога привела группу в Великий лес <a class="wiki-link entity-link" href="#text-darkness-forest">Даркнес</a>. Признание аристократов стало частью общей репутации спутников. После похода Бьёрн нашёл применение своему опыту в деле, где от выдержки и подготовки зависит благополучие людей, отправляющихся в дорогу.</p>
<p>После Даркнеса Бьёрн занялся подготовкой охранников, сопровождающих обозы. На занятиях начинает с простой вещи: проверить ремень, осмотреть повозку, убедиться, что спутник ещё держится на ногах. Он продолжает выходить в дорогу, но реже берётся за работу ради одного желания испытать себя. Ему нравится видеть, как люди, прежде боявшиеся первого перехода, возвращаются домой с честно заработанной платой.</p></section><section id="text-konrad"><h2>Конрад Кринжевальд</h2><p>Высший эльф и колдун Конрад Кринжевальд принадлежал к прежнему отряду авантюристов <a class="wiki-link entity-link" href="#text-swabia">Швабии</a>. Рядом с ним прошли этот путь Бьёрн, <a class="wiki-link entity-link" href="#text-kibat">Кибат</a> и Кевин; лесное приключение в Даркнесе стало частью их общей истории. Известность среди знати связывала Конрада с людьми далеко за пределами одной дороги. В дальнейшей жизни эти знакомства помогли ему найти занятие, требующее терпения и внимательного отношения к чужим словам.</p>
<p>После похода Конрад вернулся к книгам и занялся проверкой сомнительных рукописей для частных собирателей. Он выясняет происхождение текста, ищет подменённые страницы и старается отделять полезное знание от торгового обмана. Сложное приобретение может снова отправить его в дорогу. Теперь Конрад охотнее спрашивает очевидцев и ремесленников: в их кратком объяснении иногда находится то, чего нет в длинном трактате.</p></section><section id="text-kevin"><h2>Кевин Акранех</h2><p>Полуэльф-следопыт Кевин Акранех путешествовал с маленьким дракончиком, занимавшим в его жизни место близкого спутника. Его имя связано со швабскими приключениями прежнего отряда и походом в Великий лес <a class="wiki-link entity-link" href="#text-darkness-forest">Даркнес</a>. Вместе с Бьёрном, <a class="wiki-link entity-link" href="#text-kibat">Кибат</a> и Конрадом он заслужил репутацию, которую помнят за пределами круга ближайших знакомых. Небольшого дракона рядом с путником узнавали даже те, кому ещё не довелось услышать всю историю группы.</p>
<p>После Даркнеса Кевин продолжил водить небольшие компании путников. Он оставляет хозяевам постоялых дворов короткие дорожные заметки, помогает приезжим выбрать посильный переход и не обещает лёгкого пути только ради найма. Дракончик остаётся рядом, привлекая любопытные взгляды на остановках. Кевин не ищет постоянного места при дворе: ему привычнее узнавать знакомую крышу издалека и обнаруживать, что хозяева помнят его имя.</p></section><section id="text-index"><h2>Предметный указатель</h2><ul><li><strong>Аврелия и Аврелон, Вестария и Вестран, Кардания и Карден, Миреллия и Мирелл</strong> — <a class="wiki-link" href="#text-history-empire">Рождение империи</a>.</li><li><strong>Аделина де Ренн</strong> — <a class="wiki-link" href="#text-bretnos">Бретнос</a>; <strong>Эдрик Арден</strong> — <a class="wiki-link" href="#text-normania">Нормания</a>.</li><li><strong>Альбен</strong> — <a class="wiki-link" href="#text-alben">республика мастерских</a>; <strong>Везер</strong> — <a class="wiki-link" href="#text-vezer">торговый полис</a>.</li><li><strong>Божья область, Папство, Ватитан, Климент IV</strong> — <a class="wiki-link" href="#text-holy-region">церковное государство</a>.</li><li><strong>Бьёрн Торсен, Кевин Акранех, Кибат, Конрад Кринжевальд</strong> — <a class="wiki-link" href="#text-first-party">прежние авантюристы</a>.</li><li><strong>Валенвуд</strong> — <a class="wiki-link" href="#text-valenwood">государство общин</a>; <strong>Эльфсвейр</strong> — <a class="wiki-link" href="#text-elfsweyr">островная корона</a>.</li><li><strong>Галич, Радован Велеславич</strong> — <a class="wiki-link" href="#text-galich">великое вождество</a>.</li><li><strong>Даркнес</strong> — <a class="wiki-link" href="#text-darkness-forest">великий лес</a>.</li><li><strong>Дун Мороз, северная стена</strong> — <a class="wiki-link" href="#text-dun-moroz">государство</a> и <a class="wiki-link" href="#text-history-northern-wall">северная история</a>.</li><li><strong>Звас</strong> — <a class="wiki-link" href="#text-zvas">утраченная родина</a>; <strong>тифлинги</strong> — <a class="wiki-link" href="#text-tieflings">новая жизнь переселенцев</a>.</li><li><strong>Керрилон, Хребетон, Ящеровод, Броневаз</strong> — <a class="wiki-link" href="#text-dragonborn-clans">кланы драконорождённых</a>.</li><li><strong>Клятва двух корон</strong> — <a class="wiki-link" href="#text-history-two-crowns-oath">история союза</a>.</li><li><strong>Колизей</strong> — <a class="wiki-link" href="#text-coliseum">крупнейший полис</a>.</li><li><strong>Митра</strong> — <a class="wiki-link" href="#text-mitra">учение церкви</a>; <strong>Тир, Мистра, Сильванус, Вокин, Бэйн, Шар</strong> — <a class="wiki-link" href="#text-common-pantheon">боги и почитание</a>.</li><li><strong>Нафир ас-Сахл, Самира аль-Райя, табакси, трикрины</strong> — <a class="wiki-link" href="#text-xerian-confederation">песчаная конфедерация</a>.</li><li><strong>Октаниус, Северин Октаниус</strong> — <a class="wiki-link" href="#text-octanius">империя</a>; <strong>Осень закрытых переправ</strong> — <a class="wiki-link" href="#text-history-closed-crossings">завоевание Вестарии</a>.</li><li><strong>Одежда, вещи, еда</strong> — <a class="wiki-link" href="#text-clothes-and-objects">дорожный наряд</a> и <a class="wiki-link" href="#text-food-and-hospitality">общий стол</a>.</li><li><strong>Порт Сити и Порт Итчи</strong> — <a class="wiki-link" href="#text-two-islands">Государство Двух Островов</a>.</li><li><strong>Полуэльфы, эльфы и феи</strong> — <a class="wiki-link" href="#text-elves-and-fairies">происхождение и общество</a>.</li><li><strong>Римурис</strong> — <a class="wiki-link" href="#text-rimuris">собрания граждан</a>; <strong>Вотерстоун</strong> — <a class="wiki-link" href="#text-waterstone">город гаваней</a>.</li><li><strong>Тевтония, Освальд Верен</strong> — <a class="wiki-link" href="#text-teutonia">земли ордена</a>.</li><li><strong>Три великих училища магов</strong> — <a class="wiki-link" href="#text-magic-schools">независимое учреждение</a>.</li><li><strong>Халфлинг</strong> — <a class="wiki-link" href="#text-halfling-kingdom">королевство полуросликов</a>.</li><li><strong>Швабия, Людвиг Ротен</strong> — <a class="wiki-link" href="#text-swabia">герцогство</a>.</li><li><strong>Праздники и домашние обряды</strong> — <a class="wiki-link" href="#text-faith-open-hearths">Дни открытых очагов</a>, <a class="wiki-link" href="#text-faith-market-memory">площадь и вечер памяти</a>.</li><li><strong>Путешествия и работа</strong> — <a class="wiki-link" href="#text-journeys">дорога</a>, <a class="wiki-link" href="#text-adventurers-work">три пути к найму</a>, <a class="wiki-link" href="#text-your-character">подготовка героя</a>.</li></ul></section></div></noscript>
